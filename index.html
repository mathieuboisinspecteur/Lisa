<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lisa — Inspection en bâtiment</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f4c5c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lisa">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#eef2f1;--card:#fff;--ink:#14272b;--mut:#5b6e72;--pri:#0f4c5c;--acc:#e08a00;--red:#c0392b;--ok:#2e7d4f;--line:#d3dcdc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a1d;--card:#16282c;--ink:#e6eeee;--mut:#93a7aa;--pri:#4fb3c8;--line:#2a4046}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Bahnschrift,"Segoe UI",system-ui,sans-serif;max-width:640px;margin:auto;padding:14px}
h1{font-size:30px;margin:6px 0 2px;letter-spacing:-.5px}h2{font-size:20px;margin:14px 0 8px}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
button,.btn{font:inherit;border:0;border-radius:10px;padding:11px 16px;background:var(--pri);color:#fff;cursor:pointer;display:inline-block}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) button,:root:not([data-theme="light"]) .btn{color:#06181c}:root:not([data-theme="light"]) button.alt{color:var(--pri)}:root:not([data-theme="light"]) button.sec,:root:not([data-theme="light"]) button.tile,:root:not([data-theme="light"]) button.key{color:var(--ink)}}
button:disabled{opacity:.4;cursor:default}
.key{padding:16px 0;font-size:20px;text-align:center;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px}.key.op{background:var(--line)}.key.eq{background:var(--pri);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);padding:12px;min-height:88px;line-height:1.25}.tile span{font-size:24px}.tile small{color:var(--mut);font-size:12px}.grid2>.tile:last-child:nth-child(odd){grid-column:1/-1;min-height:72px}button.rec,:root:not([data-theme="light"]) button.rec{background:#c62828;color:#fff;animation:recp 1.4s ease-in-out infinite}@keyframes recp{50%{opacity:.75}}@media(prefers-reduced-motion:reduce){button.rec{animation:none}}
button.alt{background:transparent;color:var(--pri);border:1px solid var(--pri)}
button.warn{background:var(--acc);color:#1d1400}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.big{display:block;width:100%;text-align:left;padding:16px;margin:8px 0;font-size:18px}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 3px}
input,textarea,select{width:100%;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
textarea{min-height:70px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sec{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);margin:6px 0;text-align:left}
.dot{width:12px;height:12px;border-radius:50%;background:var(--red);flex:none}.dot.ok{background:var(--ok)}
.pill{font-size:13px;border-radius:99px;padding:2px 10px;background:var(--line);color:var(--ink)}
img.ph{max-width:100%;border-radius:8px;margin-top:6px}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
.modal .card{max-width:420px;width:100%}
.rep{background:#fff;color:#000;padding:18px;border-radius:6px;font-family:Georgia,serif}
.rep h2{color:#000}.rep .pg{border-bottom:1px dashed #999;padding-bottom:14px;margin-bottom:14px}
.rep .hd{font-size:12px;color:#444;border-bottom:1px solid #000;margin-bottom:10px;padding-bottom:4px}
.legal{font-size:12px;color:#333}
@page{margin:22mm 15mm}
@media print{body{max-width:none;padding:0;background:#fff}.noprint{display:none!important}.rep{padding:0}.rep .pg{break-after:page;border:0}.rep .pg:last-child{break-after:auto}.rep .hd{position:running(hd)}@page{@bottom-center{content:"Page " counter(page) " sur " counter(pages)}}}
canvas{touch-action:none;width:100%;display:block;border-radius:12px}.dsc-box{margin:6px 0 10px}details.dsc{border:1px solid var(--line);border-radius:10px;margin:6px 0;padding:0 12px;background:var(--card)}details.dsc>summary{cursor:pointer;display:flex;gap:10px;justify-content:space-between;align-items:baseline;padding:11px 0;font-weight:600;list-style:none}details.dsc>summary::-webkit-details-marker{display:none}details.dsc>summary .mut{font-weight:400;font-size:13px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%}.dsc-ch{display:flex;flex-wrap:wrap;gap:8px;padding:0 0 12px}.dch{font:inherit;font-size:14px;border-radius:999px;padding:7px 12px;cursor:pointer;background:transparent;color:var(--ink);border:1px solid var(--line)}.dch.on{background:var(--pri);border-color:var(--pri);color:#fff}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dch{color:var(--ink)}:root:not([data-theme="light"]) .dch.on{color:#06181c}}:root[data-theme="dark"] .dch.on{color:#06181c}.scth{display:flex;gap:10px;overflow-x:auto;padding:10px 0}.scp{flex:0 0 auto;width:110px}.scp img{width:110px;height:140px;object-fit:cover;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script></head><body>
<div id="app"></div>
<script>
const SECTIONS=["Structure","Extérieur","Toiture","Plomberie","Électricité","Chauffage","Climatisation","Intérieur","Isolation / ventilation"];
const LEGAL=["Mandat d'inspection visuelle : l'inspection est limitée à ce qui est visible et accessible le jour de la visite, conformément à la norme BNQ 3009-500. Elle n'est ni une garantie ni une expertise.","Vices cachés : les éléments occultés ou non accessibles (derrière les murs, sous les finis, etc.) n'ont pu être évalués.","Déclaration du vendeur : le rapport complète la Déclaration du Vendeur et ne la remplace pas.","Zones inaccessibles : toute zone non inspectée est précisée dans le rapport; elle n'a pas fait l'objet de l'inspection."];
let S={list:[],cur:null,view:"home",sec:null,q:""};
try{S.list=JSON.parse(localStorage.getItem("lisa")||"[]")}catch(e){}
S.nt=[];try{S.nt=JSON.parse(localStorage.getItem("lisa_nt")||"[]")}catch(e){}if(!Array.isArray(S.nt))S.nt=[];
const NT={on:0,r:null,lang:"fr-CA",sil:0,blk:0};try{NT.blk=localStorage.getItem("lisa_micblk")?1:0}catch(e){}
const save=()=>{if(IDB.db){if(S.prof)IDB.set("prof",S.prof).catch(()=>{});if(S.cn)IDB.set("cn",S.cn).catch(()=>{});IDB.set("list",S.list).catch(()=>alert("Impossible d'enregistrer : espace insuffisant sur l'appareil."))}else{try{localStorage.setItem("lisa",JSON.stringify(S.list))}catch(e){alert("Stockage plein : exporte une sauvegarde et retire quelques photos.")}}};
const $=id=>document.getElementById(id);
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cur=()=>{const i=S.list.find(x=>x.id===S.cur);if(i&&i.sections)SECTIONS.forEach(n=>{if(!i.sections[n])i.sections[n]={constats:[],rien:false}});return i};
const go=(v,x)=>{S.view=v;if(x!==undefined)S.sec=x;render();scrollTo(0,0)};
function newInsp(){const i={id:Date.now(),client:{},sections:{},zones:"",modifs:[],created:new Date().toISOString(),status:"en cours",summary:"",locked:false};SECTIONS.forEach(s=>i.sections[s]={constats:[],rien:false});i.time={sec:0,run:true,t0:Date.now()};S.list.unshift(i);S.cur=i.id;save();go("fiche")}
function open(id,v){S.cur=id;go(v)}
function bind(obj,k){return e=>{obj[k]=e.target.value;save()}}
function inp(l,o,k,t){const id="f"+Math.random().toString(36).slice(2);setTimeout(()=>{const el=$(id);if(el)el.oninput=bind(o,k)},0);return `<label for="${id}">${l}</label><input id="${id}" type="${t||"text"}" value="${esc(o[k])}">`}
function render(){if(NT.on)ntStop();if(typeof DICT!=="undefined"&&DICT)dictStop();AN=null;PH=[];const a=$("app");a.innerHTML=({home,regime,lexique,fiche,tour,section,review,report,old,bouclier,outils,pedago,risques,entente,profil,trad,facture,factures,agenda,clients,conformite,messages,calc,notes,scan})[S.view]();tbar()}
function home(){const n=S.list.filter(i=>i.status==="en cours").length;return `<h1>Lisa</h1><div class="mut">Inspection en bâtiment · Québec · Standard C.E.I.</div>
<button class="big" onclick="newInsp()">✨ Nouvelle inspection</button>
<button class="big alt" onclick="S.cur=(S.list.find(i=>i.status==='en cours')||{}).id;S.cur?go('tour'):alert('Aucune inspection en cours.')">🔄 Inspection en cours <span class="pill">${n}</span></button>
<button class="big alt" onclick="go('old')">📂 Anciennes inspections</button>
<h2>Gestion</h2><div class="grid2"><button class="tile" onclick="go('agenda')"><span>📅</span>Agenda des visites</button><button class="tile" onclick="go('clients')"><span>👥</span>Clients</button><button class="tile" onclick="go('factures')"><span>🧾</span>Facturation</button><button class="tile" onclick="go('trad')"><span>🌐</span>Traducteur FR / EN</button><button class="tile" onclick="go('profil')"><span>👤</span>Mon profil<small>logo, sceau, signature</small></button><button class="tile" onclick="go('calc')"><span>🧮</span>Calculatrice<small>et convertisseur</small></button><button class="tile" onclick="go('lexique')"><span>📖</span>Lexique FR / EN<small>termes de l'inspection</small></button><button class="tile" onclick="openRg('home')"><span>🏛️</span>Quel code s'applique ?<small>régime et partie du Code</small></button><button class="tile" onclick="openNotes('home')"><span>🎙️</span>Notes vocales<small>${(S.nt||[]).length?(S.nt.length+" note"+(S.nt.length>1?"s":"")):"dicte, ça s'écrit en note"}</small></button></div>${bkCard()}<p class="mut">Prototype : tes données restent sur cet appareil. Aucune estimation de coûts de réparation n'est produite.</p><p class="mut" style="font-size:12px">Version du 30 oct. 2026 · rapport web</p>`}
function old(){const q=S.q.toLowerCase();const l=S.list.filter(i=>i.status!=="en cours"&&(i.client.nom+" "+i.client.adresse).toLowerCase().includes(q));
setTimeout(()=>{const s=$("q");if(s)s.oninput=e=>{S.q=e.target.value;render();$("q").focus()}},0);
return `<button class="alt" onclick="go('home')">← Accueil</button><h2>Anciennes inspections</h2><input id="q" placeholder="Chercher par nom ou adresse" value="${esc(S.q)}">`+(l.length?l.map(i=>`<div class="card"><b>${esc(i.client.nom)||"Sans nom"}</b><div class="mut">${esc(i.client.adresse)} · ${new Date(i.created).toLocaleDateString("fr-CA")} · ⏱ ${tfmt(tel(i))}</div><div class="row" style="margin-top:8px"><button class="alt" onclick="open(${i.id},'report')">Voir le rapport</button><button class="warn" onclick="askEdit(${i.id})">Modifier</button></div>${i.modifs.length?`<div class="mut">Modifié ${i.modifs.length} fois (dernière : ${new Date(i.modifs.at(-1)).toLocaleString("fr-CA")})</div>`:""}</div>`).join(""):`<p class="mut">Aucun rapport archivé pour l'instant. Termine une inspection pour la retrouver ici.</p>`)}
function askEdit(id,step=1){const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="card"><h2>${step==1?"Modifier ce rapport ?":"Dernière confirmation"}</h2><p>${step==1?"La modification sera horodatée dans la piste d'audit.":"Confirme à nouveau : le rapport archivé sera rouvert et la date de modification enregistrée."}</p><div class="row"><button class="alt" id="n">Annuler</button><button class="warn" id="y">${step==1?"Continuer":"Confirmer"}</button></div></div>`;document.body.appendChild(m);$("n").onclick=()=>m.remove();$("y").onclick=()=>{m.remove();if(step==1)askEdit(id,2);else{const i=S.list.find(x=>x.id===id);i.modifs.push(new Date().toISOString());i.status="en cours";save();open(id,"tour")}}}
function fiche(){const i=cur(),c=i.client;return `<button class="alt" onclick="go('home')">← Accueil</button><h2>Fiche d'identification</h2><div class="card">${inp("Nom complet du client",c,"nom")}${inp("Adresse de la maison",c,"adresse")}${inp("Téléphone",c,"tel","tel")}${inp("Courriel",c,"courriel","email")}${inp("Numéro de dossier",c,"dossier")}<div class="row" style="margin:-4px 0 8px"><button type="button" class="alt" onclick="genNum('H')">Générer : bâtiment (H)</button><button type="button" class="alt" onclick="genNum('C')">Générer : condo (C)</button></div>${inp("Date de l'inspection",c,"date","date")}${inp("Heure de début de l'inspection",c,"hdeb","time")}${inp("Heure de fin de l'inspection",c,"hfin","time")}${meteoSel(c)}${inp("Syndicat de copropriété (si applicable)",c,"syndicat")}<div class="mut" style="margin-top:-4px">Copropriété divise : demande à ton client d'informer le syndicat de la date de l'inspection.</div><label for="pres">Personnes présentes ou disponibles sur les lieux (nom et rôle)</label><textarea id="pres" oninput="cur().presents=this.value;save()">${esc(i.presents)}</textarea><label for="dsc">Description sommaire du bâtiment (type, fondation, revêtement, toiture, chauffage…)</label>${dscPick(i)}<textarea id="dsc" oninput="cur().desc=this.value;save()">${esc(i.desc)}</textarea><label for="dvv">Renseignements reçus verbalement (vendeur, courtier, propriétaire), autres que ceux de la Déclaration du vendeur</label><textarea id="dvv" oninput="cur().dvv=this.value;save()">${esc(i.dvv)}</textarea>${dictBtn("dvv")}<label for="cvp">Photo du bâtiment (page couverture)</label><input id="cvp" type="file" accept="image/*" onchange="setCover(this.files)">${i.cover?`<img class="ph" src="${i.cover}" alt="Photo du bâtiment">`:""}<label for="lg">Langue du rapport PDF</label><select id="lg" onchange="cur().lang=this.value;save()"><option value="fr" ${i.lang!=="en"?"selected":""}>Français</option><option value="en" ${i.lang==="en"?"selected":""}>English</option></select></div><button class="alt" onclick="openRg('fiche')">🏛️ Quel code s'applique à ce bâtiment ?</button><button onclick="go('entente')">Continuer : entente de service</button>`}
function tour(){const i=cur();return `<button class="alt" onclick="go('home')">← Accueil</button><h2>Tour de la maison</h2>${(i.ent&&i.ent.sig&&i.ent.ok)?"":`<button class="big warn" onclick="go('entente')">⚠ Entente de service non signée. Touche ici</button>`}<div class="mut">${esc(i.client.nom)} · ${esc(i.client.adresse)}</div><div class="card" style="padding:0"><canvas id="h3d" height="260"></canvas><div class="mut" style="padding:8px 12px">Glisse pour tourner, touche une partie ou une pastille pour ouvrir sa section. Pastille rouge : à compléter. Verte : complétée.</div><div class="row" style="padding:0 12px 12px"><button class="${i.etages===2?"alt":""}" onclick="cur().etages=1;save();render()">Bungalow</button><button class="${i.etages===2?"":"alt"}" onclick="cur().etages=2;save();render()">2 étages</button></div></div><h2>Sections à inspecter</h2>`+SECTIONS.map(s=>{const d=i.sections[s],ok=d.constats.length||d.rien||d.na;return `<button class="sec" onclick="go('section','${s}')"><span>${s}</span><span class="row"><span class="pill">${d.na?"N/A":d.constats.length+" constat"+(d.constats.length>1?"s":"")}</span><span class="dot ${ok?"ok":""}"></span></span></button>`}).join("")+`<h2>Outils de terrain</h2><div class="grid2"><button class="tile" onclick="go('bouclier')"><span>🛡️</span>Bouclier juridique<small>${(i.zl||[]).length} zone(s) non inspectée(s)</small></button><button class="tile" onclick="go('outils')"><span>🧰</span>Journal des outils<small>${(i.tl||[]).length} consigné(s)</small></button><button class="tile" onclick="go('risques')"><span>🗺️</span>Risques et signes<small>${RR.filter(r=>!((i.rr||{})[r.k]&&i.rr[r.k].st&&i.rr[r.k].st!=="Non vérifié")).length} à vérifier</small></button><button class="tile" onclick="go('messages')"><span>✉️</span>Messages au client</button><button class="tile" onclick="go('scan')"><span>📄</span>Scanner un document<small>${(i.scans||[]).length} au dossier</small></button><button class="tile" onclick="openNotes('tour')"><span>🎙️</span>Notes vocales<small>${(S.nt||[]).filter(n=>n.insp===i.id).length} pour ce dossier</small></button></div><h2>Avant de terminer</h2><div class="grid2"><button class="tile" onclick="go('conformite')"><span>✅</span>Conformité et documents<small>${confSum(i)}</small></button><button class="tile" onclick="S.pi=0;go('pedago')"><span>🎓</span>Visite guidée du client</button></div><button class="big" style="margin-top:14px" onclick="go('review')">Terminer et réviser →</button>`+(setTimeout(()=>{const z=$("z");if(z)z.oninput=bind(i,"zones");init3d(i)},0),"")}
function section(){const i=cur(),d=i.sections[S.sec];return `<button class="alt" onclick="go('tour')">← Tour de la maison</button><h2>${S.sec}</h2>`+d.constats.map((c,n)=>`<div class="card"><b>${esc(c.comp)}</b><p><b>Anomalie :</b> ${esc(c.ano)}</p>${c.role?`<p><b>Rôle :</b> ${esc(c.role)}</p>`:""}<p><b>Conséquence :</b> ${esc(c.cons)}</p><p><b>Recommandation :</b> ${esc(c.rec)}</p>${c.photo?`<img class="ph" src="${c.photo}" alt="Photo du constat">`:""}<button class="alt" onclick="delC(${n})">Supprimer</button></div>`).join("")+`<div class="card"><h2 style="margin-top:0">Nouveau constat</h2><button class="alt" onclick="dicter()">🎤 Dicter les 5 étapes</button><div id="dic" class="mut" style="margin-top:6px"></div><label for="c1">1. Identification de la composante</label><input id="c1"><label for="c2">2. Anomalie / symptôme</label><textarea id="c2"></textarea><label for="cr">3. Rôle de la composante (à quoi elle sert)</label><textarea id="cr" placeholder="Ex. : retient la terre et soutient la maison"></textarea><label for="c3">4. Conséquence / impact (le risque, puis ce qui peut arriver avec le temps)</label><textarea id="c3"></textarea><label for="c4">5. Recommandation (sans cause, sans méthode de réparation, sans coûts)</label><textarea id="c4"></textarea><div class="row" style="margin-top:8px"><button class="alt" type="button" onclick="chkForm()">🔎 Vérifier la formulation</button></div><div id="chkx" class="mut" role="status" aria-live="polite" style="margin-top:6px"></div><label for="ph">Photo</label><input id="ph" type="file" accept="image/*" capture="environment" onchange="loadAN(this.files[0])"><div id="anbox"></div><label for="lgd">Légende des photos (ce qu'on voit et où)</label><input id="lgd" placeholder="Ex. : fissure horizontale, mur nord du sous-sol"><div style="margin-top:10px"><button onclick="addC()">Ajouter le constat</button></div></div><label class="row" style="margin:12px 0"><input type="checkbox" style="width:auto" ${d.rien?"checked":""} onchange="cur().sections[S.sec].rien=this.checked;save();render()"> Aucune anomalie observée dans cette section</label>`}
function delC(n){cur().sections[S.sec].constats.splice(n,1);save();render()}
function addC(){const c={comp:$("c1").value.trim(),ano:$("c2").value.trim(),cons:$("c3").value.trim(),rec:$("c4").value.trim(),role:($("cr")||{value:""}).value.trim()};if(!c.comp||!c.ano||!c.cons||!c.rec){alert("Remplis les 4 étapes du constat.");return}
if(AN){c.photo=AN.cv.toDataURL("image/jpeg",.75);AN=null;cur().sections[S.sec].constats.push(c);save();render();return}
const f=$("ph").files[0],done=()=>{cur().sections[S.sec].constats.push(c);save();render()};
if(!f)return done();const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,800/im.width),cv=document.createElement("canvas");cv.width=im.width*k;cv.height=im.height*k;cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);c.photo=cv.toDataURL("image/jpeg",.7);done()};im.src=r.result};r.readAsDataURL(f)}
function review(){const i=cur(),vides=SECTIONS.filter(s=>!(i.sections[s].constats.length||i.sections[s].rien||i.sections[s].na)),n=SECTIONS.reduce((t,s)=>t+i.sections[s].constats.length,0);

function pedago(){const i=cur(),N=SECTIONS.length;S.pi=S.pi||0;
const all=SECTIONS.flatMap(s=>i.sections[s].constats.map(c=>({...c,sec:s})));
const nav=`<div class="row" style="margin:14px 0"><button class="alt" ${S.pi?"":"disabled"} onclick="S.pi--;render();scrollTo(0,0)">← Précédent</button><button ${S.pi>N?"disabled":""} onclick="S.pi++;render();scrollTo(0,0)">Suivant →</button><button class="alt" onclick="S.pi=0;go('tour')">Quitter</button></div>`;
if(S.pi===0){const cnt=p=>all.filter(c=>(c.prio||"À surveiller")===p).length;
return `<h2>🎓 Visite guidée</h2><p style="font-size:18px">Voici ce qu'on a observé, section par section, avec des mots simples. ${all.length} constat${all.length>1?"s":""} au total.</p>`+Object.keys(PRIOS).map(p=>`<div class="card" style="border-left:8px solid ${PRIOS[p]}"><b>${p}</b> · ${cnt(p)}<div class="mut">${PDEF[p]}</div></div>`).join("")+nav}
if(S.pi>N){const k=all.filter(c=>["Sécurité","Prioritaire"].includes(c.prio||""));
return `<h2>À retenir</h2>`+(k.length?`<div class="card"><b>Les points à régler en premier</b><ul>${k.map(c=>`<li>${esc(c.comp)} <span class="mut">(${c.sec})</span></li>`).join("")}</ul></div>`:`<div class="card">Aucun point de sécurité ou prioritaire noté.</div>`)+`<div class="card"><b>Bon à savoir</b><p>Cette inspection est visuelle : elle ne couvre pas ce qui est caché ou inaccessible. Aucun coût de réparation n'est estimé ici. Pour les travaux, consulte les spécialistes recommandés.</p></div>`+nav}
const s=SECTIONS[S.pi-1],d=i.sections[s],ph=c=>(c.photos||(c.photo?[c.photo]:[])).map(p=>`<img class="ph" src="${p}" alt="Photo : ${esc(c.comp)}">`).join("");
return `<div class="mut">Étape ${S.pi} sur ${N}</div><h2 style="font-size:26px">${s}</h2>`+(d.constats.length?d.constats.map(c=>{const p=c.prio||"À surveiller";return `<div class="card" style="border-left:8px solid ${PRIOS[p]}"><span class="pill">${p}</span> <b style="font-size:18px">${esc(c.comp)}</b>${c.side?` <span class="mut">(${esc(c.side)})</span>`:""}<p><b>Ce qu'on a vu :</b> ${esc(c.ano)}</p>${c.role?`<p><b>À quoi ça sert :</b> ${esc(c.role)}</p>`:""}<p><b>Pourquoi c'est important :</b> ${esc(c.cons)}</p><p><b>Ce qu'on recommande :</b> ${esc(c.rec)}</p>${ph(c)}</div>`}).join(""):`<div class="card" style="border-left:8px solid var(--ok)">${d.rien?"Rien à signaler dans cette section.":"Cette section n'a pas été complétée."}</div>`)+nav}

const IDB={db:null,open(){return new Promise((res,rej)=>{const r=indexedDB.open("lisa",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},get(k){return new Promise((res,rej)=>{const t=this.db.transaction("kv").objectStore("kv").get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error)})},set(k,v){return new Promise((res,rej)=>{const t=this.db.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}};

const ENTCL=["Nature de l'inspection : visuelle et non destructive, limitée aux éléments accessibles le jour de la visite, selon la norme BNQ 3009-500 (Pratiques pour l'inspection en vue d'une transaction immobilière). L'inspecteur agit à titre de généraliste.","Ce que l'inspection n'est pas : elle ne constitue ni une garantie contre les vices cachés, ni une police d'assurance, ni une garantie d'assurabilité.","Éléments cachés ou inaccessibles : ils ne sont pas inspectés. Les zones non inspectées et leurs raisons sont consignées au rapport.","Déclaration du vendeur : le rapport la complète et ne la remplace pas.","Coûts : le rapport ne contient aucune estimation du coût des réparations.","Utilisation du rapport : il est destiné au client signataire et à l'immeuble désigné. Les renseignements personnels sont traités conformément à la Loi 25.","Expertise technique : l'inspection n'est pas une expertise et ne comprend pas l'intervention de professionnels (ingénieur, entrepreneur spécialisé, etc.). Si une expertise est recommandée, le client choisit son intervenant. Une expertise réalisée par l'inspecteur exige un contrat écrit distinct.","Services additionnels : toute nouvelle visite ou tout service supplémentaire fait l'objet d'une nouvelle entente.","Personnes concernées : le client s'assure que les propriétaires, les locataires et toute autre personne ayant un droit sur le bâtiment sont informés du déroulement de l'inspection et de ses préalables.","Force majeure : l'inspecteur n'est pas responsable d'un retard ou d'une impossibilité d'exécuter l'inspection causés par un événement imprévisible et irrésistible.","Lois applicables : l'entente est régie par les lois du Québec. Si une clause est déclarée invalide, les autres demeurent en vigueur.","Norme de pratique : l'inspecteur respecte la norme BNQ 3009-500 (édition 2022 R1) à chaque étape de l'inspection, y compris la signature du rapport d'inspection.","Conflit d'intérêts : l'inspecteur divulgue par écrit toute situation d'apparence de conflit d'intérêts dès qu'il la constate. Il ne réalise pas l'inspection sans cette divulgation et sans le consentement écrit du client.","Collaboration : si l'inspecteur s'adjoint un autre titulaire de certificat pour une partie de l'inspection, il conserve la direction et la responsabilité de l'inspection (art. 2101 C.c.Q.), y participe activement et signe le rapport.","Responsabilité : l'inspecteur titulaire du certificat et, le cas échéant, l'entreprise au nom de laquelle il contracte sont solidairement responsables des obligations prévues à l'entente. Aucune clause de l'entente n'exclut la responsabilité civile prévue par le droit commun.","Dossier et confidentialité : le dossier d'inspection est conservé au moins 6 ans. Le rapport et le dossier ne sont remis à un tiers qu'avec le consentement écrit du client, sauf exceptions prévues par la loi. Le client reçoit une copie de l'entente dans les 15 jours suivant sa signature.","Le client confirme avoir lu et compris la portée de l'entente et les limites de l'inspection."];
function sigPad(cv,o){const w=cv.clientWidth||320;cv.width=w;cv.height=150;const x=cv.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,150);x.lineWidth=2.2;x.lineCap="round";x.strokeStyle="#000";

let dr=0;const p=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};

let DICT=null;
function dictBtn(id){const ok=!!(window.SpeechRecognition||window.webkitSpeechRecognition);
return `<div class="row" style="margin-top:6px"><button type="button" class="btn alt" id="${id}_mic" onclick="dictToggle('${id}')">🎙 Dicter</button></div><div class="mut" id="${id}_st" style="margin-top:4px;font-size:13px">${ok?"Appuie sur Dicter et parle ; le texte s'ajoute à la suite.":"Dictée non disponible dans ce navigateur : utilise le micro du clavier (Gboard)."}</div>`}
function dictSt(id,t){const e=document.getElementById(id+"_st");if(e)e.textContent=t}
function dictStop(){if(!DICT)return;const d=DICT;DICT=null;try{d.rec.onend=null;d.rec.stop()}catch(e){}const b=document.getElementById(d.id+"_mic");if(b){b.textContent="🎙 Dicter";b.style.background="";b.style.color=""}}
function dictToggle(id){
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(DICT){const same=DICT.id===id;dictStop();dictSt(id,"Dictée arrêtée.");if(same)return}
if(!SR){dictSt(id,"Dictée non disponible ici : utilise le micro du clavier de ton téléphone (Gboard).");return}
const ta=document.getElementById(id);if(!ta)return;
const rec=new SR();rec.lang="fr-CA";rec.continuous=true;rec.interimResults=true;
DICT={id,rec};
const b=document.getElementById(id+"_mic");if(b){b.textContent="⏹ Arrêter";b.style.background="#c0392b";b.style.color="#fff"}
dictSt(id,"🔴 J'écoute…");
rec.onresult=ev=>{const el=document.getElementById(id);if(!el){dictStop();return}
let fin="",tmp="";
for(let k=ev.resultIndex;k<ev.results.length;k++){const r=ev.results[k],t=r[0].transcript;if(r.isFinal)fin+=t;else tmp+=t}
if(fin.trim()){const cur0=el.value,sep=cur0&&!/\s$/.test(cur0)?" ":"";el.value=cur0+sep+fin.trim();el.dispatchEvent(new Event("input",{bubbles:true}))}
dictSt(id,tmp?"🔴 "+tmp:"🔴 J'écoute…")};
rec.onerror=ev=>{const m=ev.error==="not-allowed"||ev.error==="service-not-allowed"?"Micro refusé ou bloqué ici. Utilise le micro du clavier (Gboard) ou autorise le micro.":ev.error==="no-speech"?"":ev.error==="audio-capture"?"Aucun micro détecté.":"Dictée interrompue ("+ev.error+").";
if(ev.error==="no-speech")return;dictStop();dictSt(id,m)};
rec.onend=()=>{if(DICT&&DICT.rec===rec){try{rec.start()}catch(e){dictStop();dictSt(id,"Dictée arrêtée.")}}};
try{rec.start()}catch(e){dictStop();dictSt(id,"Impossible de démarrer la dictée.")}}
