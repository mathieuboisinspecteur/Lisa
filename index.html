upports et tuyauterie.", "Ne manœuvre pas les robinets d'arrêt ni les soupapes de sûreté."], "Électricité": ["Branchement d'entrée (aérien ou souterrain), mise à la terre, coffret principal (intensité inscrite, emplacement), panneaux (protections, capacité affichée, emplacement).", "Ouvre les panneaux seulement si c'est sécuritaire; sinon écris pourquoi. N'insère jamais d'outil ni de sonde dedans.", "Un échantillon d'éclairages, d'interrupteurs et de prises : fonctionnement, polarité, mise à la terre. DDFT : fonctionnement et absence là où il en faut. Disjoncteurs détecteurs d'arc : présence ou absence.", "Câblage de dérivation : vérifie qu'il convient à sa protection (fusible ou disjoncteur)."], "Chauffage": ["Systèmes installés en permanence : source d'énergie, type d'appareil, commandes normales, dispositifs de sécurité, extérieur des cheminées et conduits, distribution (conduits, tuyaux, radiateurs, registres, filtres).", "Fais-les fonctionner avec les commandes normales. Ouvre les panneaux d'accès que le propriétaire ouvre lui-même, sans outil.", "Note s'il y a une source de chaleur permanente dans chaque pièce habitable, le sous-sol non aménagé et le vide sanitaire. Réservoir de combustible : emplacement, année, fuites, supports, tuyauterie.", "Chauffage d'appoint et appareils à combustible solide : hors du mandat de base, sauf entente écrite."], "Climatisation": ["Source d'énergie, type d'appareil et emplacement, drainage de l'eau de condensation, conduits de distribution.", "Fais fonctionner avec les commandes normales. Les appareils amovibles ou portatifs ne sont pas visés."], "Intérieur": ["Murs, planchers, plafonds; marches, escaliers, balcons, garde-corps; armoires et comptoirs; fenêtres et portes intérieures (quincaillerie); séparation entre le garage et les pièces habitables.", "Fais fonctionner un échantillon de fenêtres et de portes : une par pièce.", "Note toute infiltration, tache d'eau ou de condensation et toute trace qui a l'apparence de moisiss let DICT=null;

function dictSt(id,t){const e=document.getElementById(id+"_st");if(e)e.textContent=t}
function dictStop(){if(!DICT)return;const d=DICT;DICT=null;try{d.rec.onend=null;d.rec.stop()}catch(e){}const b=document.getElementById(d.id+"_mic");if(b){b.textContent="🎙 Dicter";b.style.background="";b.style.color=""}}
function dictToggle(id){
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(DICT){const same=DICT.id===id;dictStop();dictSt(id,"Dictée arrêtée.");if(same)return}
if(!SR){dictSt(id,"Dictée non disponible ici : utilise le micro du clavier de ton téléphone (Gboard).");return}
const ta=document.getElementById(id);if(!ta)return;
const rec=new SR();rec.lang="fr-CA";rec.continuous=true;rec.interimResults=true;
DICT={id,rec};
const b=document.getElementById(id+"_mic");if(b){b.textContent="⏹ Arrêter";b.style.background="#c0392b";b.style.color="#fff"}
dictSt(id,"🔴 J'écoute…");
rec.onresult=ev=>{const el=document.getElementById(id);if(!el){dictStop();return}
let fin="",tmp="";
for(let k=ev.resultIndex;k<ev.results.length;k++){const r=ev.results[k],t=r[0].transcript;if(r.isFinal)fin+=t;else tmp+=t}
if(fin.trim()){const cur0=el.value,sep=cur0&&!/\s$/.test(cur0)?" ":"";el.value=cur0+sep+fin.trim();el.dispatchEvent(new Event("input",{bubbles:true}))}
dictSt(id,tmp?"🔴 "+tmp:"🔴 J'écoute…")};
rec.onerror=ev=>{const m=ev.error==="not-allowed"||ev.error==="service-not-allowed"?"Micro refusé ou bloqué ici. Utilise le micro du clavier (Gboard) ou autorise le micro.":ev.error==="no-speech"?"":ev.error==="audio-capture"?"Aucun micro détecté.":"Dictée interrompue ("+ev.error+").";
if(ev.error==="no-speech")return;dictStop();dictSt(id,m)};
rec.onend=()=>{if(DICT&&DICT.rec===rec){try{rec.start()}catch(e){dictStop();dictSt(id,"Dictée arrêtée.")}}};
try{rec.start()}catch(e){dictStop();dictSt(id,"Impossible de démarrer la dictée.")}}

/* ===== Quel code s'applique ? (aide d'étude : diagramme du cours LCN, formulé dans mes mots) ===== */
const RGU=[["A","Réunion (A1 à A4)"],["B","Détention, traitement ou soins (B1 à B3)"],["C","Habitation (C)"],["D","Affaires (D)"],["E","Commercial (E)"],["F2","Industriel risque moyen (F2)"],["F3","Industriel risque faible (F3)"],["F1","Industriel risque très élevé (F1)"]];
function rgCalc(r){const u=r.u||[],et=parseFloat(String(r.et||"").replace(",",".")),ar=parseFloat(String(r.ar||"").replace(",",".")),lg=parseFloat(String(r.lg||"").replace(",","."));

const mixte=u.length>1,abf=u.some(x=>x==="A"||x==="B"||x==="F1"),L=[];let app,why;
if(mixte){app=true;why="Le bâtiment compte plus d'un usage : le Code s'applique d'emblée."}
else if(abf){app=true;why="Un usage du groupe A, B ou F1 : le Code s'applique."}
else{const x=u[0];
 if(x==="C"){if(isNaN(et)||isNaN(lg))return{err:"Indique le nombre d'étages et le nombre de logements."};app=et>2&&lg>8;why=app?"Habitation seulement, avec plus de 2 étages ET plus de 8 logements : le Code s'applique.":"Habitation seulement : pour que le Code s'applique, il faut plus de 2 étages ET plus de 8 logements. Ce n'est pas le cas."}
 else if(x==="D"){if(isNaN(et))return{err:"Indique le nombre d'étages."};app=et>2;why=app?"Établissement d'affaires de plus de 2 étages : le Code s'applique.":"Établissement d'affaires de 2 étages ou moins : le Code ne s'applique pas."}
 else if(x==="E"){if(isNaN(ar))return{err:"Indique l'aire de plancher totale (m²)."};app=ar>300;why=app?"Établissement commercial de plus de 300 m² (3 229 pi²) : le Code s'applique.":"Établissement commercial de 300 m² ou moins : le Code ne s'applique pas."}
 else{app=true;why="Établissement industriel F2 ou F3 : le Code s'applique."}}
L.push(why);
let part;
if(abf){part="Parties 3 à 6";L.push("Avec un usage A, B ou F1, ce sont les parties 3 à 6 du Code.")}
else{if(isNaN(et)||isNaN(ar))return{err:"Indique le nombre d'étages et l'aire du bâtiment (m²) pour trouver la partie du Code.",L};
 if(et>3){part="Parties 3 à 6";L.push("Plus de 3 étages : parties 3 à 6.")}
 else if(ar>600){part="Parties 3 à 6";L.push("Aire de bâtiment de plus de 600 m² (6 458 pi²) : parties 3 à 6.")}
 else{part="Partie 9";L.push("3 étages ou moins ET 600 m² ou moins : partie 9.")}}
return{reg:app?"Régime provincial":"Régime municipal",regd:app?"Le Code de construction s'applique selon son champ d'application.":"Le Code ne s'applique pas selon son champ d'application : on tient pour acquis que la municipalité applique le Code le plus récent (CNB 2020 modifié Québec).",part,L}}
