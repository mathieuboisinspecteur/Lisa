LVB.push(
{k:"plan:lisse",add:"Sur le dessus des murs de béton : un joint jaune, la lisse d'assise (bois) fixée aux boulons, et la solive de rive, une planche verticale à l'extérieur.",
pins:[[38,167,"Lisse d'assise : la première pièce de bois, posée sur le béton et fixée par les boulons d'ancrage."],[38,150,"Solive de rive : elle ferme le côté du plancher, sur tout le pourtour."],[76,180,"Joint d'étanchéité (mousse) entre le béton et le bois, contre l'air et l'humidité."]],
why:"Le bois ne doit pas toucher directement le béton : le béton garde l'humidité et le bois y pourrirait. La lisse fait la jonction entre la fondation et la charpente, et c'est par elle que toute la maison est attachée à son socle.",
how:["On pose un joint (mousse de polyéthylène ou matériau équivalent) sur le dessus du mur : il bloque l'air et coupe les remontées d'humidité.","On pose la lisse (souvent 38 × 89 mm ou 38 × 140 mm, en bois traité si le plan l'exige) sur le joint.","On perce la lisse pour laisser passer les boulons d'ancrage, puis on pose rondelles et écrous et on serre.","On met la lisse de niveau. Si le béton est irrégulier, on cale avec du coulis, pas avec des morceaux de bois (à valider).","On pose la solive de rive tout autour : une planche de la même hauteur que les solives, qui ferme le côté du plancher.","On prévoit déjà l'isolation et l'étanchéité à l'air de la solive de rive : on les verra aux pages Isolation et Pare-air.","On trace sur la lisse la position des solives, à entraxe constant."],
dims:["Lisse : 38 × 89 mm ou 38 × 140 mm, selon le plan.","Boulons d'ancrage : ils pénètrent d'au moins 100 mm environ dans le béton (à valider).","Solive de rive : même hauteur que les solives du plancher."],
err:["Lisse non traitée directement sur un béton humide → pourriture.","Pas de joint → fuites d'air, froid au pourtour du sous-sol, humidité qui monte.","Boulons manquants, rouillés ou écrous mal serrés → la maison est mal retenue.","Lisse pas de niveau → plancher qui ne sera pas de niveau."],
seen:["Au sommet du mur du sous-sol : bois foncé, mou ou moisi (pourriture), boulons rouillés ou écrous absents.","Courants d'air au pourtour du sous-sol, froid sur le dessus du mur.","Insectes ou fourmis charpentières dans le bois humide."],
q:"Pourquoi sépare-t-on le bois du béton ? Que risque-t-on si on oublie le joint d'étanchéité ?",
kw:["lisse","boulon","joint","solive de rive","pourriture","traité"]},

{k:"plan:sol",add:"Une solive est une planche posée sur chant. On en voit une de côté, sur toute sa longueur, appuyée sur la lisse. Les petites diagonales sont des entretoises en X entre les solives. (À la page suivante, on voit la poutre qui les soutient au centre.)",
pins:[[74,182,"Appui de la solive sur la lisse d'assise, au bord du mur de fondation."],[116,182,"Solive vue de côté. Les autres sont derrière, à intervalles réguliers : c'est l'entraxe."],[240,182,"Entretoises en X : elles empêchent les solives de se renverser et répartissent la charge."]],
why:"Les solives sont les côtes du plancher : elles portent le sous-plancher, les meubles et les gens. Posées sur chant (le côté étroit vers le haut), elles résistent beaucoup mieux à la flexion que posées à plat, comme une règle de plastique qu'on essaie de plier dans les deux sens.",
how:["On trace sur la lisse et sur la poutre la position des solives, à entraxe constant (distance de centre à centre).","On pose les solives sur chant, le côté légèrement bombé (la couronne) vers le haut, appuyées sur la lisse. Au-dessus de la poutre, elles se chevauchent ou se butent selon le plan.","On fixe chaque solive à la solive de rive, à la lisse et à la poutre (clous, étriers métalliques selon le cas).","On double les solives sous les cloisons parallèles et autour des ouvertures (escalier, cheminée), avec des chevêtres.","On ajoute des entretoises (en X ou pleines) entre les solives pour les garder droites et répartir les charges.","On limite les percements et les entailles : leur taille et leur position sont encadrées par le Code (pas de gros trou près des appuis ni d'entaille profonde dans le bas).","Avec des poutrelles en I ou des fermes de plancher, on suit les perforations prévues par le fabricant et on ne coupe jamais les membrures."],
dims:["Solive courante : 38 × 235 mm (2 × 10) à entraxe de 400 mm ; 600 mm avec une section plus forte (à valider).","Portée : une solive 38 × 235 mm à 400 mm franchit environ 4 à 4,5 m. Les tables du Code donnent la valeur exacte selon l'essence et la charge (à valider).","Entretoises : souvent à mi-portée ou à environ 2 m d'intervalle, selon ce que le plan et le Code exigent."],
err:["Solive entaillée ou percée au mauvais endroit → faiblesse, plancher qui s'affaisse.","Solive fendue, tachée ou pourrie (fuite) → perte de résistance.","Portée trop grande ou section trop petite → plancher qui rebondit ou vibre.","Porte-à-faux (balcon, baie vitrée) mal soutenu → affaissement."],
seen:["Plancher qui rebondit, craque ou penche ; creux au centre d'une pièce.","Depuis le sous-sol : solives entaillées par la plomberie ou l'électricité, fendues, tachées d'humidité.","Solive de rive : taches, moisissure, traces d'insectes.","Poutrelles en I : trous trop grands ou mal placés."],
q:"Pourquoi pose-t-on une solive sur chant plutôt qu'à plat ? Utilise l'image de la règle de plastique.",
kw:["solive","entraxe","portée","entretoise","chant","percement"]},

{k:"plan:poutre",add:"La poutre (bois, au centre) soutient les solives. Sous elle, une colonne d'acier descend à travers la dalle jusqu'à une semelle de béton.",
pins:[[142,170,"Poutre : elle soutient les solives au milieu de la maison."],[160,214,"Colonne d'acier : elle descend la charge de la poutre jusqu'au sol."],[146,262,"Semelle de colonne : une base de béton sous la dalle, pour répartir la charge sur le sol."]],
why:"Sans poutre, les solives devraient franchir toute la largeur de la maison, c'est trop long. La poutre coupe cette portée en deux, et les colonnes ramènent la charge concentrée jusqu'au sol. Le chemin de la charge : plancher → solive → poutre → colonne → semelle → sol.",
how:["On coule la semelle de la colonne à l'endroit prévu au plan, sous la future dalle.","On installe la colonne : plaque de base fixée sur la semelle, colonne d'acier à la bonne hauteur (parfois réglable), plaque de tête en haut.","On vérifie qu'elle est d'aplomb (parfaitement verticale).","On pose la poutre : en plis de bois cloués ou boulonnés ensemble, en bois d'ingénierie ou en acier. Elle s'appuie dans les murs de fondation (au moins 90 mm environ) et sur les colonnes.","On fixe la poutre à la plaque de tête de la colonne.","On met les solives sur la poutre ou contre elle (étriers).","On vérifie le niveau et on retire tout appui temporaire : un jack-post de chantier n'est pas une colonne permanente."],
dims:["Colonne d'acier : environ 90 mm (3½ po) de diamètre, parfois plus selon la charge (à valider).","Semelle de colonne : de l'ordre de 600 à 900 mm de côté et 250 à 300 mm d'épaisseur, selon la charge ; le plan décide.","Appui de la poutre dans le mur : au moins 90 mm environ (à valider)."],
err:["Colonne posée directement sur la dalle, sans semelle → la dalle fissure, la colonne s'enfonce, le plancher s'affaisse.","Colonne qui penche, mal fixée ou rouillée à la base → perte de capacité.","Poutre trop petite, fendue ou mal appuyée → flèche (courbure vers le bas).","Colonne temporaire laissée en place ou ajoutée sans calcul."],
seen:["Colonnes : d'aplomb ? plaque fixée en haut et en bas ? rouille à la base ? semelle visible ?","Poutre : flèche, fentes, trous, entailles, appui dans le mur.","Plancher du dessus qui s'affaisse au centre de la maison.","Colonnes ou murs ajoutés après coup, sans documents."],
q:"Retrace dans l'ordre le chemin d'une charge (une personne debout au milieu du salon) jusqu'au sol, avec le nom de chaque pièce.",
kw:["poutre","colonne","semelle","charge","appui","jack"]},

{k:"plan:sp",add:"Le sous-plancher (bande couleur bois clair) couvre toutes les solives et forme la plateforme sur laquelle on monte les murs.",
pins:[[180,140,"Sous-plancher : de grands panneaux de bois sur les solives. C'est la surface sur laquelle on monte les murs."],[84,140,"Les joints entre les panneaux sont décalés d'un rang à l'autre, comme des briques."]],
why:"Le sous-plancher relie toutes les solives ensemble et les rigidifie. Il sert aussi de plateforme de travail pour monter les murs : c'est pour cela qu'on parle de construction à plateforme.",
how:["On vérifie que le dessus des solives est de niveau et on corrige les solives croches.","On étend un cordon de colle de construction sur chaque solive : moins de craquements plus tard.","On pose les panneaux (contreplaqué ou panneaux de copeaux OSB, souvent bouvetés), perpendiculairement aux solives, en décalant les joints d'un rang à l'autre.","On laisse un petit jeu d'environ 3 mm entre les panneaux : le bois gonfle avec l'humidité.","On fixe avec des clous annelés ou des vis, plus rapprochés sur les rives (environ 150 mm) que sur le reste des appuis (environ 300 mm). Valeurs courantes, à valider.","On découpe les ouvertures (escalier) aux bons endroits.","On protège de la pluie : un panneau qui reste mouillé gonfle et finit par se gâter."],
dims:["Épaisseur courante : de 15,5 à 19 mm (⅝ à ¾ po), selon l'entraxe des solives (à valider).","Panneau : 1220 × 2440 mm (4 × 8 pi).","Jeu entre les panneaux : environ 3 mm."],
err:["Panneau mal collé ou mal cloué → plancher qui craque ou grince.","Panneaux gonflés ou gauchis par l'eau → surface ondulée, bosses sous le revêtement.","Joints alignés → flexion locale, fissures dans le revêtement de sol.","Fuite sous une toilette ou un évier → panneau mou, pourri."],
seen:["Planchers qui craquent, grincent, ou sont mous près d'une toilette ou d'un évier.","Panneau gauchi, bosses, ondulations sous le tapis ou le bois franc.","Taches d'eau vues par en dessous, depuis le sous-sol."],
q:"Pourquoi décale-t-on les panneaux d'un rang à l'autre, et pourquoi laisse-t-on un petit jeu entre eux ?",
kw:["sous-plancher","panneau","colle","décal","jeu","osb"]},

{k:"murs:oss",add:"Les murs extérieurs montent sur le sous-plancher. Ici on voit la coupe d'un poteau, avec la lisse basse en bas et la sablière doublée en haut.",
pins:[[38,150,"Lisse basse : posée sur le sous-plancher, elle reçoit le pied des poteaux."],[38,108,"Poteaux : pièces verticales de 38 × 140 mm, espacées de 400 ou 600 mm (ici vu en coupe)."],[38,62,"Sablière doublée : deux planches en haut du mur, qui lient les poteaux et reçoivent le toit."],[322,108,"Même principe de l'autre côté."]],
why:"Les murs extérieurs portent le toit (et les étages) : ce sont des squelettes de poteaux verticaux. Chaque poteau reprend une petite part de la charge. C'est la construction à ossature de bois, la plus courante pour une maison au Québec.",
how:["On trace sur le sous-plancher l'emplacement des murs.","Au sol, à plat, on assemble chaque mur : lisse basse, poteaux à entraxe de 400 ou 600 mm, sablière doublée.","On croise les sablières aux coins et aux intersections pour lier les murs ensemble.","On redresse chaque mur, on le met d'aplomb et de niveau, et on le fixe au sous-plancher.","On contrevente temporairement (diagonales) pour garder les murs d'équerre jusqu'à ce que le revêtement les rigidifie.","On installe des poteaux de coin qui offriront de la place pour clouer les revêtements intérieur et extérieur.","S'il y a un étage, on pose un nouveau plancher sur les sablières et on recommence."],
dims:["Poteaux de murs extérieurs : souvent 38 × 140 mm (2 × 6) pour avoir de la place pour l'isolant ; 38 × 89 mm (2 × 4) pour les cloisons.","Entraxe : 400 mm ou 600 mm.","Hauteur courante : environ 2,4 m (8 pi).","Sablière : deux planches de 38 mm superposées."],
err:["Murs hors d'aplomb ou gauchis → finition difficile, fissures aux joints du gypse.","Bois pourri à la base (infiltration) → structure affaiblie.","Coin mal lié ou ouvert → fuite d'air, faiblesse.","Contreventement absent → mur qui se déforme au vent."],
seen:["Murs qui penchent, planchers ou plafonds pas de niveau, fissures en diagonale aux coins d'ouverture.","Taches d'humidité au bas des murs, bois mou en bas des poteaux.","Quand on voit les poteaux (entretoit, sous-sol non fini) : poteaux coupés, percés, fendus."],
q:"Pourquoi construit-on les murs avec des poteaux plutôt qu'avec des planches pleines ? Que fait la sablière doublée aux coins ?",
kw:["poteau","lisse","sablière","entraxe","plateforme","aplomb"]},

{k:"murs:lint",add:"Dans le mur de gauche, on réserve l'ouverture d'une fenêtre ; dans celui de droite, l'ouverture d'une porte. Chaque ouverture a un linteau (deux pièces) au-dessus.",
pins:[[38,89,"Linteau : une poutre au-dessus de l'ouverture. Elle reporte la charge sur les côtés."],[38,111,"Ouverture de la fenêtre : un vide dans le mur, avec un appui en bas et des poteaux courts dessous."],[322,120,"Ouverture de la porte : même principe, mais elle descend jusqu'au plancher."]],
why:"Chaque fenêtre ou porte coupe des poteaux qui portaient la charge du toit. Sans compensation, la charge passerait à travers l'ouverture. Le linteau reprend cette charge et la reporte sur les poteaux de chaque côté (les jambages).",
how:["Sur le plan, on lit la largeur et la hauteur de chaque ouverture brute (un peu plus grande que la fenêtre).","On pose des poteaux doublés de chaque côté (jambages) qui descendent jusqu'à la lisse basse : ils reçoivent la charge du linteau.","On installe le linteau, souvent deux planches sur chant (avec un espaceur d'isolant) ou une pièce de bois d'ingénierie ; sa section dépend de la largeur de l'ouverture et de la charge.","On pose des poteaux courts au-dessus du linteau jusqu'à la sablière.","Sous une fenêtre : un appui (une planche à plat), puis des poteaux courts jusqu'à la lisse basse.","Pour une porte : pas d'appui, on coupe la lisse basse dans l'ouverture.","On laisse de la place pour isoler le linteau : un linteau plein de bois sans isolant crée un pont thermique."],
dims:["Linteau courant : deux planches 38 × 184 mm ou 38 × 235 mm sur chant. Plus l'ouverture est large, plus il est profond ; les tables du Code donnent la section exacte (à valider).","Appui du linteau sur les jambages : environ 38 à 90 mm (à valider)."],
err:["Linteau trop petit ou absent (surtout après une transformation) → flèche, fissures en biais aux coins de l'ouverture, porte qui frotte.","Linteau mouillé par une fuite de fenêtre → pourriture, affaissement.","Linteau d'acier rouillé sous la brique → la rouille gonfle et fait fissurer la brique.","Jambages absents → la charge repose sur un seul poteau mince."],
seen:["Fissures aux coins supérieurs des fenêtres et des portes ; portes et fenêtres qui coincent.","Dessus d'ouverture qui fléchit ; taches d'eau au-dessus des fenêtres.","Brique fissurée au-dessus d'une ouverture ; linteau d'acier rouillé."],
q:"Explique avec tes mots par où passe la charge du toit quand il y a une fenêtre dans le mur : nomme les pièces dans l'ordre.",
kw:["linteau","jambage","ouverture","appui","charge","fissure"]},

{k:"murs:mp",add:"Au centre, un mur plus épais, au-dessus de la poutre : on l'imagine porteur. Plus à gauche, une cloison mince qui sépare deux pièces sans rien porter.",
pins:[[198,100,"Mur porteur : il est posé au-dessus de la poutre, qui descend sa charge jusqu'à la colonne."],[134,100,"Cloison : elle sépare les pièces mais ne porte rien. Ses poteaux sont plus minces."],[214,212,"La poutre et la colonne du sous-sol sont alignées sous le mur porteur : la charge descend en ligne droite."]],
why:"Tous les murs ne se valent pas : certains portent, d'autres séparent seulement. Retirer un mur porteur sans le remplacer par une poutre bien appuyée est une des erreurs les plus graves en rénovation. Une cloison s'enlève facilement ; un mur porteur jamais sans calcul.",
how:["On repère les murs porteurs sur le plan. Ils sont souvent alignés avec la poutre du sous-sol et avec les murs de l'étage.","Les murs porteurs sont plus robustes : poteaux de 38 × 89 ou 38 × 140 mm, sablière doublée, linteaux calculés.","Les cloisons sont plus simples : poteaux de 38 × 89 mm à 400 ou 600 mm, sablière simple ou doublée.","On double les solives sous une cloison qui leur est parallèle, parce qu'elles portent son poids.","Dans une maison avec fermes préfabriquées, les murs intérieurs sont souvent non porteurs : les fermes passent d'un mur extérieur à l'autre. Dans une maison à chevrons ou à étage, certains murs intérieurs portent.","Pour ouvrir un mur porteur, un ingénieur calcule la nouvelle poutre et ses appuis. On étaie pendant les travaux."],
dims:["Cloison : poteaux 38 × 89 mm, entraxe 400 ou 600 mm. Mur porteur : 38 × 89 ou 38 × 140 mm selon la charge (à valider).","On ne devine pas : la réponse est dans les plans ou dans un calcul d'ingénieur.","Dans notre dessin, le mur central est dessiné comme un mur porteur parce qu'il se trouve au-dessus de la poutre."],
err:["Mur porteur retiré ou ouvert sans poutre adéquate → plafond ou plancher qui s'affaisse, fissures.","Poutre de remplacement trop petite ou mal appuyée → flèche, parfois effondrement partiel.","Cloison qui porte par erreur (on y a posé de la charge) → fissures.","Percements et entailles dans un mur porteur → perte de capacité."],
seen:["Pièce ouverte (mur absent) avec poutre apparente ou plafond qui s'affaisse ; fissures près de l'ouverture.","Sous-sol : la poutre ou la colonne ne s'alignent pas avec le mur du dessus ; colonnes ou murs ajoutés après coup.","Rénovation récente sans documents (permis, signature d'ingénieur)."],
q:"Comment peux-tu savoir, sans percer, si un mur est probablement porteur ? Donne trois indices.",
kw:["porteur","cloison","poutre","ingénieur","solive","rénovation"]},

{k:"toit:struct",add:"Les fermes de toit : un triangle de bois assemblé en usine, qui va d'un mur extérieur à l'autre. Les carrés bleus sont des plaques de métal à dents qui tiennent les pièces ensemble.",
pins:[[180,36,"Ferme : un triangle de bois (et de petits triangles à l'intérieur). C'est la forme la plus rigide."],[80,34,"Plaque de métal à dents (connecteur) qui relie les pièces. On ne la déplace pas."],[334,74,"Débord : les membrures dépassent des murs pour protéger les murs de la pluie."]],
why:"Le toit doit porter la neige, le vent et son propre poids. Un triangle est la forme la plus rigide : il ne peut pas se déformer sans que l'un de ses côtés change de longueur. La ferme préfabriquée est donc un grand triangle (avec de petits triangles à l'intérieur) assemblé en usine avec des plaques de métal à dents.",
how:["On commande les fermes à l'usine selon les plans : portée, pente, charge de neige de la région.","On les monte sur les sablières avec une grue et on les fixe à entraxe constant, souvent 600 mm.","On installe les contreventements : des planches en diagonale et des pièces horizontales qui lient les fermes entre elles et les gardent droites.","On fixe chaque ferme au mur avec des clous inclinés ou des connecteurs.","Le toit dépasse des murs pour former le débord.","Variante : chevrons coupés sur place, appuyés au faîtage et aux murs, avec des pièces horizontales (entraits) pour qu'ils ne poussent pas les murs.","Règle d'or : on ne coupe pas, on ne perce pas et on ne déplace pas une ferme sans l'avis de l'ingénieur ou du fabricant."],
dims:["Entraxe courant : 600 mm (24 po).","Pente courante : de 4/12 à 8/12 (de 4 à 8 pouces de hauteur par 12 pouces de longueur). Notre dessin est à environ 4/12.","Portée : les fermes franchissent souvent de 8 à 12 m, d'un mur extérieur à l'autre.","Débord courant : de 300 à 450 mm environ."],
err:["Ferme coupée ou entaillée (pour une trappe ou un conduit) → perte de portance, affaissement du toit.","Contreventement absent ou enlevé → fermes qui se tordent ou qui penchent.","Humidité (fuite, condensation) → bois taché, pourri, plaques métalliques rouillées.","Mur ou poutre modifié sous un toit à fermes → fissures au plafond, fermes mal appuyées."],
seen:["Dans l'entretoit : fermes droites ? plaques complètes ? pièces coupées ou entaillées ? contreventement en place ? bois taché ou moisi ?","De la rue : faîtage qui s'affaisse (ligne du toit en creux) ou versant bombé.","Fissures au plafond qui apparaissent surtout en hiver : à décrire, la cause relève d'un spécialiste."],
q:"Pourquoi une ferme est-elle faite de triangles ? Que se passe-t-il si on coupe un morceau pour passer un conduit ?",
kw:["ferme","triangle","entraxe","contrevent","membrure","ingénieur"]},

{k:"toit:supp",add:"Une peau de panneaux de bois couvre les fermes. Au bord du toit, une membrane autocollante orange et un larmier de métal protègent contre l'eau.",
pins:[[128,14,"Support de couverture : panneaux de bois fixés sur les fermes."],[40,40,"Membrane autocollante (orange) au bord du toit : elle arrête l'eau poussée sous les bardeaux par les glaçons."],[10,66,"Larmier : une bande de métal pliée au bord du toit qui guide l'eau dans la gouttière."]],
why:"Le support est la peau de bois sur laquelle on posera la couverture : il lie les fermes, répartit la charge de neige et donne une surface continue. La membrane autocollante au bord arrête l'eau qui peut remonter sous les bardeaux quand la glace bloque l'écoulement.",
how:["On pose les panneaux (contreplaqué ou OSB) perpendiculairement aux fermes, joints décalés d'un rang à l'autre.","On laisse un petit jeu (environ 3 mm) entre les panneaux, avec des agrafes en H ou des espaceurs.","On fixe avec des clous annelés à intervalles réguliers (environ 150 mm sur les rives, 300 mm ailleurs). Valeurs courantes, à valider.","On pose le larmier au bas du toit, sous la membrane ; sur les côtés (les rives), on le pose par-dessus la sous-couche.","On colle la membrane autocollante au bas du toit, jusqu'à au moins 900 mm sur la pente et 300 mm au-delà de la face intérieure du mur (valeurs courantes, à valider), et dans les noues.","On pose la sous-couche (papier ou synthétique) sur le reste du toit, en chevauchant de bas en haut."],
dims:["Panneaux de support : environ 12,5 mm (½ po) pour des fermes à 600 mm (à valider).","Membrane autocollante : au moins 900 mm de large depuis le bord du toit, plus au besoin (à valider).","Jeu entre panneaux : environ 3 mm."],
err:["Panneaux trop minces, mal fixés ou non décalés → affaissement ou bosses visibles sous les bardeaux.","Support mouillé ou pourri (fuite, condensation) → toit mou, bardeaux déformés.","Pas de membrane au bord → infiltration lors d'un barrage de glace : eau dans le soffite, le mur, le plafond.","Larmier absent → l'eau passe derrière la gouttière et pourrit la bordure."],
seen:["Dans l'entretoit : taches sombres sous le support, support mou ou gondolé.","Glaçons ou barrages de glace chaque hiver au bas du toit.","Pourriture de la bordure de toit ou du soffite."],
q:"Explique avec tes mots comment se forme un barrage de glace et pourquoi la membrane autocollante au bord du toit aide.",
kw:["support","membrane","larmier","glaçon","panneau","noue"]},

{k:"toit:couv",add:"Les bardeaux d'asphalte couvrent le toit (gris foncé), avec une faîtière au sommet. Un tuyau de ventilation de plomberie traverse le toit, entouré d'une garniture noire (solin).",
pins:[[110,18,"Bardeaux d'asphalte : ils se chevauchent comme des écailles pour faire couler l'eau vers le bas."],[246,14,"Évent de plomberie : le tuyau traverse le toit, avec une garniture noire (solin) qui rend le passage étanche."],[200,10,"Faîtière : bardeaux spéciaux qui ferment le sommet du toit."]],
why:"La couverture est la peau du toit : elle fait couler l'eau vers le bas sans la laisser passer. Les bardeaux se chevauchent comme les écailles d'un poisson. Les points faibles sont les jonctions et les passages (évents, cheminée, murs). On y met des solins : des pièces de métal ou de caoutchouc qui font dévier l'eau.",
how:["On trace une ligne de départ et on pose un rang de départ au bas du toit.","On monte rang par rang en décalant les joints, avec le nombre de clous prévu par le fabricant (souvent 4 par bardeau, plus en zone ventée).","On pose les solins aux jonctions : noue, mur, cheminée, passage d'évent. Le haut du solin passe sous les bardeaux, le bas passe par-dessus ceux du dessous : l'eau coule toujours sur la couche suivante.","Pour les évents de plomberie, on utilise une garniture de caoutchouc ou de métal (la base noire du dessin).","On termine le faîte avec des bardeaux de faîte ; si prévu, on laisse une ouverture pour un évent de faîtage.","On vérifie clous, joints et scellant, puis on ramasse les clous qui traînent."],
dims:["Pente minimale pour des bardeaux d'asphalte standard : environ 4/12. En dessous, on utilise un autre système (à valider).","Durée de vie : souvent de 15 à 25 ans selon le produit, l'ensoleillement et la ventilation du toit (à valider).","Clous : généralement 4 par bardeau."],
err:["Bardeaux mal cloués (trop haut, ou trop enfoncés) → arrachement au vent.","Solin décollé, rouillé ou mal scellé → infiltration autour de la cheminée ou d'un mur.","Évent non solinné → fuite autour du tuyau.","Granules qui partent, bardeaux courbés ou craquelés → fin de vie de la couverture."],
seen:["Bardeaux usés, courbés ou manquants ; granules dans les gouttières ; mousse ; solins qui bougent.","Autour de la cheminée et des évents : scellant sec, rouille.","Dans l'entretoit : taches d'eau près des solins.","Sans accès au toit, on décrit ce qu'on voit de loin et on le dit comme limitation."],
q:"Où sont les points les plus fragiles d'un toit, et pourquoi y met-on des solins ?",
kw:["bardeau","solin","évent","faîtage","chevauch","pente"]},

{k:"toit:vent",add:"Une couche épaisse d'isolant jaune au plafond de l'entretoit. Les flèches bleues montrent le chemin de l'air : il entre par le bas du toit, monte sous le support et sort par le faîte.",
pins:[[160,52,"Isolant du plafond : une couche épaisse posée sur tout le plafond de la maison."],[62,36,"Déflecteur : une pièce qui garde un passage d'air libre sous le support de toit, au-dessus de l'isolant."],[128,22,"Air frais : il entre par le soffite, monte sous le support de toit et sort par le faîte."],[196,10,"Évent de faîte : la sortie de l'air chaud et humide."]],
why:"L'entretoit doit rester froid et sec. Si la chaleur et l'humidité de la maison y montent, la neige fond sur le toit (barrages de glace), la vapeur gèle sous le support (givre) puis fond, et le bois moisit. On isole donc beaucoup au plafond et on ventile l'entretoit avec de l'air extérieur.",
how:["On scelle d'abord le plafond : boîtiers électriques, trappe, passages de fils et de tuyaux. C'est le rôle du pare-air et du pare-vapeur (pages 25 et 26).","On étend l'isolant sur tout le plafond (cellulose soufflée, laine minérale ou fibre de verre) à l'épaisseur voulue.","On installe des déflecteurs au bord du toit : ils gardent un passage d'air libre sous le support de toit, au-dessus de l'isolant.","On crée des entrées d'air (soffites perforés) et des sorties (évent de faîtage, évents de pignon ou turbines).","On répartit les ouvertures : environ la moitié en bas, la moitié en haut. L'air chaud monte et tire l'air frais.","On dirige tous les ventilateurs d'extraction (salle de bain, hotte) vers l'extérieur, jamais dans l'entretoit."],
dims:["Isolant du plafond : RSI de l'ordre de 8 à 10 (R-45 à R-60) selon le code et le plan ; une épaisseur de 35 à 45 cm environ (à valider).","Ouverture de ventilation : environ 1/300 de la surface du plafond isolé (à valider).","Passage d'air libre au bord du toit : au moins 50 mm environ (à valider)."],
err:["Isolant écrasé, mince ou manquant par endroits → pertes de chaleur, barrages de glace, taches froides au plafond.","Soffites bouchés par l'isolant → pas de circulation d'air, condensation, moisissure.","Ventilateur de salle de bain qui rejette dans l'entretoit → humidité, givre, moisissure.","Fuites d'air par la trappe ou les luminaires → de l'air chaud et humide monte et condense."],
seen:["Dans l'entretoit : épaisseur et uniformité de l'isolant ; déflecteurs en place ; soffites dégagés ; givre ou taches noires sous le support ; trappe isolée et étanche.","Conduits de ventilation raccordés à l'extérieur et isolés.","Barrages de glace et glaçons en hiver (indices vus de l'extérieur)."],
q:"Pourquoi un toit bien isolé et bien ventilé reste-t-il plus froid ? Quel est le lien avec les glaçons au bord du toit ?",
kw:["isolant","ventilation","soffite","déflecteur","condensation","faîtage","rsi"]}
);
// Livre « Ma maison » : pages 20 à 29 (valeurs à valider avec l'enseignant)
LVB.push(
{k:"toit:deb",add:"Le bord du toit se termine : un fascia (planche de bordure) et un soffite sous le débord, une gouttière de chaque côté, une descente pluviale qui va jusqu'au sol et un rejet qui éloigne l'eau.",
pins:[[0,52,"Gouttière : elle recueille l'eau qui coule du toit."],[40,84,"Soffite : il ferme le dessous du débord et, s'il est perforé, laisse entrer l'air dans l'entretoit."],[14,112,"Descente pluviale : elle amène l'eau de la gouttière jusqu'au sol."],[0,162,"Rejet : il dépose l'eau plus loin de la fondation."]],
why:"Le débord éloigne l'eau des murs. La gouttière recueille l'eau du toit, la descente la mène au sol et le rejet la dépose loin de la fondation. L'eau d'un toit, c'est des milliers de litres par année : mal dirigée, elle finit dans le sous-sol.",
how:["On prolonge la structure du toit pour former le débord (queues de fermes ou pièces ajoutées).","On pose le fascia à l'extrémité des fermes, puis des fourrures pour fixer les soffites.","On installe les soffites (aluminium, vinyle ou bois) : perforés au moins en partie, ils laissent entrer l'air dans l'entretoit.","On fixe les gouttières au fascia avec des supports, avec une très légère pente vers les descentes.","On installe les descentes pluviales avec des coudes, aux extrémités ou aux coins.","On met un rejet (bloc, rallonge) qui dépose l'eau loin du mur, et on la dirige vers un point bas du terrain, pas vers la maison ni vers le voisin."],
dims:["Débord courant : de 300 à 450 mm environ.","Rejet : l'eau doit se retrouver à au moins 1 m du mur, idéalement plus (à valider).","Nombre de descentes : au moins une par versant de toit, plus si la gouttière est longue."],
err:["Gouttière bouchée, mal fixée ou sans pente → elle déborde contre le mur, pourriture du fascia et du soffite.","Descente qui rejette au pied du mur → l'eau s'infiltre, sous-sol humide.","Soffite pourri ou percé → entrée d'oiseaux, d'écureuils, d'insectes dans l'entretoit.","Gouttière trop petite ou trop peu de descentes → débordement en forte pluie."],
seen:["Gouttières : pleines de feuilles, détachées, rouillées, eau qui stagne, joints qui coulent ; descentes débranchées ; rejets trop courts.","Fascia et soffite : bois mou, peinture écaillée, nids.","Taches de ruissellement sur les murs sous une gouttière."],
q:"Suis le trajet d'une goutte de pluie tombée sur le toit jusqu'au sol. Où doit-elle finir, et quel problème arrive si elle finit au pied du mur ?",
kw:["gouttière","descente","rejet","soffite","fascia","débord"]},

{k:"ouv:fen",add:"Une fenêtre est posée dans l'ouverture de gauche (vitre bleue), avec un solin d'appui incliné en dessous. Une porte est posée dans l'ouverture de droite, avec un seuil en bas.",
pins:[[28,111,"Fenêtre : cadre et vitrage posés dans l'ouverture."],[28,136,"Solin d'appui : une pièce inclinée sous la fenêtre qui renvoie vers l'extérieur l'eau qui s'infiltre."],[322,120,"Porte d'entrée dans son ouverture, avec un seuil étanche en bas."]],
why:"Une fenêtre est un trou dans la protection de la maison. Son raccord au mur doit être étanche à l'eau (solins qui font couler l'eau vers l'extérieur) et à l'air (scellant côté intérieur). Beaucoup de fuites autour des ouvertures viennent de la façon dont on les raccorde, pas de la fenêtre elle-même.",
how:["On vérifie que l'ouverture est d'équerre et de la bonne dimension.","On pose un solin d'appui (membrane ou métal) sous l'ouverture, relevé aux extrémités (digues), pour renvoyer vers l'extérieur l'eau qui s'infiltre.","On installe la fenêtre d'aplomb et de niveau, avec des cales, et on la fixe selon les instructions du fabricant.","On isole le pourtour avec de la mousse basse expansion ou de l'isolant, sans pousser sur le cadre.","On scelle le joint intérieur (scellant ou ruban) : c'est la continuité du pare-air autour de la fenêtre.","On raccorde la membrane du mur au cadre, en commençant par le bas et en finissant par le haut, en chevauchant comme des bardeaux.","On pose un larmier au-dessus de la fenêtre, puis le calfeutrage extérieur de finition.","Pour une porte : même principe, avec un seuil étanche."],
dims:["Jeu autour du cadre : environ 6 à 12 mm de chaque côté, pour les cales et la mousse (selon le fabricant).","Règle d'or : toute eau qui passe derrière le revêtement doit rencontrer une surface qui la dirige vers l'extérieur."],
err:["Pas de solin d'appui ni de larmier → eau autour de la fenêtre, pourriture de l'appui et du linteau.","Mousse trop expansive → cadre déformé, fenêtre qui coince.","Calfeutrage fissuré ou absent → eau et air qui entrent.","Fenêtre pas d'aplomb → elle s'ouvre ou se ferme mal.","Buée entre les vitres → le scellant du vitrage a lâché."],
seen:["Autour des fenêtres et portes : calfeutrage fissuré ou absent, taches d'eau à l'intérieur (appui, cadre), cadre pourri.","Fenêtres déformées, qui ferment mal ; buée entre les vitres.","Porte : seuil abîmé, courants d'air ; larmier absent au-dessus."],
q:"Pourquoi l'eau qui passe derrière le revêtement doit-elle toujours rencontrer des pièces qui se recouvrent comme des bardeaux (solin, membrane, larmier) ? Explique le principe.",
kw:["fenêtre","solin","larmier","calfeutrage","aplomb","pare-air"]},

{k:"ouv:mem",add:"Des panneaux de bois couvrent l'extérieur des murs (revêtement intermédiaire), puis une membrane verte (la ligne verte) les recouvre. On voit les deux sur les côtés de la maison.",
pins:[[28,146,"Revêtement intermédiaire : des panneaux fixés sur les poteaux. Ils rigidifient le mur."],[28,76,"Membrane (ligne verte) : elle arrête l'eau et le vent, mais laisse sortir la vapeur d'eau."],[342,76,"Même chose de l'autre côté."]],
why:"Le revêtement extérieur n'est pas parfaitement étanche : un peu de vent et de pluie fine passent par ses joints. Derrière lui, la membrane est la deuxième ligne de défense : elle arrête l'eau liquide et le vent, mais laisse sortir la vapeur d'eau du mur (elle respire) pour que le mur puisse sécher.",
how:["On fixe le revêtement intermédiaire (panneaux de copeaux ou autres) sur les poteaux : il rigidifie le mur et sert de support.","On déroule la membrane en partant du bas : chaque rangée recouvre la précédente par le haut, comme des bardeaux, pour que l'eau coule toujours sur la couche du dessous.","On rubane les joints et on fixe la membrane (agrafes ou clous à rondelle).","On la raccorde aux fenêtres et aux solins (voir la page précédente).","On scelle les passages de tuyaux et de câbles.","Derrière le revêtement, on fixe parfois des fourrures verticales qui créent une lame d'air : l'eau peut s'y égoutter et le mur peut sécher."],
dims:["Revêtement intermédiaire : environ 9,5 à 12,5 mm (⅜ à ½ po) (à valider).","Chevauchement de la membrane : de l'ordre de 100 à 150 mm (selon le fabricant).","Lame d'air derrière le bardage : souvent de 10 mm ou plus (à valider)."],
err:["Chevauchement à l'envers (le haut sous le bas) → l'eau entre derrière la membrane.","Membrane déchirée ou mal scellée → infiltration, pourriture des poteaux et de la lisse basse.","Lame d'air bouchée → le mur ne sèche pas, moisissure.","Matériau qui ne laisse pas passer la vapeur au mauvais endroit → humidité piégée dans le mur."],
seen:["On voit rarement la membrane. On cherche des signes indirects : taches d'eau au bas des murs, pourriture à la base du mur, efflorescence, moisissure.","Un bardage abîmé laisse parfois voir la membrane : déchirée ou absente ?","Taches d'eau à l'intérieur sous les fenêtres."],
q:"Pourquoi la membrane doit-elle laisser passer la vapeur d'eau mais pas l'eau liquide ? Pense à un manteau imperméable qui respire.",
kw:["membrane","chevauch","vapeur","revêtement intermédiaire","lame d'air","fourrure"]},

{k:"ouv:rev",add:"Le revêtement extérieur : du bardage de vinyle à gauche et de la brique à droite, pour voir les deux. À droite, l'espace entre la brique et le mur est la lame d'air.",
pins:[[24,112,"Bardage de vinyle : il fait couler l'eau vers le bas. Il ne rend pas le mur étanche à lui seul."],[344,76,"Brique : un parement qui protège le mur, séparé de lui par une lame d'air."],[344,160,"Solin et chantepleure à la base : ils évacuent l'eau qui s'infiltre derrière la brique."]],
why:"Le revêtement est la première défense contre la pluie, le soleil et le vent. Il n'est pas parfaitement étanche : il est conçu pour que l'eau coule vers le bas et pour que ce qui passe derrière puisse ressortir et sécher.",
how:["On pose les moulures de départ, d'angle, de fenêtre et de soffite.","Bardage (vinyle, bois, fibre-ciment, métal) : on monte de bas en haut avec du jeu pour la dilatation (le vinyle bouge avec la chaleur) et sans le fixer trop serré.","Brique : on la monte sur un appui (une saillie) du mur de fondation, avec un solin à la base qui renvoie l'eau vers l'extérieur et des chantepleures (petites ouvertures dans les joints verticaux) pour la laisser sortir.","On lie la brique au mur avec des attaches métalliques, tous les 400 mm à la verticale et 600 mm à l'horizontale environ.","On laisse entre la brique et le mur une lame d'air d'environ 25 mm : elle sert au drainage.","Au-dessus de chaque ouverture, un linteau d'acier supporte la brique.","On termine par le calfeutrage aux jonctions et on garde un dégagement entre le bas du revêtement et le sol."],
dims:["Brique : environ 90 mm d'épaisseur. Lame d'air : en général 25 mm ou plus (à valider).","Chantepleures : espacées d'environ 800 mm au maximum (à valider).","Dégagement entre le revêtement et le sol : au moins 200 mm environ (à valider)."],
err:["Pas de chantepleures ni de solin → eau piégée derrière la brique, gel, éclatement des briques.","Linteau d'acier rouillé ou mal appuyé → brique fissurée au-dessus de l'ouverture.","Bardage déformé, fendu ou fixé trop serré (vinyle qui ondule) → eau et vent derrière.","Revêtement en contact avec le sol ou la neige → pourriture, insectes."],
seen:["Brique fissurée, joints de mortier qui s'effritent, efflorescence, briques éclatées par le gel, chantepleures bouchées ou absentes.","Bardage fendu, décollé, déformé ou pourri ; calfeutrage fissuré.","Sol qui monte contre le bas du mur."],
q:"À quoi servent les chantepleures et le solin à la base d'un mur de brique ? Que se passe-t-il quand l'eau qui est passée derrière la brique n'a pas de sortie ?",
kw:["bardage","brique","chantepleure","lame d'air","solin","linteau","attache"]},

{k:"env:iso",add:"L'isolant jaune remplit l'espace entre les poteaux des murs, la solive de rive et le mur du sous-sol. Celui du plafond était déjà posé à la page 19.",
pins:[[26,112,"Isolant entre les poteaux, dans toute l'épaisseur du mur."],[26,160,"Isolant de la solive de rive : un endroit souvent oublié."],[82,212,"Isolant du mur de fondation, du côté intérieur."]],
why:"L'isolant ralentit le passage de la chaleur : l'hiver, il garde la chaleur dedans ; l'été, il la garde dehors. Son efficacité se mesure en RSI : plus le nombre est grand, plus il isole. Il agit grâce à l'air immobile qu'il emprisonne : écrasé, mouillé ou plein de trous, il isole beaucoup moins.",
how:["On pose l'isolant dans les murs, entre les poteaux, du côté intérieur (matelas de laine de verre ou de laine minérale, mousse giclée, etc.).","On l'ajuste : il doit remplir la cavité sans trous ni vides et sans être écrasé. On le découpe autour des boîtiers et des fils.","On isole la solive de rive (mousse ou laine, bien scellée à l'air) et le haut du mur de fondation.","Au sous-sol, on isole le mur de fondation (de l'intérieur ou de l'extérieur) avec une ossature isolée ou un isolant rigide, en faisant attention à l'humidité.","Au plafond de l'entretoit, c'est la couche la plus épaisse (déjà posée à la page 19).","On évite les ponts thermiques : les endroits sans isolant ou avec beaucoup de bois (coins, linteaux, solive de rive).","On vérifie qu'il n'est pas mouillé avant de le recouvrir."],
dims:["Mur de 2 × 6 : environ RSI 3,5 à 4,2 (R-20 à R-24) entre les poteaux (à valider selon le code en vigueur).","Plafond : RSI de l'ordre de 8 à 10 (déjà vu).","Mur de fondation : souvent RSI 2 à 3,5 selon le système choisi (à valider)."],
err:["Isolant tassé, mouillé, écrasé ou manquant → pertes de chaleur, taches froides, moisissure.","Ponts thermiques → lignes sombres sur le gypse qui reproduisent la forme des poteaux.","Isolation insuffisante pour l'époque de la maison → inconfort, factures élevées.","Isolant mouillé dans un mur → moisissure et perte d'efficacité."],
seen:["Dans l'entretoit et le sous-sol non fini : épaisseur et uniformité de l'isolant, affaissement, humidité, traces de rongeurs.","Murs froids au toucher, taches grises ou noires aux coins et au-dessus des fenêtres.","Solive de rive du sous-sol : isolée ou non, humide ?"],
q:"Pourquoi l'isolant doit-il remplir tout l'espace sans être écrasé ? Qu'est-ce qu'un pont thermique, avec un exemple dans notre maison ?",
kw:["isolant","rsi","pont thermique","solive de rive","cavité","écras"]},

{k:"env:pa",add:"Le pare-air : la ligne verte épaisse qui suit le mur sans s'interrompre, et les petits carrés verts, qui sont des joints scellés (entre le mur et le plancher, autour de la fenêtre, au sommet des murs).",
pins:[[28,120,"Pare-air : une couche continue qui arrête les courants d'air à travers le mur."],[28,163,"Joint scellé entre le mur et le plancher (solive de rive)."],[28,98,"Pourtour de la fenêtre scellé : le point faible habituel."]],
why:"L'air qui traverse les murs emporte avec lui de la chaleur et surtout de la vapeur d'eau : c'est une grande source de problèmes d'humidité dans les murs. Le pare-air est un système continu qui arrête ces courants d'air. Continu veut dire sans interruption : un petit trou compte autant qu'une grande fissure.",
how:["On choisit le système : une membrane ou des panneaux à l'extérieur, le polyéthylène scellé à l'intérieur, ou une mousse giclée. Le plan précise lequel.","On scelle les joints entre les panneaux ou les membranes avec du ruban ou du scellant.","On scelle les jonctions : mur-plancher (solive de rive), mur-plafond, mur-fenêtre, mur-porte, fondation-lisse (déjà fait avec le joint de la page 9).","On rend étanches les boîtiers électriques des murs extérieurs (boîtiers étanches à l'air) et les passages de fils et de tuyaux (scellant ou mousse).","On scelle la trappe d'accès à l'entretoit et les luminaires.","On teste : un essai à la porte soufflante mesure les fuites d'air ; on peut aussi chercher les courants d'air avec de la fumée ou une caméra thermique."],
dims:["Pas de dimension à retenir : on retient la continuité.","L'essai à la porte soufflante donne un nombre de changements d'air par heure à une pression donnée : plus il est bas, plus la maison est étanche."],
err:["Joints non scellés ou rubans décollés → courants d'air, humidité qui entre dans le mur.","Boîtiers électriques non étanches sur un mur extérieur → fuite d'air et condensation locale.","Pare-air interrompu (planchers, fenêtres) → taches de saleté sur l'isolant, givre dans l'entretoit.","Trappe d'entretoit non étanche → air chaud et humide qui monte dans l'entretoit."],
seen:["Courants d'air autour des fenêtres, des prises, de la trappe ; plinthes froides.","Isolant visible taché de gris (l'air qui le traverse y dépose de la poussière).","Givre ou condensation à un seul endroit sur le gypse ; ruban détaché."],
q:"Pourquoi un petit trou peut-il causer plus de dégâts d'humidité qu'on le croit ? Explique la différence entre une fuite d'air et la diffusion de vapeur.",
kw:["pare-air","continu","scell","fuite","jonction","boîtier"]},

{k:"env:pv",add:"Le pare-vapeur : une feuille de polyéthylène (ligne bleue) du côté intérieur. Elle couvre les murs, passe sous l'isolant du plafond et longe le mur du sous-sol.",
pins:[[80,108,"Pare-vapeur : une feuille de polyéthylène, côté chaud, juste derrière le futur gypse."],[130,78,"Il court aussi au plafond, sous l'isolant de l'entretoit."],[80,224,"Au sous-sol : même idée contre le mur isolé."]],
why:"En hiver, la vapeur d'eau de l'air chaud et humide de la maison cherche à traverser les murs vers le froid. Quand elle rencontre une surface froide, elle se condense en eau, comme la buée sur un verre froid. Le pare-vapeur, du côté chaud, la retient avant qu'elle atteigne l'isolant.",
how:["On vérifie que l'isolant est complet et sec.","On pose la feuille de polyéthylène (souvent de 0,15 mm, soit 6 mil) du côté intérieur des poteaux, sur les murs et les plafonds, et on l'agrafe.","On chevauche les lés d'environ 100 mm minimum sur un appui solide, et on scelle les joints avec un scellant ou un ruban compatible.","On la prolonge jusqu'à la solive de rive et on la scelle à la lisse basse et à la sablière.","On la scelle autour des boîtiers électriques, des tuyaux et des fenêtres.","On la garde intacte jusqu'à la pose du gypse. On répare les déchirures avant de fermer."],
dims:["Épaisseur courante : 0,15 mm (6 mil) de polyéthylène.","Chevauchement : au moins 100 mm environ, sur un appui solide (à valider).","Il se place du côté chaud de l'isolant, donc à l'intérieur, dans un climat froid comme celui du Québec."],
err:["Pare-vapeur absent, déchiré ou mal scellé → humidité dans le mur, moisissure, isolant mouillé.","Posé du mauvais côté de l'isolant → humidité piégée.","Deux pare-vapeur (un de chaque côté) → l'eau qui entre ne peut plus sortir.","Trous et déchirures non réparés avant le gypse."],
seen:["On le voit rarement. Signes indirects : moisissure aux coins de plafond, givre dans l'entretoit, condensation sur les fenêtres.","Dans l'entretoit : pare-vapeur visible sous l'isolant, déchiré ou absent ?","Isolant mouillé ou taché quand on ouvre un mur."],
q:"Pourquoi le pare-vapeur se met-il du côté chaud de l'isolant ? Que se passe-t-il dans le mur s'il se trouve du mauvais côté ?",
kw:["pare-vapeur","polyéthylène","condensation","côté chaud","chevauch","scell"]},

{k:"sys:plb",add:"La plomberie : un tuyau gris descend les eaux usées et monte jusqu'au toit (la colonne de chute et d'évent). Les tuyaux bleu (eau froide) et rouge (eau chaude) vont vers l'évier, et le chauffe-eau chauffe l'eau au sous-sol.",
pins:[[252,90,"Colonne de chute et évent : l'eau usée descend, l'air entre par le haut."],[110,226,"Chauffe-eau : il chauffe l'eau avant de l'envoyer aux appareils."],[160,184,"Tuyaux d'alimentation : l'eau froide (bleu) et l'eau chaude (rouge) sous les solives."],[130,282,"Drain principal sous la dalle : il sort par le mur de fondation et va vers l'égout."],[282,150,"Siphon : un petit U rempli d'eau qui empêche les odeurs de l'égout de remonter."]],
why:"La plomberie fait deux voyages : amener l'eau potable sous pression aux appareils et évacuer les eaux usées par gravité. Les évents laissent entrer l'air dans le réseau pour que l'eau s'écoule librement et que les siphons gardent les gaz d'égout dehors.",
how:["Avant la dalle, on installe le drain principal sous le plancher du sous-sol, avec une pente continue vers la sortie.","On monte la colonne de chute (le gros tuyau vertical) qui reçoit les eaux des appareils et se prolonge jusqu'au toit comme évent.","On tire les tuyaux d'évacuation de chaque appareil vers la colonne, en pente, avec un siphon (en U ou en S) pour chaque appareil.","On tire les tuyaux d'alimentation d'eau froide et d'eau chaude, dans ou sous les solives, jusqu'aux appareils.","On installe le chauffe-eau avec son robinet d'arrêt, sa soupape de sécurité et ses raccords.","On teste : essai de pression sur l'alimentation et essai d'étanchéité sur les drains, avant de fermer les murs."],
dims:["Drain : pente d'environ 2 % (¼ po par pied) pour les petits diamètres (à valider).","Colonne de chute : souvent de 75 à 100 mm ; alimentation : de l'ordre de 12 à 19 mm (à valider).","Matériaux courants : cuivre ou PEX pour l'alimentation ; ABS ou PVC pour le drainage.","L'évent se prolonge au-dessus du toit, à une hauteur minimale fixée par le Code (à valider)."],
err:["Fuite lente cachée dans un mur ou sous la dalle → moisissure, pourriture, dégâts d'eau.","Évent absent ou trop petit → drains lents, gargouillis, siphons vidés, odeurs d'égout.","Pente insuffisante ou contre-pente → engorgements.","Matériaux anciens (plomb, acier galvanisé) → mauvaise qualité de l'eau, débit faible, corrosion.","Chauffe-eau sans soupape ou très vieux (rouille)."],
seen:["Taches d'eau, rouille ou dépôts verts sur les tuyaux ; fuites sous les éviers ; faible pression ; eau brunâtre.","Matériaux visibles des tuyaux : plomb, acier galvanisé, polybutylène (selon l'âge).","Chauffe-eau : âge, rouille, soupape, évacuation.","Siphons : bruit de gargouillis, odeurs, drains lents."],
q:"Pourquoi a-t-on besoin d'un évent sur le toit ? Explique ce qui arriverait si l'air ne pouvait pas entrer dans le tuyau (pense à une bouteille d'eau qu'on renverse).",
kw:["drain","évent","siphon","pente","colonne","chauffe-eau","alimentation"]},

{k:"sys:elec",add:"L'électricité : un compteur à l'extérieur, un panneau avec ses disjoncteurs au sous-sol, et des câbles orange qui montent dans le mur jusqu'à une prise, puis au plafond.",
pins:[[10,158,"Compteur et entrée de service : l'électricité arrive ici."],[96,194,"Panneau : chaque circuit part d'ici et est protégé par un disjoncteur."],[278,138,"Boîtier de prise : étanche à l'air dans un mur extérieur."],[210,80,"Câbles dans les murs et le plafond, posés avant l'isolant."]],
why:"L'électricité entre par l'entrée de service, passe par le compteur, puis par le panneau où elle se divise en circuits protégés par des disjoncteurs. Un disjoncteur coupe le courant pour protéger le câble contre la surchauffe : le câble est choisi selon le courant que le disjoncteur laisse passer.",
how:["On installe l'entrée de service (le câble d'Hydro-Québec arrive à un compteur sur le mur ou à un mât) et la mise à la terre.","On pose le panneau principal avec ses disjoncteurs, des espaces pour ajouts futurs, et on identifie les circuits.","On tire les câbles dans les murs et au plafond avant l'isolation, en passant au centre des poteaux et des solives, pas près du bord où une vis de gypse pourrait les percer.","On fixe les boîtiers ; dans un mur extérieur, on utilise des boîtiers étanches à l'air.","On scelle autour des boîtiers pour garder la continuité du pare-air et du pare-vapeur.","À la fin du chantier, on branche prises, interrupteurs et luminaires, et on installe les avertisseurs de fumée et de monoxyde de carbone selon les exigences.","On teste chaque circuit et on identifie les disjoncteurs."],
dims:["Panneau : souvent de 100 à 200 A selon la maison (à valider).","Calibre des câbles : 14 AWG pour un circuit de 15 A, 12 AWG pour 20 A (valeurs courantes, à valider).","Les prises près de l'eau (cuisine, salle de bain, extérieur) sont protégées par un dispositif différentiel (DDFT) (à valider).","Avertisseurs de fumée : à chaque étage et près des chambres (à valider au Code)."],
err:["Panneau ancien, à fusibles, encombré ou non identifié ; deux fils sous le même disjoncteur → surchauffe.","Fils dénudés, épissures hors boîte, connexions lâches → étincelles, risque d'incendie.","Prises sans mise à la terre, rallonges utilisées en permanence → danger.","Avertisseurs de fumée ou de CO absents ou périmés."],
seen:["Panneau : marque, ampérage, propreté, rouille, étiquettes, disjoncteurs doublés (dans les limites de ce que le mandat permet).","Prises : polarité, mise à la terre, protection DDFT dans les zones humides.","Câblage visible (sous-sol, entretoit) : isolant craquelé, fils exposés, boîtes ouvertes, épissures hors boîte.","Avertisseurs : présents, fonctionnels, date de fabrication."],
q:"Quel est le rôle d'un disjoncteur ? Pourquoi un câble trop mince sur un disjoncteur trop gros est-il dangereux ?",
kw:["entrée de service","panneau","disjoncteur","circuit","mise à la terre","avertisseur"]},

{k:"sys:chv",add:"Le chauffage et la ventilation : une fournaise au sous-sol avec un conduit qui monte vers un registre dans le plancher, un retour d'air, un tuyau d'évacuation vers l'extérieur, et un VRC (boîte bleue) relié à l'extérieur.",
pins:[[228,232,"Fournaise : elle chauffe l'air, qu'un ventilateur envoie dans les conduits."],[224,190,"Conduit : il amène l'air chaud sous les solives jusqu'aux pièces."],[212,138,"Registre dans le plancher : la sortie de l'air chaud dans la pièce."],[114,212,"VRC (ventilateur récupérateur de chaleur) : il fait entrer de l'air frais et sortir de l'air vicié, en récupérant la chaleur."],[344,172,"Évacuation de la fournaise vers l'extérieur."]],
why:"Le chauffage ajoute de la chaleur ; la ventilation renouvelle l'air. Une maison moderne est très étanche à l'air (page 25) : sans ventilation mécanique, l'humidité, les odeurs, le gaz carbonique et les polluants s'accumulent. Le VRC apporte de l'air frais en récupérant une bonne part de la chaleur de l'air vicié qu'il rejette.",
how:["On installe le générateur de chaleur : fournaise (gaz, mazout ou électrique), chaudière à eau chaude, thermopompe, plinthes électriques…","On pose les conduits d'air chaud : un tronc principal sous les solives, puis des branches vers les registres ; ou les tuyaux d'eau chaude pour une chaudière.","On prévoit le retour d'air : l'air doit revenir à la fournaise (grille de retour), sinon le système est déséquilibré.","On raccorde la combustion : évacuation de fumée (cheminée, ou tuyau de plastique sur le côté pour un appareil à haut rendement) et arrivée d'air de combustion.","On installe les ventilateurs d'extraction (salle de bain, hotte de cuisine) qui rejettent à l'extérieur.","On monte le VRC : prise d'air extérieur et rejet isolés et éloignés l'un de l'autre, conduits d'air frais et d'air vicié, drain pour la condensation.","À la fin du chantier, on règle et on équilibre le système, on installe les filtres et on remet les consignes d'entretien."],
dims:["Fournaise à haut rendement : efficacité souvent supérieure à 90 % ; l'évacuation se fait par un tuyau de plastique qui sort sur le côté (à valider).","VRC : débit continu et faible, fixé par le Code selon la taille de la maison (à valider).","Filtres : à remplacer régulièrement selon les consignes du fabricant."],
err:["Appareil de chauffage vieux ou mal entretenu (filtres encrassés, échangeur fissuré) → mauvaise performance, risque de monoxyde de carbone.","Conduit de fumée mal supporté, rouillé ou mal raccordé → CO, incendie.","Ventilateur de salle de bain ou hotte qui rejette dans l'entretoit → humidité, moisissure.","Air de combustion insuffisant → mauvais fonctionnement, retour de fumée.","Pièces sans chauffage ou sans ventilation adéquate → froid, humidité."],
seen:["Fournaise : âge (plaque signalétique), rouille, propreté, filtre, cheminée, raccords, conduits abîmés ou non isolés.","Chaque pièce reçoit-elle de la chaleur ? Registres obstrués ?","VRC : présent, propre, prises d'air bien placées, condensation.","Ventilateurs : raccordés à l'extérieur."],
q:"Pourquoi une maison très étanche à l'air a-t-elle besoin d'un ventilateur récupérateur de chaleur ? Que se passerait-il sans lui ?",
kw:["fournaise","ventilation","vrc","conduit","combustion","retour d'air"]}
);
// Livre « Ma maison » : pages 30 à 34 et page finale (valeurs à valider avec l'enseignant)
LVB.push(
{k:"fin:gyp",add:"Le gypse (plaques blanches) ferme les murs et le plafond. Il cache d'un coup le pare-vapeur, l'isolant, les câbles et les tuyaux.",
pins:[[80,108,"Gypse sur les murs : il recouvre le pare-vapeur."],[220,82,"Gypse du plafond, vissé sous les fermes."]],
why:"Quand l'enveloppe est terminée et que tous les systèmes sont installés et testés, on ferme les murs. Le gypse donne une surface plane et lisse pour la peinture et il ralentit la progression d'un incendie (l'eau contenue dans le plâtre retarde l'échauffement). Une fois posé, il cache tout ce qui est derrière : c'est pourquoi on vérifie tout avant.",
how:["On vérifie que le pare-vapeur et l'isolation sont complets, et que la plomberie et l'électricité sont testées.","On fixe les plaques sur les poteaux et sur les fermes du plafond avec des vis : plafond d'abord, puis murs, en décalant les joints.","On serre bien les plaques les unes contre les autres, sans forcer.","On tire les joints : ruban et composé à joints en plusieurs couches (souvent trois), avec séchage entre chaque couche.","On ponce, on enlève la poussière, puis on applique l'apprêt.","Entre le garage et la maison, le Code exige des plaques et des assemblages résistant au feu (à valider avec ton enseignant).","On protège les ouvertures pendant les travaux pour limiter la poussière."],
dims:["Épaisseur courante : 12,7 mm (½ po) pour les murs et plafonds ; 15,9 mm (⅝ po) pour les séparations coupe-feu (à valider).","Vis : tous les 300 à 400 mm environ (à valider).","Plaque courante : 1220 × 2440 mm (4 × 8 pi)."],
err:["Fissures aux joints (ruban absent, séchage insuffisant, mouvement de la structure).","Vis ou clous qui ressortent (bois qui sèche, vis mal enfoncées).","Gypse mouillé : taches, cernes, moisissure (fuite de toit ou de plomberie, condensation).","Plafond qui s'affaisse ou qui bombe (plaques trop minces, isolant lourd, humidité)."],
seen:["Fissures aux coins et aux joints ; vis qui ressortent ; taches d'eau (cernes brunâtres), moisissure.","Plafond ondulé ou affaissé.","Peinture récente sur une tache : à regarder de près."],
q:"Qu'est-ce qui reste caché derrière le gypse une fois posé, et pourquoi est-il si important de vérifier ces choses avant de le poser ?",
kw:["gypse","joint","ruban","vis","finition","pare-vapeur"]},

{k:"fin:pl",add:"Le plancher fini (bande brun foncé sur le sous-plancher), les plinthes en bas des murs, et les cadres autour de la fenêtre.",
pins:[[180,138,"Plancher fini (bois, céramique, vinyle…) posé sur le sous-plancher."],[82,132,"Plinthe : une moulure au bas du mur qui cache le joint."],[84,100,"Cadre de la fenêtre."]],
why:"Les finitions, ce sont les parties qu'on voit et qu'on touche tous les jours : planchers, portes, boiseries, escaliers. Elles cachent beaucoup de choses, mais c'est aussi là que se jouent des enjeux de sécurité (escaliers, garde-corps).",
how:["On prépare le sous-plancher : propre, sec, de niveau ; on corrige les creux et les bosses.","On pose le revêtement de sol selon son type : bois franc cloué ou collé, plancher flottant, céramique sur un support rigide avec joints, vinyle, tapis.","On installe les portes intérieures et leurs cadres, et on les règle (jeu régulier, sans frottement).","On pose les plinthes, les cadres de fenêtre et les moulures.","On installe les escaliers finis, les mains courantes et les garde-corps selon les dimensions du Code.","On retouche les surfaces qui seront peintes (remplir les trous, poncer)."],
dims:["Escalier privé : marches d'environ 200 mm de hauteur au maximum et 255 mm de profondeur (giron) au minimum ; hauteur libre d'environ 1,95 m (à valider).","Garde-corps : souvent 900 mm de haut (1070 mm selon la hauteur de chute) ; espace entre barreaux de moins de 100 mm (à valider).","Main courante : environ 865 à 965 mm de hauteur (à valider)."],
err:["Plancher qui gondole (humidité), qui craque (sous-plancher) ou qui n'est pas de niveau.","Portes qui frottent ou ne ferment pas → bâtiment qui bouge ou ajustement mal fait.","Garde-corps trop bas, lâche ou à barreaux trop espacés → risque de chute, surtout pour un enfant.","Marches de hauteur inégale → faux pas, chute."],
seen:["Plancher gondolé, creux, soulevé ; craquements.","Portes : jeu irrégulier, frottement, ne verrouillent pas.","Escaliers : marches uniformes ? rampe solide ? garde-corps de bonne hauteur et solide ? éclairage ?","Joints de céramique fissurés."],
q:"Pourquoi les escaliers et les garde-corps ont-ils des mesures précises, alors que beaucoup d'autres finitions n'en ont pas ? Donne un exemple de risque.",
kw:["plancher","plinthe","porte","escalier","garde-corps","main courante","niveau"]},

{k:"fin:rac",add:"La peinture (fine bande jaune sur les murs), des armoires avec un comptoir et un évier, un luminaire et un avertisseur de fumée au plafond, une prise. Les appareils sont raccordés à la plomberie et à l'électricité.",
pins:[[270,92,"Armoires hautes et basses ; le comptoir est posé à environ 90 cm du sol."],[236,112,"Évier raccordé au siphon et aux tuyaux de la page 27."],[150,82,"Luminaire raccordé au câble du plafond."],[210,82,"Avertisseur de fumée au plafond."]],
why:"C'est la dernière ligne droite à l'intérieur : on peint, on installe les armoires, puis chaque entrepreneur (plombier, électricien, chauffagiste) revient faire les raccordements finaux. Ils transforment un chantier en maison habitable. Certaines erreurs se voient tout de suite (une prise qui ne marche pas), d'autres lentement (une fuite sous l'évier).",
how:["On applique l'apprêt puis la peinture ou le vernis (souvent deux couches), sur le gypse et les boiseries.","On installe les armoires, de niveau, fixées aux poteaux (pas seulement au gypse), puis le comptoir et le dosseret.","Le plombier raccorde les appareils : évier, toilette, bain ou douche, lave-linge, lave-vaisselle, avec des robinets d'arrêt et des siphons accessibles.","L'électricien installe les prises, les interrupteurs, les luminaires, les plaques, les avertisseurs de fumée et de monoxyde de carbone.","Le chauffagiste pose les grilles et les registres, installe les thermostats et règle le système.","On calfeutre les joints autour de l'évier, du bain et de la douche.","On teste chaque système (eau chaude et froide, prises, chauffage, ventilation, évacuations) avant la remise des clés."],
dims:["Hauteur du comptoir : environ 900 mm ; armoires hautes : environ 450 à 500 mm au-dessus du comptoir (à valider).","Calfeutrage des pièces humides : produit prévu pour les pièces humides ; à refaire quand il craque ou noircit."],
err:["Appareil mal raccordé ou qui fuit → dégât lent sous l'évier, pourriture du meuble.","Prise sans courant, mal câblée (polarité inversée) ou interrupteur qui ne répond pas.","Avertisseur absent, mal placé ou sans pile.","Calfeutrage fissuré ou absent autour de la baignoire, de la douche ou de l'évier → eau dans le mur ou sous le meuble."],
seen:["Sous les éviers : humidité, rouille, fuite, tuyaux souples tordus ; robinets qui coulent ; drains lents.","Prises : polarité, mise à la terre, DDFT qui déclenche.","Calfeutrage : fissures, moisissure noire, joints décollés.","Armoires : fixées, portes alignées, tiroirs qui glissent.","Peinture : surtout ce qu'elle peut cacher (taches d'eau repeintes, fissures masquées)."],
q:"Pourquoi est-il important de tester chaque raccordement avant de remettre les clés ? Donne un exemple d'erreur qui se voit lentement.",
kw:["peinture","armoire","raccordement","calfeutrage","avertisseur","test"]},

{k:"fini:niv",add:"Le terrain est remodelé : le sol descend en pente douce en s'éloignant du mur, un perron mène à la porte, et un arbre est planté à bonne distance de la maison.",
pins:[[-8,190,"Pente du terrain : le sol descend en s'éloignant du mur, pour que l'eau s'en aille."],[338,138,"Perron et marches vers la porte d'entrée."],[-6,100,"Arbre planté assez loin des murs et de la fondation."]],
why:"Cette dernière étape du terrain décide si toute la protection construite jusqu'ici (enduit, drain, gouttières) sera aidée ou combattue. Une pente qui amène l'eau vers la maison annule beaucoup de bon travail. Le terrain donne aussi les accès sécuritaires : entrée, marches, perron.",
how:["On remet la terre végétale et on fait le nivellement final : le sol le plus haut est contre le mur, et il descend en s'éloignant.","On construit l'entrée d'auto, les marches et les allées : leur pente éloigne aussi l'eau, et elles ne touchent pas les murs de façon à les pousser.","On construit le perron, la terrasse et la clôture, au besoin. S'ils sont rattachés à la maison, leurs appuis vont sous la limite du gel.","On plante les arbres et arbustes à bonne distance des murs, du toit et de la fondation.","On installe le système d'arrosage, s'il y en a un.","On vérifie que les rejets des descentes pluviales dirigent l'eau loin du mur."],
dims:["Pente du sol près du mur : environ 5 % sur les premiers 1,5 à 2 m (à valider).","Dégagement entre le sol et le bas du revêtement : au moins 200 mm environ (à valider).","Arbres : plantés à une distance où leurs racines et leurs branches ne toucheront pas la fondation ni le toit, souvent de plusieurs mètres pour un grand arbre."],
err:["Pente vers la maison ou terre contre le revêtement → eau et humidité au sous-sol, pourriture du bas des murs.","Marches et allées qui s'affaissent ou se soulèvent avec le gel → chute, pente vers le mur.","Arbres trop près → racines dans le drain ou la fondation, branches sur le toit.","Perron ou terrasse mal ancrés, garde-corps lâche → chute."],
seen:["Flaques près des fondations ; pente vers la maison ; sol contre le revêtement ; tranchée de remblai affaissée.","Marches et allées inclinées vers la maison, soulevées, fissurées.","Arbres et arbustes trop proches.","Terrasse : ancrage, garde-corps, marches uniformes, pourriture."],
q:"Imagine la pente du terrain autour de ta maison miniature. Dans quel sens doit-elle aller, et quel lien y a-t-il avec le drain de la page 7 ?",
kw:["pente","nivellement","eau","perron","arbre","dégagement"]},

{k:"fini:rec",add:"La maison est terminée : le soleil brille, la clé est remise et les pointillés ont disparu. C'est la maison du plan de la page 1, construite pièce par pièce.",
pins:[[312,40,"La clé : la maison est livrée à son propriétaire."],[150,112,"Toute la maison est là. Chaque pièce a un rôle et repose sur celles du dessous."]],
why:"À la fin des travaux, le propriétaire fait avec l'entrepreneur la visite de réception : il examine la maison, note ce qui reste à corriger et récupère les documents. Pour une maison neuve, le plan de garantie protège l'acheteur. Après la remise des clés, c'est l'entretien qui prend le relais.",
how:["On fait la visite de réception avec l'entrepreneur, pièce par pièce, système par système.","On note par écrit tous les défauts apparents et les travaux inachevés.","On signe la liste avec des délais de correction, et on garde une copie.","Le plan de garantie couvre ensuite certaines catégories de problèmes (malfaçons apparentes, vices cachés, vices majeurs), chacune avec ses règles et ses délais. Les délais exacts sont à vérifier dans le règlement sur le plan de garantie.","On remet les documents : plans finaux, garanties des fabricants, manuels d'appareils, certificats.","Une fois la maison livrée, l'entretien prend le relais : nettoyer les gouttières, remplacer les filtres, refaire le calfeutrage, surveiller le toit."],
dims:["Les délais de la garantie sont fixés par règlement. Ne les retiens pas de mémoire : vérifie dans le règlement ou avec ton enseignant.","Garder longtemps les plans, les factures et les garanties."],
err:["Réception faite trop vite, sans liste écrite → on perd des recours pour des défauts pourtant visibles.","Documents manquants (plans, garanties) → difficile de prouver quoi que ce soit.","Entrepreneur non accrédité par la GCR sur une maison neuve → pas de plan de garantie.","Entretien négligé → de petits défauts qui deviennent gros (gouttières bouchées, calfeutrage sec)."],
seen:["Maison neuve ou récente : le plan de garantie, les documents remis, la liste de réception.","Maison existante : ce qui a été entretenu ou non (gouttières, toiture, calfeutrage, système de chauffage).","L'état général comparé à l'âge de la maison : composantes qui arrivent en fin de vie utile (toiture, fenêtres, chauffe-eau)."],
q:"Écris dans tes mots, en cinq lignes, l'histoire de ta maison : de la feuille de plans jusqu'à la clé. Utilise les mots fondation, structure, enveloppe, systèmes et finition.",
kw:["réception","garantie","défauts","entretien","documents","vices"]}
);

["⚖️ Le chemin de la charge",["La neige et le vent sur le toit (page 18)","Les fermes (page 16)","Les murs extérieurs : poteaux et sablière (page 13), avec leurs linteaux (page 14)","Le plancher : sous-plancher et solives (pages 10 et 12)","La poutre et la colonne au centre (page 11)","Les murs de fondation et les semelles (pages 5 et 6)","Le sol non remanié, sous la limite du gel (pages 3 et 4)"]],
["💧 Le chemin de l'eau",["Les bardeaux, les solins et le larmier (pages 17 et 18)","Les gouttières, les descentes et le rejet (page 20)","La pente du terrain (page 33)","Sur les murs : revêtement, lame d'air, membrane, solins de fenêtres (pages 21 à 23)","Autour de la fondation : enduit, pierre, drain, puisard (page 7)","Sous la dalle : pierre et membrane (page 8)"]],

];
// Onglet « Ma maison, le livre » : une page par étape, maison en coupe cumulative, « Dans mes mots », vérification par mots-clés
const lvSt=()=>S.et.livre||(S.et.livre={notes:{},ok:{},last:0});
const lvDone=()=>{const o=lvSt().ok||{};return LVB.filter(p=>o[p.k]).length};
function lvEtc(k){const q=k.split(":"),A=ETC.find(x=>x.id===q[0]);return{a:A,b:A&&A.subs.find(x=>x.id===q[1])}}
function lvGo(n){const C=S.lv||(S.lv={p:null});C.p=n;if(n>=1&&n<=LVB.length){lvSt().last=n;etSave()}go("livre");window.scrollTo(0,0)}
let lvTm=0;
function lvNote(k,v){const s=lvSt();s.notes=s.notes||{};if(v.trim())s.notes[k]=v;else delete s.notes[k];clearTimeout(lvTm);lvTm=setTimeout(etSave,500)}
function lvProg(){const n=lvDone(),t=LVB.length,a=$("lvp"),b=$("lvpb");if(a)a.textContent=n+"/"+t+" pages comprises";if(b)b.style.width=Math.round(n*100/t)+"%"}
function lvOk(k,v){const s=lvSt();s.ok=s.ok||{};if(v)s.ok[k]=1;else delete s.ok[k];etSave();lvProg()}
function lvCheck(k){const o=$("lvo");if(!o)return;const p=LVB.find(x=>x.k===k),raw=(lvSt().notes||{})[k]||"",t=csNorm(raw);
if(t.trim().length<20){o.textContent="Écris d'abord quelques lignes dans tes mots, puis relance la vérification.";return}
const ok=[],ko=[];p.kw.forEach(w=>(t.includes(csNorm(w))?ok:ko).push(w));
o.innerHTML=`<b>Vérification par mots-clés</b><div style="margin:4px 0">${ok.length?"✅ Tu as parlé de : "+ok.map(esc).join(", "):"Tu n'as encore touché à aucune des idées clés de cette page."}</div>${ko.length?`<div style="margin:4px 0">👀 Tu n'as pas encore parlé de : <b>${ko.map(esc).join(", ")}</b>. Relis la page : y a-t-il quelque chose à ajouter dans tes mots ?</div>`:`<div style="margin:4px 0">Tu as touché à toutes les idées clés. Relis ton texte : est-il juste et clair ?</div>`}<div class="mut" style="font-size:12px">Vérification simple, par mots-clés : ce n'est pas une note, et un mot absent ne veut pas dire que tu as tort (tu peux avoir un synonyme).</div>`}
async function lvAsk(k,mode){const p=LVB.find(x=>x.k===k),e=lvEtc(k),o=$("lvo");if(!p||!o||!e.b)return;const note=((lvSt().notes||{})[k]||"").trim();
if(mode==="verify"&&note.length<20){o.textContent="Écris d'abord quelques lignes dans tes mots.";return}
const base="Tu aides un étudiant de l'AEC en inspection de bâtiment (Québec, Collège C.E.I.). Il construit une maison miniature page par page pour comprendre la construction. Sujet : « "+e.b.t+" » (étape : "+e.a.t+"). Résumé du livre : "+p.why+" Étapes : "+p.how.join(" ; ")+".";
const pr=mode==="quiz"?base+" Pose UNE question de compréhension en français (pas de choix multiples), sans donner la réponse. Attends la réponse de l'étudiant.":mode==="verify"?base+"\n\nTexte écrit par l'étudiant avec ses mots :\n« "+note+" »\n\nDis en français simple ce qui est juste, ce qui manque et ce qui est inexact, en 8 lignes maximum. Ne réécris pas son texte à sa place et ne donne pas de note. Reste prudent : n'invente aucun article du Code ni aucune dimension, et dis « à vérifier » si tu n'es pas certain.":base+" Explique ce sujet autrement, en français simple, avec une analogie du quotidien, en 8 à 10 lignes maximum. Reste prudent : n'invente aucun article du Code ni aucune dimension, et dis « à vérifier » si tu n'es pas certain. Termine par une question pour vérifier que l'étudiant a compris.";
o.textContent="⏳ …";try{const r=await etAI(pr);if(r.copied){o.textContent=r.text;return}o.textContent=(r.text||"").trim()+"\n\n(Réponse d'une IA : reformule avec tes mots et valide avec tes recueils.)"}catch(x){o.textContent="⚠ "+aiErr(x)}}
function lvOpenCons(k){const e=lvEtc(k);if(!e.a)return;S.cs=S.cs||{st:null,q:"",open:null};S.cs.st=e.a.id;S.cs.open=k;S.cs.q="";go("constr");window.scrollTo(0,0)}
const lvBadge=n=>`<span style="flex:none;width:20px;height:20px;border-radius:50%;background:#0f4c5c;color:#fff;text-align:center;font-size:12px;line-height:20px;font-weight:700">${n}</span>`;
const lvSec=(t,b)=>`<div class="mut" style="margin-top:10px"><b>${t}</b></div>${b}`;
const lvUl=a=>`<ul style="margin:4px 0 8px;padding-left:20px">${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
function lvToc(){const N=LVB.length,s=lvSt(),notes=s.notes||{},ok=s.ok||{},t=lvDone(),pc=Math.round(t*100/N);
return `<div class="row"><button class="alt" onclick="go('home')">← Accueil</button></div><h1>📖 Ma maison, le livre</h1><div class="mut">Une page par étape : tu construis une petite maison, de la terre à la clé.</div>
<div class="card" style="background:var(--bg)"><div class="mut">Chaque page ajoute une pièce à la maison en coupe, explique son rôle, comment on la pose, ce qui peut mal tourner et ce que l'inspecteur observe, puis te laisse écrire dans tes mots. Les textes sont des résumés écrits pour Lisa : les valeurs sont données à titre d'exemple, et le Code et les plans ont toujours priorité. Valide avec tes recueils et ton enseignant, et ne copie pas ces textes dans un travail noté.</div></div>
<div class="card">${lvScene(N+1,[])}<div class="mut">La maison finie : on la construit page par page.</div></div>
<div class="card"><b>Ma progression</b> <span class="mut" id="lvp">${t}/${N} pages comprises</span><div style="background:var(--line);border-radius:99px;height:10px;margin-top:6px"><div id="lvpb" style="background:var(--pri);height:10px;border-radius:99px;width:${pc}%"></div></div></div>
${s.last?`<button class="big" onclick="lvGo(${s.last})">▶ Reprendre à la page ${s.last}</button>`:`<button class="big" onclick="lvGo(1)">▶ Commencer à la page 1</button>`}
<h2>Table des matières</h2>${LVCH.map(c=>{let r=`<div class="mut" style="margin-top:10px">${c[0]} ${esc(c[1])}</div>`;for(let n=c[2];n<=c[3];n++){const p=LVB[n-1],e=lvEtc(p.k);r+=`<button class="alt" style="width:100%;text-align:left;margin:4px 0" onclick="lvGo(${n})">${ok[p.k]?"✅":"▫️"} ${n}. ${esc(e.b?e.b.t:p.k)}${notes[p.k]?" ✍️":""}</button>`}return r}).join("")}
<button class="alt" style="width:100%;margin-top:10px" onclick="lvGo(${N+1})">🏡 La maison terminée</button>`}
function lvNav(n){const N=LVB.length,pv=n>1?`<button class="alt" onclick="lvGo(${n-1})">← Page ${n-1}</button>`:"",nx=n<N?`<button onclick="lvGo(${n+1})">Page ${n+1} →</button>`:`<button onclick="lvGo(${N+1})">🏡 La maison terminée →</button>`;return `<div class="row" style="margin-top:10px">${pv}${nx}</div>`}
function lvPage(n){const N=LVB.length,p=LVB[n-1],e=lvEtc(p.k),A=e.a,B=e.b,s=lvSt(),note=(s.notes||{})[p.k]||"",ok=(s.ok||{})[p.k],ch=LVCH.find(c=>n>=c[2]&&n<=c[3]);
return `<div class="row"><button class="alt" onclick="S.lv.p=null;go('livre')">☰ Table des matières</button></div>
<div class="mut">${ch?ch[0]+" "+esc(ch[1])+" · ":""}Page ${n} sur ${N}</div><h1>${n}. ${esc(B.t)}</h1>
<div class="card">${lvScene(n,p.pins)}<div style="margin-top:6px"><b>Ce qu'on ajoute à la maison :</b> ${esc(p.add)}</div>
<div style="margin:8px 0 0">${p.pins.map((x,i)=>`<div style="display:flex;gap:8px;margin:3px 0">${lvBadge(i+1)}<span>${esc(x[2])}</span></div>`).join("")}</div><div class="mut" style="font-size:12px;margin-top:6px">Coupe simplifiée dessinée pour Lisa, pas à l'échelle. Les pièces de cette page brillent en orange.</div></div>
${lvSec("🎯 À quoi ça sert",`<div style="margin:4px 0 8px">${esc(p.why)}</div>`)}
${lvSec("🛠️ Comment on le fait, étape par étape",`<ol style="margin:4px 0 8px;padding-left:20px">${p.how.map(x=>`<li style="margin:3px 0">${esc(x)}</li>`).join("")}</ol>`)}
${lvSec("📏 Valeurs courantes (à valider)",lvUl(p.dims)+`<div class="mut" style="font-size:12px">Valeurs données à titre d'exemple : le Code, les plans et ton enseignant ont toujours priorité.</div>`)}
${lvSec("⚠️ Ce qui peut mal tourner",lvUl(p.err))}
${lvSec("🔎 Ce que l'inspecteur observe",lvUl(p.seen))}
<details class="card" style="padding:0;margin-top:10px"><summary style="padding:12px;cursor:pointer"><b>🔍 Gros plan de la pièce</b></summary><div style="padding:0 12px 12px">${csDraw(p.k)||'<div class="mut">Pas de gros plan pour cette page.</div>'}</div></details>
${B.w&&B.w.length?lvSec("🔤 Mots à connaître",`<ul style="margin:4px 0 8px;padding-left:20px">${B.w.map(w=>`<li><b>${esc(w[0])}</b> : ${esc(w[1])}</li>`).join("")}</ul>`):""}
${B.c?lvSec("📖 Où voir dans le Code",`<div style="margin:4px 0 8px">${esc(B.c)}</div>`):""}
<div class="card" style="margin-top:12px;border-color:var(--pri)"><b>✍️ Dans mes mots</b><div class="mut" style="margin:4px 0">${esc(p.q)}</div>
<textarea rows="6" aria-label="Dans mes mots" placeholder="Écris ici avec tes propres mots…" oninput="lvNote('${p.k}',this.value)">${esc(note)}</textarea>
<div class="row" style="margin-top:6px"><button class="alt" onclick="lvCheck('${p.k}')">🧪 Vérifier mon texte</button><button class="alt" onclick="lvAsk('${p.k}','verify')">🤖 Avis de l'IA</button></div>
<div class="row" style="margin-top:6px"><button class="alt" onclick="lvAsk('${p.k}')">💡 Expliquer autrement</button><button class="alt" onclick="lvAsk('${p.k}','quiz')">🧠 Me poser une question</button></div>
<div id="lvo" style="margin-top:8px;white-space:pre-wrap"></div>
<label style="display:flex;gap:10px;align-items:center;margin-top:10px"><input type="checkbox" style="width:24px;height:24px;margin:0" ${ok?"checked":""} onchange="lvOk('${p.k}',this.checked)"> J'ai compris cette page</label>
<div class="mut" style="font-size:12px;margin-top:6px">Ton texte reste sur ton appareil. Écris avec tes mots : ces pages aident à comprendre, elles ne sont pas à copier dans un travail noté.</div></div>
<div class="row" style="margin-top:10px"><button class="alt" onclick="lvOpenCons('${p.k}')">🏗️ Voir la fiche dans Construction</button></div>
${lvNav(n)}`}

function lvFin(){const N=LVB.length,s=lvSt(),note=(s.notes||{})._fin||"";
