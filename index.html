// Dessin de la page n (1 à 35). pins : [[x,y,"texte"],…] numérotés dans l'ordre.
function lvScene(n,pins){let s="";const hl=n>=1&&n<=34;LVL.forEach(l=>{if(l.p>n)return;if(l.u!==undefined&&n>=l.u)return;s+=l.p===n&&n>0?`<g style="filter:drop-shadow(0 0 2.5px #e8590c)">${l.svg()}</g>`:`<g>${l.svg()}</g>`});
(pins||[]).forEach((p,i)=>{s+=dp(i+1,p[0],p[1])});
return `<svg viewBox="-24 0 408 296" width="100%" role="img" aria-label="Coupe de la maison miniature à l'étape ${n}" style="max-width:600px;display:block;font:10px system-ui,sans-serif">${s}</svg>`}
// Les couches de la page n (p === n) pour le réglage et les tests
const lvCount=()=>LVL.filter(l=>l.p>0).length;
// Livre « Ma maison » : contenu des pages 1 à 9 (résumés originaux écrits pour Lisa; valeurs à valider avec l'enseignant)
const LVB=[
{k:"avant:plans",add:"Rien n'est encore construit : il y a seulement le terrain et une feuille de plans (en haut à gauche). Les pointillés montrent la maison qu'on veut obtenir à la fin.",
pins:[[2,40,"La feuille de plans et le permis : tout est décidé ici, avant de creuser."],[180,40,"La maison projetée, en pointillé. C'est le but du livre : la construire pièce par pièce."]],
why:"Une maison est un énorme assemblage de pièces qui doivent toutes se retrouver au bon endroit. Les plans sont la recette : sans eux, personne ne sait quelle profondeur creuser, quelle poutre prendre ou où passent les tuyaux. Le permis, lui, confirme qu'on a le droit de construire ça à cet endroit-là.",
how:["On commence par le terrain : le plan de l'arpenteur-géomètre donne les limites, les passages de droit (servitudes) et les niveaux.","Un technologue ou un architecte dessine les plans : plan de chaque étage, coupes (comme notre dessin), façades et détails. Un ingénieur intervient pour les parties spéciales (grande poutre, fondation difficile).","On écrit le devis : la liste des matériaux et la façon de les poser. Le plan dit quoi et où, le devis dit avec quoi et comment.","On estime le coût total et on obtient le financement. La banque demande souvent les plans, le devis et le nom d'un entrepreneur licencié.","On dépose la demande de permis à la municipalité. Elle vérifie le zonage (usage permis, marges de recul, hauteur, pourcentage du terrain occupé) puis la conformité au règlement de construction.","On choisit l'entrepreneur : licence RBQ valide pour ce genre de travaux. Pour une maison neuve, il doit aussi être accrédité par la GCR (garantie de construction résidentielle).","Si le sol est douteux, on commande une étude de sol avant de finaliser les plans de fondation."],
dims:["Les marges de recul et la hauteur permise changent d'une ville à l'autre : on ne retient pas un chiffre, on retient où le trouver (le règlement de zonage de la municipalité).","Le délai d'un permis va de quelques semaines à quelques mois selon la ville et le projet (à valider)."],
err:["Construire sans permis ou différemment du permis → difficulté à vendre ou à assurer, ordre de régulariser ou de démolir.","Plans incomplets (pas de détails de fondation ou de poutre) → décisions improvisées sur le chantier, erreurs coûteuses.","Entrepreneur sans licence ou sans accréditation GCR pour une maison neuve → peu de recours en cas de problème.","Marges non respectées → conflit avec le voisin, correction obligatoire."],
seen:["Demander les plans et les permis du bâtiment et des rénovations, puis les comparer avec ce qui existe (agrandissement, véranda, sous-sol aménagé, garage).","Signaler un doute quand une transformation semble récente et sans permis connu (mur enlevé, pièce ajoutée). L'inspecteur n'est pas arpenteur : il signale, il ne mesure pas les limites.","Pour une maison neuve : vérifier que le plan de garantie est en place."],
q:"Dans tes mots : pourquoi on ne peut pas simplement « commencer à creuser » ? Nomme au moins trois choses qu'il faut avoir avant le premier coup de pelle.",
kw:["plans","permis","zonage","marge","devis","licence","garantie"]},

{k:"avant:impl",add:"Le terrain reçoit ses repères : des piquets avec une planche (chaise) et un cordeau orange qui marquent où seront les murs, et le triangle orange à gauche, le repère de niveau.",
pins:[[34,152,"Piquet et « chaise » : on tend un cordeau entre eux pour marquer l'emplacement des murs."],[-8,160,"Repère de niveau : toutes les hauteurs seront mesurées à partir de ce point."],[18,128,"Limite prévue de l'excavation (on creuse plus large que la maison, pour pouvoir travailler autour des murs)."]],
why:"La maison doit être au bon endroit (respecter les marges), à la bonne hauteur (pour que l'eau s'éloigne) et d'équerre. Une erreur de 30 cm à cette étape ne se corrige pas : elle se coule en béton.",
how:["L'arpenteur retrouve les bornes du terrain (les repères qui marquent les coins) et vérifie les limites.","À partir de ces bornes, il marque les coins du bâtiment avec des piquets, selon le plan d'implantation.","On vérifie les marges : la distance entre chaque mur et chaque limite du terrain doit respecter le zonage.","On fixe un repère de niveau stable (un piquet, un poteau) et on décide de la hauteur du dessus de la fondation par rapport à la rue et au terrain.","On trace le contour de l'excavation : plus grand que la maison, avec un talus (paroi inclinée) pour travailler et poser le drain.","On installe les chaises (planches clouées sur des piquets, un peu en dehors des coins) avec un cordeau tendu. Les piquets de coin seront arrachés par la pelle, mais les chaises gardent les repères.","On vérifie l'équerre en mesurant les deux diagonales du rectangle : si elles sont égales, les coins sont d'équerre."],
dims:["Espace de travail autour des murs : souvent de 0,6 à 1 m, plus si le talus est incliné (à valider avec le plan).","Dessus du mur de fondation au-dessus du sol fini : au moins 150 à 200 mm environ (à valider).","Test d'équerre : deux diagonales égales."],
err:["Maison trop proche d'une limite → non-conformité, conflit avec le voisin.","Fondation trop basse par rapport au terrain → sol qui touche le revêtement, eau qui coule vers la maison, pourriture.","Bâtiment hors équerre → murs, revêtements et armoires qui ne s'ajustent pas.","Niveau de référence perdu → écarts de hauteur entre les parties de la maison."],
seen:["La pente du terrain : l'eau s'éloigne-t-elle de la maison ? C'est une conséquence directe de la hauteur choisie ici.","Le dégagement entre le sol et le bas du revêtement extérieur.","Une maison très près d'une limite : à mentionner comme doute, sans prétendre mesurer."],
q:"À quoi sert le repère de niveau, et pourquoi la hauteur de la fondation par rapport au terrain est-elle si importante pour l'eau ?",
kw:["arpenteur","marge","niveau","piquet","excavation","équerre"]},

{k:"fond:sol",add:"Le sol apparaît en couches : terre végétale (brun foncé), sol naturel (beige) et roc (gris). Les tirets bleus montrent la nappe d'eau, et le trou fin à gauche est un sondage pour voir ce qu'il y a dessous.",
pins:[[-11,205,"Sondage : on regarde ce qu'il y a sous la surface (forage ou fosse d'essai)."],[110,180,"Terre végétale : bonne pour le gazon, mauvaise pour porter une maison. On l'enlève."],[110,226,"Sol naturel (sable, gravier, argile…) : c'est lui qui portera la maison."],[110,256,"Nappe d'eau : niveau de l'eau souterraine, qui monte et descend selon la saison."],[110,282,"Roc : très solide, mais plus difficile à creuser."]],
why:"La maison pèse des dizaines de tonnes. Le sol doit la porter sans s'enfoncer, sans bouger quand il gèle et sans devenir de la boue. Chaque sol se comporte à sa façon : le roc et le gravier portent très bien, le sable compact aussi, l'argile porte mais gonfle et rétrécit avec l'eau, et la terre végétale ou la terre rapportée (remblai) ne portent pas du tout.",
how:["On observe le terrain : pente, creux où l'eau s'accumule, arbres, anciens remblais, constructions voisines.","On s'informe : cartes de dépôts de sol, voisins, historique du terrain.","Si le sol est douteux (ou si la banque ou la municipalité l'exige), un ingénieur en géotechnique fait des forages ou des fosses d'essai.","On identifie les couches : nature du sol (roc, gravier, sable, silt, argile), épaisseur, compacité, humidité.","On repère la nappe d'eau : sa profondeur change avec les saisons et décide si le drainage sera simple ou difficile.","On détermine la capacité portante (la pression que le sol peut supporter) : elle sert à choisir la largeur des semelles. Sol faible : semelles plus larges, sol remplacé ou pieux.","On note les risques particuliers : argile qui gonfle, sol gélif (silt), pente instable, remblai récent."],
dims:["On ne retient pas un chiffre de capacité portante, on retient l'ordre : roc > gravier compact > sable compact > argile ferme > argile molle > remblai.","Pour une petite maison, les tables du Code donnent la largeur minimale des semelles selon la charge et le type de sol (à valider avec ton enseignant)."],
err:["Construire sur un remblai ou sur la terre végétale → tassement inégal, fissures, planchers inclinés.","Argile + gros arbre trop proche + été sec → le sol rétrécit d'un côté, la maison descend de ce côté.","Ignorer la nappe d'eau → sous-sol humide, pression de l'eau sur la dalle et les murs.","Terrain en pente mal stabilisé → glissement du sol."],
seen:["Fissures qui s'élargissent (verticales plus larges en haut ou en bas, ou en escalier dans la brique ou les blocs).","Portes et fenêtres qui coincent, planchers inclinés, un coin de maison plus bas que les autres.","Gros arbres près des murs sur un sol d'argile.","Eau qui reste au sol près de la maison."],
q:"Pourquoi un sol d'argile est-il plus délicat qu'un sol de gravier, même s'il peut être solide ? Et qu'est-ce qu'on enlève avant de construire, et pourquoi ?",
kw:["capacité portante","argile","nappe","remblai","tassement","terre végétale"]},

{k:"fond:excav",add:"On creuse : la cavité blanche est l'excavation. La ligne bleu pâle montre la limite du gel, environ 1,2 m sous la surface.",
pins:[[190,220,"La cavité. Le sous-sol sera ici ; on creuse jusqu'au niveau de la semelle."],[14,232,"Limite du gel : la semelle devra se trouver plus bas que cette ligne."],[33,200,"Talus : paroi inclinée pour éviter l'éboulement. Un trou mal étayé est dangereux."]],
why:"Il faut atteindre un sol solide qui n'a jamais été déplacé (sol non remanié) et descendre sous la profondeur où le sol gèle en hiver. L'eau du sol qui gèle gonfle (c'est la gélivité) et peut soulever ce qui est dessus. Pour un sous-sol, on creuse de toute façon plus profond que le gel.",
how:["On enlève la terre végétale (une trentaine de centimètres environ) et on la met de côté pour le terrain final.","La pelle creuse la cavité à la profondeur prévue au plan : plancher du sous-sol + dalle + pierre + semelle.","On garde une pente de talus sécuritaire sur les parois, ou on les étaie. Un éboulement est mortel : les règles de la CNESST encadrent le travail dans une tranchée.","On s'arrête sur le sol non remanié. Si on creuse trop profond, on ne remplit pas avec n'importe quelle terre : on comble avec un matériau granulaire compacté ou du béton, selon le plan.","On pompe l'eau au besoin pour garder le fond hors d'eau.","On nivelle le fond et on vérifie les profondeurs avec le repère de niveau.","On fait vérifier que le sol correspond à ce que le plan prévoyait."],
dims:["Limite du gel : souvent autour de 1,2 m dans la région de Montréal, plus profonde au nord (à valider selon la municipalité).","Hauteur libre d'un sous-sol : souvent autour de 2,4 m (8 pi).","Espace de travail autour des murs : de 0,6 à 1 m environ."],
err:["Semelles sur un sol remanié → tassement qui n'est pas égal partout.","Semelle au-dessus de la limite du gel (garage, galerie, perron) → soulèvement l'hiver, fissures, portes qui frottent.","Eau non contrôlée dans l'excavation → sol ramolli, semelles mal appuyées.","Talus mal fait → éboulement."],
seen:["Garages, galeries, perrons et marches : ils bougent souvent avec le gel quand leurs appuis sont peu profonds.","Fissures près des coins ou des descentes de sous-sol.","Fondation qui semble avoir bougé de façon inégale (un côté plus bas)."],
q:"Explique avec tes mots pourquoi la semelle doit être sous la limite du gel, et ce qui arrive si elle ne l'est pas.",
kw:["limite du gel","gélivité","sol non remanié","talus","semelle"]},

{k:"fond:sem",add:"Deux semelles de béton au fond de la cavité, avec une petite clé au centre de chacune et quelques barres d'acier (points noirs).",
pins:[[57,284,"Semelle : une base de béton plus large que le mur. Elle répartit le poids sur le sol."],[56,246,"Clé : une petite saillie qui retient le futur mur et l'empêche de glisser."],[304,284,"Même chose de l'autre côté : tout le périmètre de la maison a sa semelle."]],
why:"Un mur étroit posé directement sur le sol enfoncerait le sol en pressant sur une petite surface. La semelle étale le poids sur une plus grande surface, comme des raquettes sur la neige.",
how:["On monte les coffrages (formes en bois ou en métal) qui donnent sa forme à la semelle et on les met de niveau.","On vérifie que le fond est propre, sans eau, sur sol non remanié.","Si le plan le prévoit, on pose l'armature : des barres d'acier qui reprennent les tensions, à distance des bords pour qu'elles soient enrobées de béton.","On forme la clé (une rainure ou une saillie sur le dessus) ou on met des barres de liaison : elles aident le mur à rester en place sur la semelle.","On coule le béton, on le répartit et on le nivelle. On ne le polit pas : le mur sera coulé dessus.","Cure : le béton doit durcir en restant humide et à l'abri du gel pendant quelques jours.","On retire les coffrages après la prise. Les semelles des colonnes intérieures sont coulées en même temps ou à part."],
dims:["Largeur courante pour une petite maison : de 400 à 600 mm environ, selon la charge et le sol (le plan et la table du Code décident).","Épaisseur courante : de 150 à 250 mm.","La semelle dépasse le mur de chaque côté d'environ 100 à 150 mm."],
err:["Semelle trop étroite ou trop mince → tassement, fissures.","Béton coulé dans l'eau ou sur un sol gelé → béton faible, sol qui bouge au dégel.","Pas de clé ni d'armature quand elles sont requises → glissement du mur, fissures.","Semelle pas de niveau → le mur doit compenser, contraintes et fissures."],
seen:["Fissures verticales qui s'élargissent vers le haut ou vers le bas : un côté de la fondation bouge.","Rouille ou taches d'eau au pied des murs.","Semelle apparente à cause de l'érosion ou d'une excavation, surtout dans une fondation ancienne."],
q:"Avec une analogie (les raquettes, par exemple), explique ce que fait une semelle. Que se passerait-il si elle était plus étroite que prévu ?",
kw:["semelle","clé","armature","béton","charge","cure"]},

{k:"fond:murs",add:"Les murs de béton montent sur les semelles. Les petits traits noirs au sommet sont les boulons d'ancrage, qui dépassent du béton.",
pins:[[40,225,"Mur de fondation en béton : il retient la terre et porte la maison."],[40,160,"Boulon d'ancrage, noyé dans le béton frais : il retiendra plus tard le bois de la maison."],[330,225,"Le mur du côté opposé : même épaisseur, même hauteur."]],
why:"Le mur de fondation fait deux choses : il porte le poids de la maison jusqu'à la semelle, et il retient la terre qui pousse sur le côté. C'est un mur sous pression sur trois côtés : le poids au-dessus, la terre et l'eau autour.",
how:["On monte les coffrages des murs sur les semelles : panneaux tenus par des tiges et des cales, bien alignés.","On prévoit les ouvertures (fenêtres de sous-sol, entrée de service) avec des boîtes de coffrage, et les passages pour les tuyaux.","On coule le béton par couches et on le vibre avec une aiguille vibrante pour chasser l'air et éviter les nids d'abeilles (trous dans le béton).","On noie les boulons d'ancrage dans le béton frais, au sommet, à intervalles réguliers.","Cure : on laisse durcir le béton avant de retirer les coffrages.","On retire les coffrages, on bouche les trous laissés par les tiges et on examine le mur : fissures, nids d'abeilles, défauts.","Variantes : blocs de béton, pierre (maisons anciennes), béton coulé dans des coffrages isolants."],
dims:["Épaisseur courante : 200 mm (8 po), parfois 250 mm. La hauteur dépend du plan.","Le mur dépasse du sol fini d'au moins 150 à 200 mm environ (à valider).","Boulons d'ancrage : environ 12 mm de diamètre, espacés de 1,2 à 2,4 m environ (le plan et le Code précisent)."],
err:["Béton mal vibré → nids d'abeilles, infiltrations d'eau.","Fissure fine verticale régulière (retrait du béton) → fréquente, souvent bénigne mais à surveiller (largeur, eau).","Fissure horizontale, mur qui penche vers l'intérieur → poussée du sol ou de l'eau : sérieux.","Pas de boulons d'ancrage → maison mal retenue sur sa fondation."],
seen:["Fissure horizontale vers le milieu du mur avec déformation → poussée du sol.","Fissure verticale fine → retrait ; on note la largeur, la longueur et les traces d'eau.","Efflorescence (dépôt blanc) → de l'eau a traversé le mur.","Blocs fissurés, mortier qui s'effrite, pierre qui s'effrite : fondations anciennes."],
q:"Quelle est la différence entre une fissure verticale fine et une fissure horizontale dans un mur de fondation ? Pourquoi la seconde inquiète-t-elle davantage ?",
kw:["béton","coffrage","vibr","cure","boulon","fissure","poussée"]},

{k:"fond:hum",add:"Un enduit noir sur le mur extérieur, puis de la pierre concassée (points gris) qui entoure un drain (rond blanc) au pied de chaque mur.",
pins:[[40,198,"Enduit d'imperméabilisation (noir) sur la face extérieure du mur : il protège le béton de l'eau."],[40,244,"Pierre concassée entourée d'un géotextile (tissu, tirets verts) : l'eau passe, la terre reste dehors."],[20,262,"Drain perforé : il recueille l'eau et la mène vers la sortie."]],
why:"Le béton laisse passer un peu d'eau. L'eau est l'ennemie numéro un du sous-sol : moisissures, salpêtre, rouille, dalle soulevée. Première défense : l'empêcher d'arriver au mur (imperméabilisation). Deuxième : l'évacuer avant qu'elle s'accumule (drain).",
how:["On prépare le mur extérieur : on bouche les trous, on enlève les bavures de béton et on nettoie.","On applique l'enduit : un produit bitumineux ou une membrane autocollante, qui monte au-dessus du niveau du sol final.","Au besoin, on ajoute une membrane de drainage (feuille alvéolée) qui guide l'eau vers le bas le long du mur.","On installe le drain : un tuyau perforé d'environ 100 mm placé près de la semelle, avec une légère pente vers la sortie.","On l'entoure de pierre nette concassée et on enveloppe le tout dans un géotextile : le tissu empêche la terre fine de colmater la pierre et le drain.","On raccorde le drain à une sortie : égout (si permis), puisard avec pompe, ou rejet par gravité sur le terrain.","On ajoute au besoin un puits de fenêtre drainé devant une fenêtre sous le niveau du sol."],
dims:["Drain : environ 100 mm de diamètre, pente faible, souvent de l'ordre de 1 % (à valider).","Pierre autour du drain : une couche d'au moins 150 mm environ (à valider avec le plan).","L'enduit doit remonter jusqu'au-dessus du niveau du sol fini, sinon le haut du mur reste exposé à l'humidité."],
err:["Pas de drain, drain écrasé ou bouché → eau contre le mur et sous la dalle, infiltrations.","Géotextile absent → le drain se colmate de terre fine en quelques années.","Drain sans sortie → l'eau n'a nulle part où aller.","Enduit abîmé par le remblai ou trop court → humidité dans le haut du mur."],
seen:["Sous-sol qui sent le moisi, salpêtre, rouille au pied des poteaux ou de la fournaise, peinture qui cloque.","Puisard : couvercle, pompe qui fonctionne, sortie dégagée, pompe qui roule constamment.","Gouttières qui rejettent l'eau près du mur, sol qui s'incline vers la maison : l'eau arrive en trop grande quantité pour le drain.","Dalle fissurée avec traces d'eau au joint avec le mur."],
q:"En quatre ou cinq lignes : décris le chemin de l'eau de pluie depuis le toit jusqu'au drain, et dis où elle risque de passer si le drain est bouché.",
kw:["drain","géotextile","pierre","imperméab","humidité","puisard"]},

{k:"fond:dalle",add:"Une dalle de béton (gris) sur une couche de pierre avec une membrane bleue. Autour des murs, on remet la terre (le remblai).",
pins:[[190,238,"Dalle de béton : le plancher du sous-sol."],[190,264,"Pierre concassée compactée, avec une membrane (ligne bleue) : elle coupe les remontées d'humidité."],[38,198,"Remblai : terre propre remise contre les murs, par couches."]],
why:"La dalle est le plancher du sous-sol : une surface plane, propre et solide qui ferme le bas de la maison. La pierre dessous empêche l'eau de remonter comme dans un buvard (capillarité) et sert d'assise. Le remblai remet la terre autour des murs pour que le terrain reprenne sa forme.",
how:["On installe d'abord les tuyaux qui passent sous la dalle (drain principal, parfois conduites d'eau ou fourreaux). Une fois la dalle coulée, ils sont inaccessibles.","On étend de 100 à 150 mm de pierre concassée propre et on la compacte avec une plaque vibrante.","On pose une membrane (feuille de polyéthylène) sur la pierre ; parfois de l'isolant rigide aussi, si le plan le prévoit.","On coule la dalle (environ 75 à 100 mm), on l'étale et on la lisse. On trace ou on scie des joints de retrait pour que les fissures se fassent à ces endroits.","Cure : la dalle durcit en restant protégée quelques jours.","Remblai : on remet la terre propre contre les murs par couches compactées. Avant de remblayer, il faut en général que le plancher du dessus soit posé : il retient le haut des murs, sinon la terre les pousse vers l'intérieur.","On façonne la surface autour de la maison pour que l'eau s'éloigne (on la finit au dernier chapitre)."],
dims:["Épaisseur minimale de la dalle : environ 75 mm ; courante : 100 mm.","Pierre sous la dalle : environ 100 à 150 mm.","Joints de retrait : tous les quelques mètres, selon le plan (à valider)."],
err:["Pas de pierre ni de membrane → dalle humide, moisissure sous un revêtement de plancher.","Remblai lourd et argileux avant la pose du plancher → murs fissurés ou poussés vers l'intérieur.","Pierre mal compactée → la dalle s'affaisse, fissures larges avec dénivellation.","Pente du terrain vers le mur → l'eau de surface descend contre la fondation."],
seen:["Fissures de la dalle : largeur, dénivellation entre les lèvres, traces d'eau, soulèvement, son creux.","Joint entre la dalle et le mur : taches d'eau, efflorescence.","Remblai qui s'affaisse autour de la maison (fosse) : l'eau s'accumule contre le mur.","Eau qui monte par une fissure ou un joint après une forte pluie : pression hydrostatique."],
q:"Pourquoi installe-t-on les tuyaux sous la dalle avant de la couler, et pourquoi attend-on que le plancher soit posé avant de remblayer ?",
kw:["dalle","pierre","remblai","membrane","tuyaux","pression hydrostatique"]}
];
