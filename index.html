<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lisa — Inspection en bâtiment</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f4c5c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lisa">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#eef2f1;--card:#fff;--ink:#14272b;--mut:#5b6e72;--pri:#0f4c5c;--acc:#e08a00;--red:#c0392b;--ok:#2e7d4f;--line:#d3dcdc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1a1d;--card:#16282c;--ink:#e6eeee;--mut:#93a7aa;--pri:#4fb3c8;--line:#2a4046}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Bahnschrift,"Segoe UI",system-ui,sans-serif;max-width:640px;margin:auto;padding:14px}
h1{font-size:30px;margin:6px 0 2px;letter-spacing:-.5px}h2{font-size:20px;margin:14px 0 8px}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
button,.btn{font:inherit;border:0;border-radius:10px;padding:11px 16px;background:var(--pri);color:#fff;cursor:pointer;display:inline-block}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) button,:root:not([data-theme="light"]) .btn{color:#06181c}:root:not([data-theme="light"]) button.alt{color:var(--pri)}:root:not([data-theme="light"]) button.sec,:root:not([data-theme="light"]) button.tile,:root:not([data-theme="light"]) button.key{color:var(--ink)}}
button:disabled{opacity:.4;cursor:default}
.key{padding:16px 0;font-size:20px;text-align:center;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px}.key.op{background:var(--line)}.key.eq{background:var(--pri);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);padding:12px;min-height:88px;line-height:1.25}.tile span{font-size:24px}.tile small{color:var(--mut);font-size:12px}.grid2>.tile:last-child:nth-child(odd){grid-column:1/-1;min-height:72px}button.rec,:root:not([data-theme="light"]) button.rec{background:#c62828;color:#fff;animation:recp 1.4s ease-in-out infinite}@keyframes recp{50%{opacity:.75}}@media(prefers-reduced-motion:reduce){button.rec{animation:none}}
button.alt{background:transparent;color:var(--pri);border:1px solid var(--pri)}
button.warn{background:var(--acc);color:#1d1400}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.big{display:block;width:100%;text-align:left;padding:16px;margin:8px 0;font-size:18px}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 3px}
input,textarea,select{width:100%;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
textarea{min-height:70px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sec{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);margin:6px 0;text-align:left}
.dot{width:12px;height:12px;border-radius:50%;background:var(--red);flex:none}.dot.ok{background:var(--ok)}
.pill{font-size:13px;border-radius:99px;padding:2px 10px;background:var(--line);color:var(--ink)}
img.ph{max-width:100%;border-radius:8px;margin-top:6px}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:20px;z-index:9}
.modal .card{max-width:420px;width:100%}
.rep{background:#fff;color:#000;padding:18px;border-radius:6px;font-family:Georgia,serif}
.rep h2{color:#000}.rep .pg{border-bottom:1px dashed #999;padding-bottom:14px;margin-bottom:14px}
.rep .hd{font-size:12px;color:#444;border-bottom:1px solid #000;margin-bottom:10px;padding-bottom:4px}
.legal{font-size:12px;color:#333}
@page{margin:22mm 15mm}
@media print{body{max-width:none;padding:0;background:#fff}.noprint{display:none!important}.rep{padding:0}.rep .pg{break-after:page;border:0}.rep .pg:last-child{break-after:auto}.rep .hd{position:running(hd)}@page{@bottom-center{content:"Page " counter(page) " sur " counter(pages)}}}
canvas{touch-action:none;width:100%;display:block;border-radius:12px}.dsc-box{margin:6px 0 10px}details.dsc{border:1px solid var(--line);border-radius:10px;margin:6px 0;padding:0 12px;background:var(--card)}details.dsc>summary{cursor:pointer;display:flex;gap:10px;justify-content:space-between;align-items:baseline;padding:11px 0;font-weight:600;list-style:none}details.dsc>summary::-webkit-details-marker{display:none}details.dsc>summary .mut{font-weight:400;font-size:13px;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%}.dsc-ch{display:flex;flex-wrap:wrap;gap:8px;padding:0 0 12px}.dch{font:inherit;font-size:14px;border-radius:999px;padding:7px 12px;cursor:pointer;background:transparent;color:var(--ink);border:1px solid var(--line)}.dch.on{background:var(--pri);border-color:var(--pri);color:#fff}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dch{color:var(--ink)}:root:not([data-theme="light"]) .dch.on{color:#06181c}}:root[data-theme="dark"] .dch.on{color:#06181c}.scth{display:flex;gap:10px;overflow-x:auto;padding:10px 0}.scp{flex:0 0 auto;width:110px}.scp img{width:110px;height:140px;object-fit:cover;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script></head><body>
<div id="app"></div>
<script>
const SECTIONS=["Structure","Extérieur","Toiture","Plomberie","Électricité","Chauffage","Climatisation","Intérieur","Isolation / ventilation"];
const LEGAL=["Mandat d'inspection visuelle : l'inspection est limitée à ce qui est visible et accessible le jour de la visite, conformément à la norme BNQ 3009-500. Elle n'est ni une garantie ni une expertise.","Vices cachés : les éléments occultés ou non accessibles (derrière les murs, sous les finis, etc.) n'ont pu être évalués.","Déclaration du vendeur : le rapport complète la Déclaration du Vendeur et ne la remplace pas.","Zones inaccessibles : toute zone non inspectée est précisée dans le rapport; elle n'a pas fait l'objet de l'inspection."];
let S={list:[],cur:null,view:"home",sec:null,q:""};
try{S.list=JSON.parse(localStorage.getItem("lisa")||"[]")}catch(e){}
S.nt=[];try{S.nt=JSON.parse(localStorage.getItem("lisa_nt")||"[]")}catch(e){}if(!Array.isArray(S.nt))S.nt=[];
const NT={on:0,r:null,lang:"fr-CA",sil:0,blk:0};try{NT.blk=localStorage.getItem("lisa_micblk")?1:0}catch(e){}
const save=()=>{if(IDB.db){if(S.prof)IDB.set("prof",S.prof).catch(()=>{});if(S.cn)IDB.set("cn",S.cn).catch(()=>{});IDB.set("list",S.list).catch(()=>alert("Impossible d'enregistrer : espace insuffisant sur l'appareil."))}else{try{localStorage.setItem("lisa",JSON.stringify(S.list))}catch(e){alert("Stockage plein : exporte une sauvegarde et retire quelques photos.")}}};
const $=id=>document.getElementById(id);
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cur=()=>{const i=S.list.find(x=>x.id===S.cur);if(i&&i.sections)SECTIONS.forEach(n=>{if(!i.sections[n])i.sections[n]={constats:[],rien:false}});return i};
/* ===== Navigation : bouton Retour flottant + geste Retour d'Android ===== */
const BK={h:[],cur:null,skip:false,ps:false};
try{BK.ps=window.top===window&&!!history.pushState&&/^https?:$/.test(location.protocol)}catch(e){}
const bkKey=()=>S.view+"|"+(S.view==="section"?S.sec:"");
function bkTrack(){const k=bkKey(),c=BK.cur;
if(c&&c.k!==k&&!BK.skip){BK.h.push(c);if(BK.h.length>40)BK.h.shift();if(BK.ps){try{history.pushState({lisa:1},"")}catch(e){BK.ps=false}}}
BK.skip=false;BK.cur={k,view:S.view,sec:S.sec}}
function bkPop(){const st=BK.h.pop();if(!st){if(S.view!=="home")go("home");return}BK.skip=true;S.view=st.view;if(st.view==="section"&&st.sec!==undefined)S.sec=st.sec;render();scrollTo(0,0)}
function bkBack(){if(BK.ps&&BK.h.length){history.back();return}bkPop()}
addEventListener("popstate",()=>{if(BK.ps&&BK.h.length)bkPop()});
function bkBtn(){let b=$("bkb");if(S.view==="home"){if(b)b.style.display="none";return}
if(!b){b=document.createElement("button");b.id="bkb";b.type="button";b.className="noprint";b.setAttribute("aria-label","Retour à l'écran précédent");b.textContent="← Retour";b.onclick=bkBack;document.body.appendChild(b)}
const tb=$("tbar"),tOn=!!(tb&&tb.style.display!=="none");
b.style.cssText="display:flex;position:fixed;left:12px;bottom:calc("+(tOn?72:14)+"px + env(safe-area-inset-bottom,0px));z-index:6;align-items:center;padding:12px 20px;border-radius:999px;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.3)";
document.body.style.paddingBottom=(tOn?140:84)+"px"}
const go=(v,x)=>{S.view=v;if(x!==undefined)S.sec=x;render();scrollTo(0,0)};
function newInsp(){const i={id:Date.now(),client:{},sections:{},zones:"",modifs:[],created:new Date().toISOString(),status:"en cours",summary:"",locked:false};SECTIONS.forEach(s=>i.sections[s]={constats:[],rien:false});i.time={sec:0,run:true,t0:Date.now()};S.list.unshift(i);S.cur=i.id;save();go("fiche")}
function open(id,v){S.cur=id;go(v)}
function bind(obj,k){return e=>{obj[k]=e.target.value;save()}}
function inp(l,o,k,t){const id="f"+Math.random().toString(36).slice(2);setTimeout(()=>{const el=$(id);if(el)el.oninput=bind(o,k)},0);return `<label for="${id}">${l}</label><input id="${id}" type="${t||"text"}" value="${esc(o[k])}">`}
function render(){bkTrack();if(NT.on)ntStop();if(typeof DICT!=="undefined"&&DICT)dictStop();AN=null;PH=[];MES=[];const a=$("app");a.innerHTML=({home,regime,lexique,fiche,tour,section,review,report,old,bouclier,outils,pedago,risques,entente,profil,trad,facture,factures,agenda,clients,conformite,messages,calc,notes,scan,kit,cours,refs,comp,bul,inv,qcm,apropos,constr})[S.view]();tbar();bkBtn()}
function homeInsp(){const n=S.list.filter(i=>i.status==="en cours").length;return `<h1>Lisa</h1><div class="mut">Inspection en bâtiment · Québec · Standard C.E.I.</div>
<button class="big" onclick="newInsp()">✨ Nouvelle inspection</button>
<button class="big alt" onclick="S.cur=(S.list.find(i=>i.status==='en cours')||{}).id;S.cur?go('tour'):alert('Aucune inspection en cours.')">🔄 Inspection en cours <span class="pill">${n}</span></button>
<button class="big alt" onclick="go('old')">📂 Anciennes inspections</button>
<h2>Gestion</h2><div class="grid2"><button class="tile" onclick="go('agenda')"><span>📅</span>Agenda des visites</button><button class="tile" onclick="go('clients')"><span>👥</span>Clients</button><button class="tile" onclick="go('factures')"><span>🧾</span>Facturation</button><button class="tile" onclick="go('trad')"><span>🌐</span>Traducteur FR / EN</button><button class="tile" onclick="go('profil')"><span>👤</span>Mon profil<small>logo, sceau, signature</small></button><button class="tile" onclick="go('calc')"><span>🧮</span>Calculatrice<small>et convertisseur</small></button><button class="tile" onclick="go('lexique')"><span>📖</span>Lexique FR / EN<small>termes de l'inspection</small></button><button class="tile" onclick="openRg('home')"><span>🏛️</span>Quel code s'applique ?<small>régime et partie du Code</small></button><button class="tile" onclick="openNotes('home')"><span>🎙️</span>Notes vocales<small>${(S.nt||[]).length?(S.nt.length+" note"+(S.nt.length>1?"s":"")):"dicte, ça s'écrit en note"}</small></button></div>${bkCard()}<p class="mut">Prototype : tes données restent sur cet appareil. Aucune estimation de coûts de réparation n'est produite.</p><p class="mut" style="font-size:12px">Version du 30 oct. 2026 · rapport web</p>`}
function old(){const q=S.q.toLowerCase();const l=S.list.filter(i=>i.status!=="en cours"&&(i.client.nom+" "+i.client.adresse).toLowerCase().includes(q));
setTimeout(()=>{const s=$("q");if(s)s.oninput=e=>{S.q=e.target.value;render();$("q").focus()}},0);
return `<button class="alt" onclick="go('home')">← Accueil</button><h2>Anciennes inspections</h2><input id="q" placeholder="Chercher par nom ou adresse" value="${esc(S.q)}">`+(l.length?l.map(i=>`<div class="card"><b>${esc(i.client.nom)||"Sans nom"}</b><div class="mut">${esc(i.client.adresse)} · ${new Date(i.created).toLocaleDateString("fr-CA")} · ⏱ ${tfmt(tel(i))}</div><div class="row" style="margin-top:8px"><button class="alt" onclick="open(${i.id},'report')">Voir le rapport</button><button class="warn" onclick="askEdit(${i.id})">Modifier</button></div>${i.modifs.length?`<div class="mut">Modifié ${i.modifs.length} fois (dernière : ${new Date(i.modifs.at(-1)).toLocaleString("fr-CA")})</div>`:""}</div>`).join(""):`<p class="mut">Aucun rapport archivé pour l'instant. Termine une inspection pour la retrouver ici.</p>`)}
function askEdit(id,step=1){const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="card"><h2>${step==1?"Modifier ce rapport ?":"Dernière confirmation"}</h2><p>${step==1?"La modification sera horodatée dans la piste d'audit.":"Confirme à nouveau : le rapport archivé sera rouvert et la date de modification enregistrée."}</p><div class="row"><button class="alt" id="n">Annuler</button><button class="warn" id="y">${step==1?"Continuer":"Confirmer"}</button></div></div>`;document.body.appendChild(m);$("n").onclick=()=>m.remove();$("y").onclick=()=>{m.remove();if(step==1)askEdit(id,2);else{const i=S.list.find(x=>x.id===id);i.modifs.push(new Date().toISOString());i.status="en cours";save();open(id,"tour")}}}
function fiche(){const i=cur(),c=i.client;return `<button class="alt" onclick="go('home')">← Accueil</button><h2>Fiche d'identification</h2><div class="card">${inp("Nom complet du client",c,"nom")}${inp("Adresse de la maison",c,"adresse")}${inp("Téléphone",c,"tel","tel")}${inp("Courriel",c,"courriel","email")}${inp("Numéro de dossier",c,"dossier")}<div class="row" style="margin:-4px 0 8px"><button type="button" class="alt" onclick="genNum('H')">Générer : bâtiment (H)</button><button type="button" class="alt" onclick="genNum('C')">Générer : condo (C)</button></div>${inp("Date de l'inspection",c,"date","date")}${inp("Heure de début de l'inspection",c,"hdeb","time")}${inp("Heure de fin de l'inspection",c,"hfin","time")}${meteoSel(c)}${inp("Syndicat de copropriété (si applicable)",c,"syndicat")}<div class="mut" style="margin-top:-4px">Copropriété divise : demande à ton client d'informer le syndicat de la date de l'inspection.</div><label for="pres">Personnes présentes ou disponibles sur les lieux (nom et rôle)</label><textarea id="pres" oninput="cur().presents=this.value;save()">${esc(i.presents)}</textarea><label for="dsc">Description sommaire du bâtiment (type, fondation, revêtement, toiture, chauffage…)</label>${dscPick(i)}<textarea id="dsc" oninput="cur().desc=this.value;save()">${esc(i.desc)}</textarea><label for="dvv">Renseignements reçus verbalement (vendeur, courtier, propriétaire), autres que ceux de la Déclaration du vendeur</label><textarea id="dvv" oninput="cur().dvv=this.value;save()">${esc(i.dvv)}</textarea>${dictBtn("dvv")}<label for="cvp">Photo du bâtiment (page couverture)</label><input id="cvp" type="file" accept="image/*" onchange="setCover(this.files)">${i.cover?`<img class="ph" src="${i.cover}" alt="Photo du bâtiment">`:""}<label for="lg">Langue du rapport PDF</label><select id="lg" onchange="cur().lang=this.value;save()"><option value="fr" ${i.lang!=="en"?"selected":""}>Français</option><option value="en" ${i.lang==="en"?"selected":""}>English</option></select></div><button class="alt" onclick="openRg('fiche')">🏛️ Quel code s'applique à ce bâtiment ?</button><button onclick="go('entente')">Continuer : entente de service</button>`}
function tour(){const i=cur();return `<button class="alt" onclick="go('home')">← Accueil</button><h2>Tour de la maison</h2>${(i.ent&&i.ent.sig&&i.ent.ok)?"":`<button class="big warn" onclick="go('entente')">⚠ Entente de service non signée. Touche ici</button>`}<div class="mut">${esc(i.client.nom)} · ${esc(i.client.adresse)}</div><div class="card" style="padding:0"><canvas id="h3d" height="260"></canvas><div class="mut" style="padding:8px 12px">Glisse pour tourner, touche une partie ou une pastille pour ouvrir sa section. Pastille rouge : à compléter. Verte : complétée.</div><div class="row" style="padding:0 12px 12px"><button class="${i.etages===2?"alt":""}" onclick="cur().etages=1;save();render()">Bungalow</button><button class="${i.etages===2?"":"alt"}" onclick="cur().etages=2;save();render()">2 étages</button></div></div><h2>Sections à inspecter</h2>`+SECTIONS.map(s=>{const d=i.sections[s],ok=d.constats.length||d.rien||d.na;return `<button class="sec" onclick="go('section','${s}')"><span>${s}</span><span class="row"><span class="pill">${d.na?"N/A":d.constats.length+" constat"+(d.constats.length>1?"s":"")}</span><span class="dot ${ok?"ok":""}"></span></span></button>`}).join("")+`<h2>Outils de terrain</h2><div class="grid2"><button class="tile" onclick="go('bouclier')"><span>🛡️</span>Bouclier juridique<small>${(i.zl||[]).length} zone(s) non inspectée(s)</small></button><button class="tile" onclick="go('kit')"><span>🎒</span>Avant la visite<small>Matériel et ordre de la visite</small></button><button class="tile" onclick="go('outils')"><span>🧰</span>Journal des outils<small>${(i.tl||[]).length} consigné(s)</small></button><button class="tile" onclick="go('risques')"><span>🗺️</span>Risques et signes<small>${RR.filter(r=>!((i.rr||{})[r.k]&&i.rr[r.k].st&&i.rr[r.k].st!=="Non vérifié")).length} à vérifier</small></button><button class="tile" onclick="go('messages')"><span>✉️</span>Messages au client</button><button class="tile" onclick="go('scan')"><span>📄</span>Scanner un document<small>${(i.scans||[]).length} au dossier</small></button><button class="tile" onclick="openNotes('tour')"><span>🎙️</span>Notes vocales<small>${(S.nt||[]).filter(n=>n.insp===i.id).length} pour ce dossier</small></button></div><h2>Avant de terminer</h2><div class="grid2"><button class="tile" onclick="go('conformite')"><span>✅</span>Conformité et documents<small>${confSum(i)}</small></button><button class="tile" onclick="S.pi=0;go('pedago')"><span>🎓</span>Visite guidée du client</button></div><button class="big" style="margin-top:14px" onclick="go('review')">Terminer et réviser →</button>`+(setTimeout(()=>{const z=$("z");if(z)z.oninput=bind(i,"zones");init3d(i)},0),"")}
function section(){const i=cur(),d=i.sections[S.sec];return `<button class="alt" onclick="go('tour')">← Tour de la maison</button><h2>${S.sec}</h2>`+d.constats.map((c,n)=>`<div class="card"><b>${esc(c.comp)}</b><p><b>Anomalie :</b> ${esc(c.ano)}</p>${(c.mes||[]).length?`<p><b>Lecture d'appareil :</b> ${esc(mesLines(c).join(" ; "))}</p>`:""}${c.role?`<p><b>Rôle :</b> ${esc(c.role)}</p>`:""}<p><b>Conséquence :</b> ${esc(c.cons)}</p><p><b>Recommandation :</b> ${esc(c.rec)}</p>${c.photo?`<img class="ph" src="${c.photo}" alt="Photo du constat">`:""}<button class="alt" onclick="delC(${n})">Supprimer</button></div>`).join("")+`<div class="card"><h2 style="margin-top:0">Nouveau constat</h2><button class="alt" onclick="dicter()">🎤 Dicter les 5 étapes</button><div id="dic" class="mut" style="margin-top:6px"></div><label for="c1">1. Identification de la composante</label><input id="c1"><label for="c2">2. Anomalie / symptôme</label><textarea id="c2"></textarea><label for="cr">3. Rôle de la composante (à quoi elle sert)</label><textarea id="cr" placeholder="Ex. : retient la terre et soutient la maison"></textarea><label for="c3">4. Conséquence / impact (le risque, puis ce qui peut arriver avec le temps)</label><textarea id="c3"></textarea><label for="c4">5. Recommandation (sans cause, sans méthode de réparation, sans coûts)</label><textarea id="c4"></textarea><div class="row" style="margin-top:8px"><button class="alt" type="button" onclick="chkForm()">🔎 Vérifier la formulation</button></div><div id="chkx" class="mut" role="status" aria-live="polite" style="margin-top:6px"></div><label for="ph">Photo</label><input id="ph" type="file" accept="image/*" capture="environment" onchange="loadAN(this.files[0])"><div id="anbox"></div><label for="lgd">Légende des photos (ce qu'on voit et où)</label><input id="lgd" placeholder="Ex. : fissure horizontale, mur nord du sous-sol"><div style="margin-top:10px"><button onclick="addC()">Ajouter le constat</button></div></div><label class="row" style="margin:12px 0"><input type="checkbox" style="width:auto" ${d.rien?"checked":""} onchange="cur().sections[S.sec].rien=this.checked;save();render()"> Aucune anomalie observée dans cette section</label>`}
function delC(n){cur().sections[S.sec].constats.splice(n,1);save();render()}
function addC(){const c={comp:$("c1").value.trim(),ano:$("c2").value.trim(),cons:$("c3").value.trim(),rec:$("c4").value.trim(),role:($("cr")||{value:""}).value.trim()};if(!c.comp||!c.ano||!c.cons||!c.rec){alert("Remplis les 4 étapes du constat.");return}

function pedago(){const i=cur(),N=SECTIONS.length;S.pi=S.pi||0;
const all=SECTIONS.flatMap(s=>i.sections[s].constats.map(c=>({...c,sec:s})));

if(S.pi===0){const cnt=p=>all.filter(c=>(c.prio||"À surveiller")===p).length;

const IDB={db:null,open(){return new Promise((res,rej)=>{const r=indexedDB.open("lisa",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},get(k){return new Promise((res,rej)=>{const t=this.db.transaction("kv").objectStore("kv").get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>rej(t.error)})},set(k,v){return new Promise((res,rej)=>{const t=this.db.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}};

async function exportBk(){const d=JSON.stringify({app:"Lisa",v:1,at:new Date().toISOString(),list:S.list,prof:S.prof||{},ag:S.ag||[],cn:S.cn||{},nt:S.nt||[]});try{await DL.save({filename:"lisa-sauvegarde-"+new Date().toISOString().slice(0,10)+".json",data:d});try{localStorage.setItem("lisa_bk",new Date().toISOString())}catch(e){}S.bkm="";render()}catch(e){if(!e||e.code!=="declined")alert("Impossible d'exporter ("+((e&&e.code)||"erreur")+").")}}
function importBk(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(o.app!=="Lisa"||!Array.isArray(o.list))throw 0;const ids=new Set(S.list.map(i=>i.id));let k=0;o.list.forEach(i=>{if(i&&i.id&&!ids.has(i.id)){S.list.push(i);k++}});S.list.sort((a,b)=>b.id-a.id);if(o.prof&&!(S.prof&&S.prof.sig))S.prof=o.prof;if(Array.isArray(o.ag)){S.ag=S.ag||[];const ai=new Set(S.ag.map(v=>v.id));o.ag.forEach(v=>{if(v&&v.id&&!ai.has(v.id))S.ag.push(v)});agSave()}if(Array.isArray(o.nt)){S.nt=S.nt||[];const ni=new Set(S.nt.map(x=>x.id));o.nt.forEach(x=>{if(x&&x.id&&typeof x.txt==="string"&&!ni.has(x.id))S.nt.push(x)});S.nt.sort((a,b)=>b.id-a.id);ntSave()}if(o.cn&&typeof o.cn==="object"){S.cn=S.cn||{};Object.keys(o.cn).forEach(k=>{if(!S.cn[k])S.cn[k]=o.cn[k]})}save();S.bkm=k+" inspection(s) ajoutée(s), "+(o.list.length-k)+" déjà présente(s) et non modifiée(s)."}catch(e){S.bkm="Fichier invalide : ce n'est pas une sauvegarde Lisa."}render()};r.readAsText(f)}
const ENTCL=["Nature de l'inspection : visuelle et non destructive, limitée aux éléments accessibles le jour de la visite, selon la norme BNQ 3009-500 (Pratiques pour l'inspection en vue d'une transaction immobilière). L'inspecteur agit à titre de généraliste.","Ce que l'inspection n'est pas : elle ne constitue ni une garantie contre les vices cachés, ni une police d'assurance, ni une garantie d'assurabilité.","Éléments cachés ou inaccessibles : ils ne sont pas inspectés. Les zones non inspectées et leurs raisons sont consignées au rapport.","Déclaration du vendeur : le rapport la complète et ne la remplace pas.","Coûts : le rapport ne contient aucune estimation du coût des réparations.","Utilisation du rapport : il est destiné au client signataire et à l'immeuble désigné. Les renseignements personnels sont traités conformément à la Loi 25.","Expertise technique : l'inspection n'est pas une expertise et ne comprend pas l'intervention de professionnels (ingénieur, entrepreneur spécialisé, etc.). Si une expertise est recommandée, le client choisit son intervenant. Une expertise réalisée par l'inspecteur exige un contrat écrit distinct.","Services additionnels : toute nouvelle visite ou tout service supplémentaire fait l'objet d'une nouvelle entente.","Personnes concernées : le client s'assure que les propriétaires, les locataires et toute autre personne ayant un droit sur le bâtiment sont informés du déroulement de l'inspection et de ses préalables.","Force majeure : l'inspecteur n'est pas responsable d'un retard ou d'une impossibilité d'exécuter l'inspection causés par un événement imprévisible et irrésistible.","Lois applicables : l'entente est régie par les lois du Québec. Si une clause est déclarée invalide, les autres demeurent en vigueur.","Norme de pratique : l'inspecteur respecte la norme BNQ 3009-500 (édition 2022 R1) à chaque étape de l'inspection, y compris la signature du rapport d'inspection.","Conflit d'intérêts : l'inspecteur divulgue par écrit toute situation d'apparence de conflit d'intérêts dès qu'il la constate. Il ne réalise pas l'inspection sans cette divulgation et sans le consentement écrit du client.","Collaboration : si l'inspecteur s'adjoint un autre titulaire de certificat pour une partie de l'inspection, il conserve la direction et la responsabilité de l'inspection (art. 2101 C.c.Q.), y participe activement et signe le rapport.","Responsabilité : l'inspecteur titulaire du certificat et, le cas échéant, l'entreprise au nom de laquelle il contracte sont solidairement responsables des obligations prévues à l'entente. Aucune clause de l'entente n'exclut la responsabilité civile prévue par le droit commun.","Dossier et confidentialité : le dossier d'inspection est conservé au moins 6 ans. Le rapport et le dossier ne sont remis à un tiers qu'avec le consentement écrit du client, sauf exceptions prévues par la loi. Le client reçoit une copie de l'entente dans les 15 jours suivant sa signature.","Le client confirme avoir lu et compris la portée de l'entente et les limites de l'inspection."];
function sigPad(cv,o){const w=cv.clientWidth||320;cv.width=w;cv.height=150;const x=cv.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,150);x.lineWidth=2.2;x.lineCap="round";x.strokeStyle="#000";
if(o.sig){const im=new Image();im.onload=()=>x.drawImage(im,0,0,w,150);im.src=o.sig}
let dr=0;const p=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top]};
cv.onpointerdown=e=>{dr=1;cv.setPointerCapture(e.pointerId);const[a,b]=p(e);x.beginPath();x.moveTo(a,b)};
cv.onpointermove=e=>{if(!dr)return;dr=2;const[a,b]=p(e);x.lineTo(a,b);x.stroke()};
cv.onpointerup=()=>{const ok=dr===2;dr=0;if(!ok)return;o.sig=cv.toDataURL("image/png");o.sigAt=new Date().toISOString();save()}}

for(let gi=0;gi<gs.length;gi++)for(const d of (S.et.docs[gs[gi]]||[])){if(!d.an)continue;let P=null;try{P=await IDB.get("etxt:"+d.id)}catch(e){}if(Array.isArray(P))P.forEach((t,i)=>all.push({doc:d.name,page:i+1,text:t,n:etNorm(t),w:gi===0?1.3:1}))}
if(!all.length)return out;const N=all.length,df={};ts.forEach(w=>{df[w]=all.reduce((a,p)=>a+(p.n.includes(w)?1:0),0)});
all.forEach(p=>{let s=ts.reduce((a,w)=>{const c=p.n.split(w).length-1;return a+(c?Math.log(1+c)*Math.log(1+N/(1+df[w])):0)},0);
const ls=p.n.split("\n");let hb=0;ls.forEach(l=>{if(l.length<100){const m=ts.filter(w=>l.includes(w)).length;if(m>=2||(ts.length===1&&m===1))hb+=m}});s+=Math.min(hb,6)*1.2;

// Suivi des notes : double seuil du C.E.I. (50 % à l'examen final + moyenne globale de 60 %)
function etGL(cid){const g=S.et.gr||(S.et.gr={});return g[cid]||(g[cid]=[])}
function etNum(v){if(v===undefined||v===null)return null;const t=String(v).replace(",",".").replace("%","").trim();if(t==="")return null;const n=parseFloat(t);return isFinite(n)?n:null}
function etGCalc(cid){const L=etGL(cid).map(i=>({...i,p:etNum(i.p),g:etNum(i.g)})),T=L.reduce((a,i)=>a+(i.p||0),0),r={T,n:L.length};
if(!L.length||T<=0){r.msg="Ajoute tes évaluations avec leur poids (en %) pour voir où tu en es.";r.k="mut";return r}
const gr=L.filter(i=>i.g!==null&&i.p>0),E=gr.reduce((a,i)=>a+i.p*i.g/100,0),W=gr.reduce((a,i)=>a+i.p,0),fin=L.find(i=>i.f);r.E=E;r.W=W;r.avgNow=W>0?E/W*100:null;
const wrn=Math.abs(T-100)>0.01?"⚠ Le total des poids fait "+(Math.round(T*10)/10)+" % (il devrait faire 100 %). ":"";
if(fin&&fin.g!==null&&fin.p>0){const rest=L.filter(i=>i!==fin&&i.p>0&&i.g===null);
 if(!rest.length){const avg=E/T*100;r.avg=avg;const okF=fin.g>=50,okA=avg>=60;
  if(okF&&okA){r.k="ok";r.msg=wrn+"✅ Cours réussi : examen final "+etR(fin.g)+" % (minimum 50 %) et moyenne globale "+etR(avg)+" % (minimum 60 %)."}
  else if(!okF){r.k="ko";r.msg=wrn+"❌ Échec : l'examen final est sous 50 %. La note inscrite au relevé serait celle de l'examen ("+etR(fin.g)+" %), même si ta moyenne est de "+etR(avg)+" %."}
  else{r.k="ko";r.msg=wrn+"❌ Échec : la moyenne globale est de "+etR(avg)+" %, sous le seuil de 60 %."}
  return r}
 r.msg=wrn+"Examen final passé ("+etR(fin.g)+" %). Il reste des évaluations sans note : entre-les pour voir le résultat.";r.k="mut";return r}
const nf=L.filter(i=>i!==fin&&i.p>0),nfg=nf.filter(i=>i.g!==null),nfu=nf.filter(i=>i.g===null);
if(!fin){r.msg=wrn+"Moyenne actuelle sur ce qui est noté : "+(r.avgNow===null?"—":etR(r.avgNow)+" %")+". Ajoute ton examen final (coche « Examen final ») pour calculer la note qu'il te faut.";r.k="mut";return r}
if(!(fin.p>0)){r.msg="Donne un poids à l'examen final.";r.k="mut";return r}
let a=null;if(nfg.length){const w=nfg.reduce((x,i)=>x+i.p,0);a=nfg.reduce((x,i)=>x+i.p*i.g,0)/w}
let Ep=E,proj="";if(nfu.length){if(a===null){r.msg=wrn+"Entre au moins une note pour estimer la note qu'il te faut à l'examen final.";r.k="mut";return r}Ep=E+a*nfu.reduce((x,i)=>x+i.p,0)/100;proj=" (en supposant que le reste de tes évaluations se passe comme ta moyenne actuelle de "+etR(a)+" %)"}
const need=(0.6*T-Ep)/fin.p*100,req=Math.max(50,Math.ceil(need*10)/10);r.need=req;
if(req>100){r.k="ko";r.msg=wrn+"⚠ Même 100 % à l'examen final ne suffirait pas à atteindre 60 % de moyenne"+proj+"."}
else{r.k=req>=80?"warn":"mut";r.msg=wrn+"🎯 À l'examen final, il te faut au moins "+etR(req)+" %"+(req===50?" (le minimum du Guide : 50 %)":"")+" pour réussir le cours"+proj+"."}
return r}

<div class="card" id="bres">${etGHtml(sel)}</div>${sum?`<h2>Vue d'ensemble</h2><div class="card">${sum}</div>`:""}<div class="mut" style="margin-top:8px">Estimation seulement : la note officielle est celle de ton relevé C.E.I. Une pénalité de langue jusqu'à 10 % peut s'appliquer, elle n'est pas comptée ici.</div>`}

async function etFind(){const o=$("fdout");if(!o)return;const q=(S.efq||"").trim();if(!q){o.textContent="Écris d'abord un ou deux mots.";return}
const ts=etTerms(q);if(!ts.length){o.textContent="Essaie avec des mots plus précis.";return}
o.textContent="⏳ Recherche…";const pages=[];
for(const cid of ["ref",...ETU_COURS.map(c=>c.id)])for(const d of (S.et.docs[cid]||[])){if(!d.an)continue;let P=null;try{P=await IDB.get("etxt:"+d.id)}catch(e){}if(Array.isArray(P))P.forEach((t,i)=>pages.push({id:d.id,doc:d.name,page:i+1,t,n:etNorm(t)}))}
if(!pages.length){o.textContent="Aucun document analysé : ajoute d'abord tes PDF dans 📚 Références ou dans un cours.";return}
const need=ts.length,hs=new Map(),rx=ts.map(w=>new RegExp("\\b"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"))),has=(s)=>rx.filter(r=>r.test(s)).length;
const res=[];for(const p of pages){if(has(p.n)<need)continue;let occ=0;ts.forEach(w=>{let i=-1,c=0;while((i=p.n.indexOf(w,i+1))>=0&&c<20){c++}occ+=c});res.push({p,occ})}
// titres d'articles
const re=/(\d{1,2}(?:\.\d+){1,4})\.\s+([A-ZÀ-Ý][^\n.]{3,85})/g;
for(const p of pages){let m;re.lastIndex=0;while((m=re.exec(p.t))){if(/,\s*\d+\s*$/.test(m[2]))continue;const tn=etNorm(m[2]),h=has(tn);if(h>=(ts.length<=2?ts.length:Math.ceil(ts.length*0.66))){const k=m[1];const cur=hs.get(k);if(!cur||h>cur.h)hs.set(k,{num:k,title:m[2].trim(),h,p})}}}
const cnt=new Map(),PT={9:"Maisons et petits bâtiments"};
for(const p of pages){let m;re.lastIndex=0;while((m=re.exec(p.t))){if(/,\s*\d+\s*$/.test(m[2]))continue;const ti=m[2].replace(/\s+\d+(?:\.\d+)*\s*$/,"").trim();if(ti.length<4)continue;const k=m[1]+"|"+ti;cnt.set(k,(cnt.get(k)||0)+1)}const pm=p.t.match(/Partie\s+(\d)\s+([A-ZÀ-Ý][^\n]{4,70})/);}
const dict={};for(const [k,c] of cnt){const [n,ti]=k.split("|");if(!dict[n]||c>dict[n].c||(c===dict[n].c&&ti.length<dict[n].t.length))dict[n]={t:ti,c}}
const chain=(num)=>{const a=num.split("."),out=[];out.push("Partie "+a[0]+(PT[a[0]]?" "+PT[a[0]]:""));for(let i=2;i<=a.length;i++){const n=a.slice(0,i).join(".");out.push(n+(dict[n]?" "+dict[n].t:""))}return out};
const divOf=(p)=>{const m=p.t.match(/Division\s+([ABC])\b/);return m?"Division "+m[1]:""};
res.sort((a,b)=>b.occ-a.occ);const top=res.slice(0,10);
for(const r of top.slice(0,6)){const p=r.p;let pos=-1;for(const w of ts){const i=p.n.search(new RegExp("\\b"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")));if(i>=0&&(pos<0||i<pos))pos=i}if(p.n.length!==p.t.length)pos=-1;let m,best=null;re.lastIndex=0;while((m=re.exec(p.t))){if(/,\s*\d+\s*$/.test(m[2]))continue;if(pos>=0&&m.index>pos)break;best=m}if(best&&!hs.has(best[1])&&best[2].length<=60&&!/\b(Lorsque|Si|Division|Le |La |Les |Un |Une )/.test(best[2]))hs.set(best[1],{num:best[1],title:best[2].replace(/\s+\d+(?:\.\d+)*\s*$/,"").trim(),h:0.5,p,near:1})}
const H=[...hs.values()].sort((a,b)=>b.h-a.h||((b.num[0]==="9"&&b.num[1]===".")-(a.num[0]==="9"&&a.num[1]==="."))||a.num.localeCompare(b.num,undefined,{numeric:true})).slice(0,10);

{h:3,t:"Quels bâtiments sont exemptés du chapitre I ?",a:"Notamment : établissement d'affaires de 2 étages ou moins, commercial de 300 m² ou moins, habitation de 2 étages ou moins ou 8 logements ou moins (sauf RPA). Un bâtiment à usages multiples n'est pas exempté.",p:"Lire le « ou » et le « et » mot à mot.",k:"exemptions chapitre usages logements étages",f:"Formulation exacte (ET/OU) à vérifier dans l'article 1.04 de ton Code."},

const nums=(etqN(s.q).match(/\b\d{1,2}\s*h(?:\s*\d\d)?\b|\b\d+(?:[.,]\d+)?\s*(?:heures?|jours?|ans?|mois|%|m2|m²|\$|etages?|logements?)/g)||[]);nums.forEach(x=>det.push(x.trim()));

${mots.length?`<div style="margin-top:8px"><b>Mots-pièges dans les choix</b>${mots.map(m=>`<div style="font-size:14px">Option ${L(m[0])} : ${m[1].map(esc).join(", ")}</div>`).join("")}</div>`:""}

async function etqShrink(f){const url=URL.createObjectURL(f);try{const im=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=url});const m=1600,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);return await new Promise(ok=>c.toBlob(b=>ok(b||f),"image/jpeg",.85))}finally{URL.revokeObjectURL(url)}}

{id:"impl",t:"Implantation du bâtiment",r:"On place la maison sur le terrain au bon endroit et à la bonne hauteur, avant d'excaver. C'est la première vraie étape du chantier.",s:["L'arpenteur-géomètre repère les limites du terrain.","Il marque les coins du bâtiment selon le plan d'implantation.","On vérifie les marges de recul exigées par la municipalité.","On fixe le niveau de référence (la hauteur du dessus des fondations par rapport à la rue et au terrain).","On délimite l'excavation en tenant compte de la profondeur et de l'espace pour travailler autour des murs."],i:["Le bâtiment respecte-t-il les marges ? (à signaler, non à mesurer au centimètre)","La hauteur du terrain permet-elle à l'eau de s'éloigner de la maison ?"],w:[["Arpenteur-géomètre","Professionnel qui mesure le terrain et fait le plan d'implantation."],["Niveau de référence","Repère de hauteur à partir duquel tout est construit."]]}
]},
{id:"fond",ic:"🧱",t:"Fondations",b:"Sol, semelles, murs, drainage et dalle : la base qui supporte toute la maison.",rec:"Recueil Inspection structure, chapitre 1 (sols, semelles, fondations)",subs:[
{id:"sol",t:"Le sol et sa capacité portante",r:"Le sol doit pouvoir porter la maison sans bouger. Le type de sol (roc, sable, gravier, argile) et l'eau qu'il contient changent tout.",s:["On observe le terrain : pente, drainage, arbres, anciens remblais.","Au besoin, un ingénieur fait une étude de sol.","On identifie le type de sol. Le roc et le gravier portent bien. L'argile bouge avec l'humidité.","On repère le niveau de l'eau souterraine.","On décide du type de fondation et de la taille des semelles selon la capacité portante."],i:["Fissures qui s'élargissent, portes qui frottent, planchers inclinés : signes de tassement.","Terrain en pente instable, remblai récent.","Arbres très près de la maison sur sol argileux."],c:"9.12 Excavation (sol non remanié, profondeur minimale). 9.15 Fondations et semelles de fondation.",w:[["Capacité portante","Pression que le sol peut supporter sans s'affaisser."],["Tassement","Descente du bâtiment quand le sol cède. Il est dangereux s'il est inégal."],["Argile","Sol qui gonfle avec l'eau et rétrécit à la sécheresse."]]},
{id:"excav",t:"Excavation",r:"On creuse jusqu'à un sol solide, sous la limite du gel, avec assez d'espace pour travailler autour des murs.",s:["On enlève la terre végétale et on la met de côté.","On creuse la cavité à la profondeur prévue au plan.","On atteint le sol non remanié, c'est-à-dire un sol qui n'a jamais été déplacé.","On vérifie la profondeur par rapport à la limite de pénétration du gel (souvent autour de 1,2 m, selon la région et le sol).","On garde une pente de talus sécuritaire et on pompe l'eau au besoin.","On nivelle le fond de l'excavation avant de former les semelles."],i:["Fondations sur un remblai ou un sol dérangé : risque de tassement inégal.","Semelles qui ne descendent pas sous le gel dans un espace non chauffé (garage, galerie).","Fissures près des coins ou des descentes de sous-sol."],c:"9.12.2.1 Excavation jusqu'au sol non remanié. 9.12.2.2 Profondeur minimale.",w:[["Sol non remanié","Sol naturel qui n'a pas été déplacé ni compacté par des travaux."],["Limite de pénétration du gel","Profondeur jusqu'où le sol gèle en hiver."],["Gélivité","Soulèvement du sol quand l'eau qu'il contient gèle."]]},
{id:"sem",t:"Semelles",r:"La semelle est la base de béton plus large que le mur. Elle répartit le poids de la maison sur le sol.",s:["On installe les coffrages de la semelle avec les bons niveaux.","On met en place, au besoin, l'armature et les clés ou adents (rainure pour retenir le mur).","On coule le béton et on le nivelle.","On laisse durcir et on retire les coffrages après la prise.","Les semelles des colonnes intérieures se coulent en même temps ou à part."],i:["Semelles visibles ou trop étroites dans une fondation ancienne.","Fissures verticales qui s'élargissent vers le haut ou le bas : un côté qui bouge.","Marques d'eau ou de rouille au pied du mur."],c:"9.15.3 Semelles (exigences, appui, largeur et surface de base).",w:[["Semelle filante","Semelle continue sous un mur."],["Semelle isolée","Semelle sous une colonne."],["Adent","Rainure qui retient le mur sur la semelle."]]},
{id:"murs",t:"Murs de fondation",r:"Les murs de fondation retiennent la terre et supportent la maison. On les fait surtout en béton coulé; il existe aussi les blocs de béton et la pierre dans les maisons plus anciennes.",s:["On monte les coffrages des murs sur les semelles.","On met les ouvertures (fenêtres, entrée de service) et les passages de tuyaux.","On coule le béton en couches, puis on le vibre pour chasser l'air.","On laisse le béton durcir : c'est la cure.","On retire les coffrages, on bouche les trous de tiges et on surveille les fissures.","On fixe la lisse d'assise au sommet avec des boulons d'ancrage."],i:["Fissures horizontales ou en escalier : poussée du sol.","Murs qui penchent vers l'intérieur.","Efflorescence (dépôt blanc), infiltrations, nids d'abeilles (béton mal vibré).","Blocs fissurés, mortier désagrégé, pierre qui s'effrite (fondations anciennes)."],c:"9.15.4 Murs de fondation. 9.15.5 Supports de poutres et solives des murs de fondation en maçonnerie. 9.20 Murs en maçonnerie et en coffrages à béton isolants non en contact avec le sol (murs hors sol).",w:[["Cure du béton","Période pendant laquelle le béton durcit et gagne sa résistance."],["Poussée du sol","Force que le sol exerce sur le mur."],["Boulon d'ancrage","Boulon scellé dans le béton pour fixer la lisse d'assise."]]},
{id:"hum",t:"Imperméabilisation et drainage des fondations",r:"On protège les murs de l'humidité et on évacue l'eau loin de la fondation. Un bon drainage est la meilleure protection du sous-sol.",s:["On prépare la surface du mur extérieur : trous bouchés, surface propre.","On applique un matériau bitumineux ou une membrane de protection contre l'humidité.","On pose un tuyau de drainage perforé de 100 mm autour de la semelle, avec une légère pente.","On l'entoure de pierre concassée, enveloppée dans un géotextile (tissu qui filtre la terre).","On raccorde le drain à un point d'évacuation (égout, puisard ou autre).","On ajoute au besoin un drain vertical jusqu'à la semelle et un puits de fenêtre drainé."],i:["Humidité, salpêtre, rouille ou moisissure au sous-sol, surtout après la pluie.","Puisard qui ne se vide pas ou pompe constamment.","Sol rehaussé contre le revêtement ou nivelé vers la maison.","Gouttières qui rejettent l'eau près des fondations."],c:"9.13.2 Protection contre l'humidité. 9.13.3 Imperméabilisation. 9.14.2 Drainage des fondations. 9.14.3 Tuyaux de drainage. 9.14.4 Drainage par matériau granulaire.",w:[["Drain agricole","Tuyau perforé autour de la fondation qui collecte l'eau."],["Géotextile","Tissu qui laisse passer l'eau mais retient les particules de terre."],["Puisard","Fosse qui récupère l'eau du drain, avec une pompe au besoin."]]},
{id:"dalle",t:"Dalle de sous-sol et remblai",r:"Une fois les canalisations sous-sol installées, on prépare la base de la dalle et on la coule. On remblaie ensuite autour des murs.",s:["On installe la plomberie qui passe sous le plancher du sous-sol.","On étend de 100 à 150 mm de pierre concassée bien compactée sous la dalle (valeur courante).","On pose une protection contre l'humidité et, si prévu, un isolant.","On coule la dalle de béton (environ 75 mm minimum) et on la finit.","On remblaie autour des murs avec une terre propre qui s'égoutte bien, en général après la pose du plancher du rez-de-chaussée, qui retient le haut des murs.","On façonne le terrain pour que l'eau s'éloigne du bâtiment."],i:["Dalle fissurée, soulevée ou affaissée.","Eau qui monte par les joints ou une fissure.","Murs de fondation poussés vers l'intérieur : remblai trop lourd, terre argileuse.","Pente du terrain dirigée vers la fondation."],c:"9.16 Planchers sur sol (dalle sur sol, infiltration d'eau, pression hydrostatique, avaloirs de sol).",w:[["Dalle sur sol","Plancher de béton coulé directement sur le sol granulaire."],["Remblai","Terre remise autour des murs après les travaux."],["Pression hydrostatique","Poussée de l'eau souterraine contre la dalle ou les murs."]]}
]},
{id:"plan",ic:"🪵",t:"Planchers, poutres et poteaux",b:"La charpente horizontale : lisse d'assise, solives, poutres, colonnes et sous-plancher.",rec:"Recueil Inspection structure, chapitre 2 (planchers, poutres, poteaux)",subs:[
{id:"lisse",t:"Lisse d'assise et solive de rive",r:"La lisse d'assise est la pièce de bois posée sur le béton. Elle reçoit les solives et fait le lien entre la fondation et le bois.",s:["On met un joint d'étanchéité (mousse ou isolant) sur le dessus du mur de béton.","On pose la lisse d'assise, un bois de 38 × 89 mm, fixée aux boulons d'ancrage.","On pose la solive de rive tout autour, au bord extérieur du plancher.","On isole la solive de rive et on scelle l'air autour.","On place les solives sur la lisse."],i:["Pourriture de la lisse : humidité au contact du béton.","Lisse sans bois traité, mal ancrée ou absente.","Fuite d'air et d'humidité autour de la solive de rive."],c:"9.23 Constructions à ossature de bois (lisse d'assise, solives). 9.25 Contrôle du transfert de chaleur, des fuites d'air et de la condensation.",w:[["Lisse d'assise","Pièce de bois posée sur le mur de fondation."],["Solive de rive","Solive de bordure qui ferme le plancher tout autour."]]},
{id:"sol",t:"Solives de plancher",r:"Les solives sont les pièces de bois horizontales qui portent le plancher. Elles s'appuient sur les murs de fondation, sur la lisse et sur une poutre au centre.",s:["On place les solives à entraxe constant (par exemple 400 mm ou 600 mm).","On pose les entretoises (croix de renfort) pour garder les solives droites.","On double les solives sous les cloisons ou les ouvertures importantes.","On perce ou entaille le bois avec soin : les passages de tuyaux et de câbles sont limités.","On vérifie les portées. Le bois d'ingénierie (poutrelles en I) permet de grandes portées."],i:["Solives entaillées ou percées au mauvais endroit.","Solives fendues, pourries, tachées d'humidité.","Plancher qui rebondit ou qui s'affaisse.","Balcon en porte-à-faux mal soutenu."],c:"9.23 Constructions à ossature de bois (solives de plancher, entretoises, ouvertures).",w:[["Entraxe","Distance entre les centres de deux pièces voisines."],["Portée","Distance sur laquelle une solive est libre entre deux appuis."],["Bois d'ingénierie","Solives en I ou poutres composées fabriquées en usine."]]},
{id:"poutre",t:"Poutres et colonnes",r:"La poutre porte les solives au milieu de la maison. Les colonnes (poteaux) la soutiennent et descendent jusqu'à une semelle.",s:["On installe la colonne sur une semelle.","On pose la poutre (bois, acier ou bois d'ingénierie) sur les colonnes et dans les murs de fondation.","On vérifie que la poutre est bien appuyée à chaque extrémité.","On fixe les solives sur la poutre ou au-dessus.","On vérifie le niveau et la verticalité des colonnes."],i:["Colonne qui penche, rouille ou n'est pas fixée.","Colonne sans semelle (posée sur la dalle seulement).","Poutre qui fléchit, fendue, trop petite ou mal appuyée.","Colonne de jack-post improvisée ou temporaire laissée en place."],c:"9.17 Poteaux (colonnes de la charpente). 9.23 Constructions à ossature de bois (poutres).",w:[["Poutre","Pièce horizontale qui reprend la charge des solives."],["Colonne","Poteau vertical qui soutient une poutre."],["Jack-post","Colonne métallique ajustable souvent utilisée comme support temporaire."]]},
{id:"sp",t:"Sous-plancher",r:"Le sous-plancher est la grande surface plane qui couvre les solives. Il porte les charges du plancher fini.",s:["On étend la colle de construction sur le dessus des solives.","On pose les panneaux (contreplaqué bouveté ou panneaux de copeaux orientés) en les décalant d'un rang à l'autre.","On laisse un petit espace de dilatation entre les panneaux.","On visse ou on cloue selon l'espacement prévu.","On laisse la surface sèche et protégée de la pluie."],i:["Planchers qui craquent ou qui sont gonflés par l'humidité.","Panneaux gauchis ou décollés des solives.","Pourriture sous une salle de bain ou une toilette."],c:"9.23 Constructions à ossature de bois (sous-planchers).",w:[["Panneau OSB","Panneau de copeaux de bois orientés."],["Bouveté","Panneau à rainures qui s'emboîtent."]]}
]},
{id:"murs",ic:"🏠",t:"Murs",b:"Ossature à plateforme, linteaux, murs porteurs et revêtement intermédiaire.",rec:"Recueil Inspection structure, chapitre 3 (murs)",subs:[
{id:"oss",t:"Ossature des murs extérieurs",r:"Les murs sont faits de poteaux de bois verticaux (par exemple 38 × 140 mm), espacés de 400 ou 600 mm, fermés en haut et en bas par des sablières et des lisses.",s:["On assemble les murs au sol, à plat sur la plateforme.","Chaque mur comprend une lisse basse, des poteaux et une sablière doublée en haut.","On redresse les murs et on les attache.","On croise les sablières aux coins pour solidifier la liaison.","On contrevente temporairement les murs pour qu'ils restent d'équerre.","On pose le plancher de l'étage suivant, et on recommence."],i:["Murs gauchis ou qui penchent.","Bois pourri à la base d'un mur (infiltration).","Coin ouvert ou mal lié.","Contreventement absent ou enlevé."],c:"9.23 Constructions à ossature de bois (murs, poteaux, sablières). 9.24 Ossature murale en poteaux de tôle d'acier.",w:[["Charpente à plateforme","Chaque étage est construit sur une plateforme, puis les murs montés dessus."],["Sablière","Pièce horizontale posée en haut des poteaux."],["Contreventement","Éléments qui empêchent le mur de se déformer."]]},
{id:"lint",t:"Ouvertures et linteaux",r:"Chaque fenêtre ou porte coupe des poteaux. Le linteau est la poutre au-dessus de l'ouverture qui reporte la charge sur les côtés.",s:["On tire les ouvertures sur le plan, avec leur largeur réelle.","On met des poteaux doublés ou des jambages de chaque côté.","On pose un linteau, souvent en bois double, dimensionné selon la largeur et les charges.","On ajoute des poteaux courts sous la fenêtre (appui) et au-dessus du linteau.","On laisse un espace pour l'isolant dans le linteau."],i:["Fissures aux coins des fenêtres.","Linteau qui fléchit, pourri ou trop petit.","Linteau d'acier rouillé dans un mur de brique."],c:"9.23 Constructions à ossature de bois (linteaux et ouvertures dans les murs).",w:[["Linteau","Poutre au-dessus d'une ouverture."],["Jambage","Poteau qui borde l'ouverture."]]},
{id:"mp",t:"Murs porteurs et cloisons",r:"Un mur porteur supporte les planchers ou le toit. Une cloison sépare simplement les pièces. Les confondre est une erreur coûteuse en rénovation.",s:["Les murs porteurs sont alignés avec les poutres et les solives qu'ils soutiennent.","Les cloisons sont construites avec des poteaux de 38 × 89 mm.","On double les solives sous une cloison parallèle quand il le faut.","On évite de retirer ou d'ouvrir un mur porteur sans calcul d'un ingénieur."],i:["Mur porteur retiré ou ouvert sans renfort.","Poutre de remplacement trop petite ou mal appuyée.","Fissures ou affaissement près d'une ouverture agrandie."],c:"9.23 Constructions à ossature de bois.",w:[["Mur porteur","Mur qui supporte une charge de la structure."],["Cloison","Mur qui ne supporte que son propre poids."]]}
]},
{id:"toit",ic:"🏚️",t:"Toit",b:"Structure, support, couverture, solins, ventilation et évacuation de l'eau.",rec:"Recueil Inspection structure, chapitre 4 (toits). Inspection extérieure (session 2)",subs:[
{id:"struct",t:"Structure du toit : fermes ou chevrons",r:"Le toit est porté soit par des fermes préfabriquées (assemblages triangulaires faits en usine), soit par des chevrons montés sur place.",s:["On pose les fermes ou les chevrons à entraxe constant (souvent 600 mm).","On fixe les contreventements pour que les fermes restent droites.","On vérifie les appuis sur les murs et les attaches.","On prolonge la structure pour former les débords de toit.","On ne coupe pas les membrures d'une ferme et on ne la perce pas sans avis d'un ingénieur."],i:["Ferme coupée, entaillée ou chargée de façon inhabituelle.","Faîtage qui s'affaisse, chevrons fendus, structure humide.","Contreventement absent, ferme décollée.","Poutre ou mur modifié sous un toit à fermes."],c:"9.23 Constructions à ossature de bois (toits, chevrons, fermes).",w:[["Ferme de toit","Assemblage triangulaire préfabriqué qui porte le toit."],["Chevron","Pièce inclinée qui porte le toit, montée sur place."],["Faîtage","Ligne la plus haute du toit."]]},
{id:"supp",t:"Support de couverture et protection du débord",r:"Le support (panneaux de bois) reçoit la couverture. Au bord du toit, une membrane autocollante protège contre les retours d'eau (glaçons).",s:["On pose les panneaux de support sur les fermes en les décalant.","On fixe un petit jeu entre les panneaux, avec des agrafes en H si on le prévoit.","On pose la membrane autocollante au bord du toit et dans les noues.","On étend la sous-couche sur le reste de la surface.","On pose le larmier métallique au bord."],i:["Panneaux gonflés, pourris ou affaissés.","Taches d'eau sur le dessous du support.","Barrages de glace récurrents au bord du toit."],c:"9.26 Couvertures.",w:[["Larmier","Bord métallique qui égoutte l'eau loin du mur."],["Noue","Creux formé par deux pans de toit qui se rencontrent."]]},
{id:"couv",t:"Couverture, solins et pénétrations",r:"La couverture (le plus souvent en bardeaux d'asphalte) est la peau du toit. Les solins étanchent chaque jonction : cheminée, mur, évent, noue.",s:["On pose le premier rang de bardeaux, puis on monte rang par rang.","On installe les solins à chaque jonction : cheminée, noue, mur, évents de plomberie.","On scelle autour des évents avec des garnitures étanches.","On finit le faîtage avec des bardeaux de faîte ou un aérateur.","On inspecte les clous et les joints avant de quitter le toit."],i:["Bardeaux usés, bombés, manquants ou avec perte de granules.","Solins décollés, rouillés ou mal scellés (cheminée, mur).","Évents ou cheminées non solinés.","Mousse, moisissure ou taches sur le toit."],c:"9.26 Couvertures. 9.21 Cheminées et conduits de fumée en maçonnerie et en béton.",w:[["Solin","Bande métallique qui empêche l'eau d'entrer aux jonctions."],["Bardeau d'asphalte","Matériau de couverture le plus courant au Québec."]]},
{id:"vent",t:"Isolation et ventilation de l'entretoit",r:"L'entretoit est l'espace sous le toit. On l'isole beaucoup au plafond et on le ventile pour évacuer la chaleur et l'humidité.",s:["On pose le pare-vapeur au plafond, du côté chaud de l'isolant, et on le scelle.","On étend l'isolant (cellulose, fibre minérale) sur toute la surface.","On installe un déflecteur au bord du toit pour garder une lame d'air.","On crée des entrées d'air (soffites) et des sorties (faîtage, pignon).","On scelle les ouvertures dans le plafond (luminaires, trappe) pour limiter les fuites d'air chaud."],i:["Isolant tassé, mouillé ou absent sur le dessus.","Givre ou moisissure sous le support de toit.","Soffites bloqués, entrées d'air obstruées.","Conduit de ventilation de salle de bain qui rejette dans l'entretoit."],c:"9.19 Vides sous toit (ventilation). 9.25 Contrôle du transfert de chaleur, des fuites d'air et de la condensation. 9.36 Efficacité énergétique.",w:[["Entretoit","Espace entre le plafond et la toiture."],["Déflecteur","Panneau qui garde un passage d'air au bord du toit."],["RSI","Résistance thermique en unités SI (plus c'est haut, mieux ça isole)."]]},
{id:"deb",t:"Débords, soffites et gouttières",r:"Le débord éloigne l'eau des murs. Les soffites ferment le dessous. Les gouttières et les descentes recueillent l'eau et la rejettent loin de la maison.",s:["On construit le débord du toit avec des pièces de bois fixées aux fermes.","On pose la bordure de toit et les fourrures pour fixer les soffites.","On installe les soffites perforés pour laisser entrer l'air.","On fixe les gouttières avec une légère pente vers les descentes.","On relie les descentes à un rejet qui éloigne l'eau des fondations."],i:["Gouttières obstruées, détachées ou sans pente.","Descentes qui rejettent l'eau contre la fondation.","Soffites ou bordures pourris, nids d'insectes.","Taches de ruissellement sur les murs."],c:"9.26 Couvertures. 9.14.5 Évacuation des eaux (gouttières, descentes).",w:[["Soffite","Panneau qui ferme le dessous du débord de toit."],["Descente pluviale","Tuyau qui descend l'eau d'une gouttière jusqu'au sol."]]}
]},
{id:"ouv",ic:"🪟",t:"Fenêtres, portes et revêtement extérieur",b:"Les ouvertures, puis le revêtement qui protège les murs de la pluie.",rec:"Inspection extérieure (session 2). Recueil IAP, chapitre 2",subs:[
{id:"fen",t:"Pose des fenêtres et des portes",r:"On pose les fenêtres et les portes quand l'ossature et le toit sont finis. Le raccord avec le mur doit être étanche à l'eau et à l'air.",s:["On vérifie que l'ouverture est d'équerre et de bonne dimension.","On pose un solin d'appui sous la fenêtre, avec des digues aux extrémités.","On installe la fenêtre d'aplomb, au niveau, et on la fixe selon les instructions du fabricant.","On isole le pourtour (mousse basse expansion, isolant) et on scelle l'intérieur.","On pose un larmier au-dessus et on raccorde la membrane pare-air.","On termine par le calfeutrage extérieur."],i:["Calfeutrage fissuré, absent ou en mauvais état autour des fenêtres.","Solin de couronnement ou larmier absent.","Fenêtre déformée, coincée, buée entre les vitres.","Pourriture du cadre ou de l'appui."],c:"9.7 Fenêtres, portes et lanterneaux (9.7.6 Installation). 9.25 Contrôle du transfert de chaleur, des fuites d'air et de la condensation.",w:[["Solin d'appui","Solin sous la fenêtre qui renvoie l'eau vers l'extérieur."],["Calfeutrage","Scellant souple pour boucher les joints."]]},
{id:"mem",t:"Membrane pare-air et revêtement intermédiaire",r:"Sur l'ossature, on pose un revêtement intermédiaire puis une membrane qui laisse sortir la vapeur mais retient l'eau et le vent.",s:["On fixe le revêtement intermédiaire sur les poteaux (panneaux de copeaux ou autre).","On déroule la membrane en commençant par le bas, en chevauchant chaque rang sur celui du dessous (comme des bardeaux).","On rubane les joints et on scelle les ouvertures.","On colle ou on solin autour des fenêtres.","On installe des fourrures verticales pour créer une lame d'air derrière le revêtement."],i:["Membrane déchirée ou mal chevauchée.","Pourriture à la base des murs.","Lame d'air absente ou bouchée derrière le bardage."],c:"9.25.3 Systèmes d'étanchéité à l'air. 9.27 Revêtement extérieur.",w:[["Membrane pare-air","Membrane qui coupe le vent et l'eau mais laisse sortir la vapeur."],["Lame d'air","Espace derrière le revêtement qui permet au mur de sécher."]]},
{id:"rev",t:"Revêtement extérieur : bardage et brique",r:"Le revêtement est la première défense contre la pluie. Il peut être en bardage (bois, fibre, vinyle, métal), en brique, en stuc ou en pierre.",s:["On pose les fourrures et les moulures d'angle, de fenêtre et de soffite.","On installe le bardage en commençant par le bas, avec un peu de jeu pour la dilatation.","Pour la brique, on pose les attaches métalliques tous les 400 × 600 mm environ, un solin au bas du mur et des chantepleures.","On pose les linteaux de brique en acier au-dessus des ouvertures.","On termine par le calfeutrage aux jonctions."],i:["Bardage fendu, décollé, déformé ou pourri.","Brique fissurée, joints de mortier effrités, efflorescence.","Chantepleures bouchées ou absentes, solins manquants.","Sol rehaussé contre le bas du mur."],c:"9.27 Revêtement extérieur. 9.28 Stucco. 9.20 Murs en maçonnerie et coffrages à béton isolants.",w:[["Chantepleure","Petite ouverture au bas d'un mur de brique qui évacue l'eau."],["Attache de brique","Pièce métallique qui retient la brique au mur."]]}
]},
{id:"env",ic:"🧊",t:"Isolation, pare-air et pare-vapeur",b:"L'enveloppe thermique : garder la chaleur et l'humidité du bon côté du mur.",rec:"Inspection extérieure et intérieure (session 2). Code 9.25 et 9.36",subs:[
{id:"iso",t:"Isolation thermique",r:"L'isolant ralentit le passage de la chaleur. Plus la valeur RSI est élevée, plus il isole. Il doit remplir complètement l'espace, sans être écrasé.",s:["On isole les murs entre les poteaux, du côté intérieur.","On isole la solive de rive et le haut du mur de fondation.","On ajoute de l'isolant à l'intérieur des murs de fondation.","On étend l'isolant au plafond (souvent le plus épais) et on garde le déflecteur en place.","On vérifie que l'isolant n'est pas mouillé ni écrasé."],i:["Isolant manquant, tassé ou humide.","Ponts thermiques : endroits sans isolant qui font des taches froides.","Isolation insuffisante pour l'âge de la maison."],c:"9.36 Efficacité énergétique. 9.25 Contrôle du transfert de chaleur, des fuites d'air et de la condensation.",w:[["RSI","Résistance thermique en unités SI."],["Pont thermique","Endroit où la chaleur passe plus facilement à travers le mur."]]},
{id:"pa",t:"Pare-air",r:"Le pare-air arrête les courants d'air qui traversent l'enveloppe. Sans lui, la chaleur et l'humidité s'échappent par les fuites.",s:["On choisit un système continu : membrane, panneaux ou joints scellés.","On scelle tous les joints, les perforations et les jonctions (fenêtres, planchers, plafonds).","On étanchéise les boîtiers électriques et les passages de fils.","On vérifie la continuité au sommet et à la base des murs."],i:["Courants d'air autour des fenêtres, des prises, de la trappe de grenier.","Taches de saleté sur l'isolant (air qui le traverse).","Joints non scellés ou rubans détachés."],c:"9.25.3 Systèmes d'étanchéité à l'air.",w:[["Pare-air","Barrière continue contre les fuites d'air."]]},
{id:"pv",t:"Pare-vapeur",r:"Le pare-vapeur, souvent une feuille de polyéthylène de 0,15 mm, se pose du côté chaud (intérieur) pour empêcher la vapeur d'eau de se condenser dans le mur.",s:["On pose le polyéthylène sur la face intérieure des poteaux, par-dessus l'isolant.","On le chevauche et on le scelle à tous les joints.","On le prolonge au plafond et à la solive de rive.","On le scelle autour des boîtiers électriques et des passages.","On le recouvre ensuite avec le gypse."],i:["Pare-vapeur absent ou déchiré.","Moisissure ou isolant mouillé dans le mur.","Condensation ou givre dans l'entretoit."],c:"9.25.4 Pare-vapeur.",w:[["Pare-vapeur","Barrière qui retient la vapeur d'eau."],["Condensation","Eau qui se forme quand l'air humide touche une surface froide."]]}
]},
{id:"sys",ic:"🔌",t:"Plomberie, électricité, chauffage et ventilation",b:"Les systèmes qui font vivre la maison, installés après la charpente et avant les finis.",rec:"Système électrique (session 2). Plomberie et chauffage (session 3)",subs:[
{id:"plb",t:"Plomberie",r:"La plomberie amène l'eau potable aux appareils et évacue les eaux usées. Les tuyaux se posent avant la finition des murs.",s:["On installe les canalisations sous la dalle avant de la couler.","On monte les colonnes de drainage et les évents jusqu'au toit.","On tire les tuyaux d'alimentation (eau chaude et froide) jusqu'aux appareils.","On installe les gros appareils comme le bain et la douche.","On met le chauffe-eau et on le raccorde.","On teste l'étanchéité avant de fermer les murs."],i:["Fuites, taches d'eau, rouille sur les tuyaux.","Matériaux anciens : plomb, acier galvanisé.","Évents absents, siphons mal faits, mauvais drainage.","Pression d'eau faible, chauffe-eau vieux ou rouillé."],c:"9.31 Équipements sanitaires. Le Code de plomberie (chapitre III) traite le détail des installations.",w:[["Évent","Tuyau qui laisse entrer l'air dans le réseau de drainage."],["Siphon","Garde d'eau qui bloque les odeurs d'égout."]]},
{id:"elec",t:"Installation électrique",r:"L'électricité entre par l'entrée de service, passe par le panneau, puis se divise en circuits qui alimentent prises, luminaires et appareils.",s:["On installe l'entrée de service et le compteur.","On pose le panneau principal avec ses disjoncteurs.","On tire les câbles dans les murs et les plafonds avant l'isolation.","On installe les boîtiers étanches à l'air dans les murs extérieurs.","On branche les prises, interrupteurs et luminaires à la fin du chantier.","On installe les avertisseurs de fumée et de monoxyde de carbone selon les exigences."],i:["Panneau à fusibles ou vieux, panneau encombré ou sans identification.","Câblage ancien, fils dénudés ou mal raccordés.","Prises mal mises à la terre, rallonges comme solution permanente.","Avertisseurs de fumée absents ou périmés."],c:"9.34 Installations électriques. Le chapitre V du Code (CCÉ modifié) traite les installations. 9.10.19 Avertisseurs de fumée.",w:[["Entrée de service","Point où l'électricité arrive à la maison."],["Disjoncteur","Dispositif qui coupe un circuit en cas de surcharge."]]},
{id:"chv",t:"Chauffage et ventilation",r:"Le chauffage donne la chaleur et la ventilation renouvelle l'air. Les deux ont leurs conduits posés avant la finition des murs.",s:["On installe le générateur de chaleur (fournaise, chaudière, thermopompe ou autre).","On pose les conduits d'air ou les tuyaux d'eau chaude.","On installe les ventilateurs d'extraction (salle de bain, cuisine).","On monte le ventilateur récupérateur de chaleur (VRC) avec ses prises d'air et ses évacuations isolées.","On raccorde les conduits de fumée et on prévoit l'alimentation en air de combustion.","On met en marche et on règle le système à la fin du chantier."],i:["Âge et état du générateur, filtres encrassés, conduits abîmés.","Évacuations de ventilation qui rejettent dans l'entretoit.","Conduit de fumée mal supporté, rouillé ou mal raccordé.","Chambres ou pièces sans chauffage ni ventilation adéquats."],c:"9.32 Ventilation. 9.33 Chauffage et conditionnement d'air. 9.21 Cheminées et conduits de fumée.",w:[["VRC","Ventilateur récupérateur de chaleur : il renouvelle l'air en récupérant la chaleur."],["Air de combustion","Air frais dont un appareil à combustion a besoin."]]}
]},
{id:"fin",ic:"🎨",t:"Finition intérieure",b:"Gypse, planchers, menuiserie, peinture et raccordements des appareils.",rec:"Inspection intérieure (session 2). Recueil IAP, chapitre 2",subs:[
{id:"gyp",t:"Gypse, plafonds et murs",r:"Quand l'enveloppe est finie et les systèmes installés, on ferme les murs et les plafonds avec des plaques de plâtre (gypse).",s:["On vérifie que le pare-vapeur et l'isolation sont complets.","On fixe les plaques de gypse aux poteaux et aux solives de plafond.","On tire les joints avec du ruban et du composé, en plusieurs couches.","On ponce et on prépare les surfaces pour la peinture.","On protège les ouvertures pour la poussière du chantier."],i:["Fissures aux joints, clous qui ressortent.","Taches d'eau, cernes, moisissure sur le gypse.","Plafond qui s'affaisse ou qui est bombé."],c:"9.29 Revêtements intérieurs de finition des murs et plafonds.",w:[["Gypse","Plaque de plâtre entre deux feuilles de papier."]]},
{id:"pl",t:"Planchers et menuiserie de finition",r:"On pose les revêtements de sol (bois, céramique, vinyle, tapis), puis les portes, les cadres, les plinthes et les boiseries.",s:["On prépare le sous-plancher : propre, de niveau, sec.","On pose le revêtement de sol selon son type.","On installe les portes intérieures, les cadres et les plinthes.","On pose les escaliers finis, les mains courantes et les garde-corps.","On retouche les surfaces qui seront peintes."],i:["Plancher qui gondole, craque ou est de niveau inégal.","Portes qui frottent ou qui ne ferment pas.","Garde-corps trop bas, lâches ou espacés de façon dangereuse.","Marches de hauteur inégale."],c:"9.30 Revêtements de sol. 9.8 Escaliers, rampes, mains courantes et garde-corps.",w:[["Plinthe","Moulure au bas d'un mur."],["Main courante","Barre qu'on tient en montant l'escalier."]]},
{id:"rac",t:"Peinture, armoires et raccordements",r:"On peint, puis on installe les armoires et les appareils. Le plombier, l'électricien et le chauffagiste finissent leurs raccordements.",s:["On applique la peinture ou le vernis.","On installe les armoires et le dosseret.","Le plombier raccorde les appareils sanitaires.","L'électricien installe prises, luminaires et avertisseurs.","Le chauffagiste pose les grilles, les registres et les plinthes.","On teste chaque système avant la remise des clés."],i:["Appareil mal raccordé ou qui fuit.","Prise qui ne fonctionne pas, avertisseur absent.","Fissures de calfeutrage autour d'un évier, d'une baignoire ou d'une douche."],c:"9.31 Équipements sanitaires. 9.34 Installations électriques.",w:[["Dosseret","Bande de matériau entre le comptoir et les armoires du haut."]]}
]},
{id:"fini",ic:"🏁",t:"Aménagement extérieur et réception",b:"Dernières étapes : nivellement, entrées, terrasses, inspection finale et garantie.",rec:"Recueil IAP, chapitre 2. Inspection extérieure (session 2)",subs:[
{id:"niv",t:"Nivellement final et aménagement paysager",r:"On finit le terrain : pente qui éloigne l'eau de la maison, entrée, allées, terrasse, plantations.",s:["On fait le nivellement final avec une pente qui éloigne l'eau de la fondation.","On construit l'entrée d'auto, les marches et les allées.","On aménage la terrasse et la clôture, au besoin.","On plante arbres, arbustes et couvre-sol à bonne distance de la maison.","On installe le système d'arrosage s'il y en a un."],i:["Pente vers la maison, flaques près des fondations.","Marches ou allées qui se soulèvent ou penchent vers la maison.","Arbres ou arbustes trop près des murs ou de la toiture.","Terrasse mal ancrée, garde-corps lâche."],c:"9.14.6 Écoulement des eaux de surface. 9.8 Escaliers, rampes, mains courantes et garde-corps.",w:[["Nivellement","Mise en pente du terrain."]]},
{id:"rec",t:"Réception du bâtiment et garantie",r:"À la fin des travaux, le propriétaire fait la visite de réception avec l'entrepreneur et note les défauts. Pour une maison neuve, le plan de garantie protège l'acheteur.",s:["On fait la visite de réception avec l'entrepreneur.","On note par écrit les défauts apparents et les travaux inachevés.","On signe la liste, avec les délais de correction.","Le plan de garantie (GCR) couvre ensuite, selon la durée : malfaçons, vices cachés et vices majeurs.","Le propriétaire fait les dénonciations à l'administrateur du plan dans les délais."],i:["Y a-t-il une liste écrite des défauts apparents à la réception ?","Quelle garantie s'applique et quels délais courent ?","Les anciennes garanties (fenêtres, toiture) sont-elles transférables ?"],c:"La garantie des bâtiments résidentiels neufs relève du règlement sur le plan de garantie, administré par la GCR. À valider avec tes recueils (cours Lois).",w:[["Réception","Moment où le propriétaire accepte le bâtiment avec ses réserves."],["Dénonciation","Avis écrit d'un défaut à l'entrepreneur ou à l'administrateur."]]}
]}

const csNorm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const csKey=(a,b)=>a+":"+b;
function csSeen(k){return !!(((S.et.cons||{}).seen||{})[k])}
function csTot(){let n=0,v=0;ETC.forEach(a=>a.subs.forEach(b=>{n++;if(csSeen(csKey(a.id,b.id)))v++}));return{n,v,p:n?Math.round(v*100/n):0}}
function csStProg(a){let v=0;a.subs.forEach(b=>{if(csSeen(csKey(a.id,b.id)))v++});return v}
function csTog(k,v){const c=S.et.cons||(S.et.cons={});c.seen=c.seen||{};if(v)c.seen[k]=1;else delete c.seen[k];etSave();const t=csTot(),a=$("csp"),b=$("cspb");if(a)a.textContent=t.v+"/"+t.n+" sujets vus";if(b)b.style.width=t.p+"%";const e=$("csst"),x=S.cs&&ETC.find(z=>z.id===S.cs.st);if(e&&x)e.textContent=csStProg(x)+"/"+x.subs.length+" sujets vus"}
function csSub(a,b){const k=csKey(a.id,b.id),oid="cso_"+a.id+"_"+b.id;
return `<details class="card" style="padding:0" ${S.cs&&S.cs.open===k?"open":""} ontoggle="if(this.open&&S.cs)S.cs.open='${k}'"><summary style="padding:12px;cursor:pointer;display:flex;gap:10px;align-items:center"><input type="checkbox" style="width:24px;height:24px;flex:none;margin:0" ${csSeen(k)?"checked":""} onclick="event.stopPropagation()" onchange="csTog('${k}',this.checked)" aria-label="Sujet vu"><span><b>${esc(b.t)}</b></span></summary><div style="padding:0 12px 12px">
<div style="margin-bottom:8px">${esc(b.r)}</div>
${csDraw(k)}
<div class="mut"><b>Étape par étape</b></div><ol style="margin:4px 0 8px;padding-left:20px">${b.s.map(x=>`<li>${esc(x)}</li>`).join("")}</ol>
<div class="mut"><b>🔎 Ce que l'inspecteur regarde</b></div><ul style="margin:4px 0 8px;padding-left:20px">${b.i.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
${b.c?`<div class="mut"><b>📖 Où voir dans le Code</b></div><div style="margin:4px 0 8px">${esc(b.c)}</div>`:""}
${b.w&&b.w.length?`<div class="mut"><b>🔤 Mots à connaître</b></div><ul style="margin:4px 0 8px;padding-left:20px">${b.w.map(w=>`<li><b>${esc(w[0])}</b> : ${esc(w[1])}</li>`).join("")}</ul>`:""}
<div class="row"><button class="alt" onclick="csAsk('${a.id}','${b.id}')">💡 Expliquer autrement</button><button class="alt" onclick="csAsk('${a.id}','${b.id}','quiz')">🧠 Me poser une question</button></div><div id="${oid}" style="margin-top:8px;white-space:pre-wrap"></div></div></details>`}
async function csAsk(aid,bid,mode){const a=ETC.find(x=>x.id===aid),b=a&&a.subs.find(x=>x.id===bid),o=$("cso_"+aid+"_"+bid);if(!b||!o)return;
const base="Tu aides un étudiant de l'AEC en inspection de bâtiment (Québec, Collège C.E.I.). Sujet de construction : « "+b.t+" » (étape : "+a.t+"). Résumé de départ : "+b.r+" Étapes : "+b.s.join(" ; ")+".";
const pr=mode==="quiz"?base+" Pose UNE question de compréhension en français (pas de choix multiples), sans donner la réponse. Attends la réponse de l'étudiant.":base+" Explique ce sujet autrement, en français simple, avec une analogie du quotidien, en 8 à 10 lignes maximum. Reste prudent : n'invente aucun article du Code ni aucune dimension, et dis « à vérifier » si tu n'es pas certain. Termine par une question pour vérifier que l'étudiant a compris.";
o.textContent="⏳ …";try{const r=await etAI(pr);if(r.copied){o.textContent=r.text;return}o.textContent=(r.text||"").trim()+"\n\n(Explication d'une IA : reformule-la avec tes mots et valide avec tes recueils.)"}catch(e){o.textContent="⚠ "+aiErr(e)}}
function csRes(){const o=$("csres");if(!o)return;const q=csNorm((S.cs&&S.cs.q)||"").trim();if(!q){o.innerHTML="";return}
const ts=q.split(/\s+/).filter(Boolean);const hits=[];ETC.forEach(a=>a.subs.forEach(b=>{const h=csNorm([a.t,b.t,b.r,b.s.join(" "),b.i.join(" "),b.c,(b.w||[]).map(w=>w.join(" ")).join(" ")].join(" "));if(ts.every(t=>h.includes(t)))hits.push([a,b])}));
o.innerHTML=hits.length?`<div class="mut">${hits.length} sujet${hits.length>1?"s":""} trouvé${hits.length>1?"s":""}</div>`+hits.map(([a,b])=>`<div class="mut" style="margin-top:8px">${a.ic} ${esc(a.t)}</div>`+csSub(a,b)).join(""):`<div class="mut">Aucun sujet ne correspond. Essaie un autre mot (ex. : drain, solin, linteau).</div>`}
function csQ(v){S.cs.q=v;csRes();const l=$("cslist");if(l)l.style.display=v.trim()?"none":""}

const AIDE={"Structure": ["Fondations, planchers, murs, colonnes, poutres, plafonds et charpente de toit : observer et décrire chacun.", "Si un élément semble détérioré, le sonder légèrement avec un outil pointu, sans l'abîmer ni te mettre en danger. Un échantillon suffisant suffit quand il y en a plusieurs pareils.", "Vide sanitaire et comble : entrer seulement si le passage est dégagé, sain et sécuritaire. Note comment tu y as accédé (ou pourquoi pas) dans « Méthode d'observation »."], "Extérieur": ["Revêtements des murs, boiseries et solins; fenêtres et portes permanentes; entrées, terrasses, balcons, perrons, marches, porches et garde-corps; avant-toits, fascias et sous-faces.", "Porte de garage : indique si la commande électrique et le système de sécurité existent, et si la porte repart ou s'arrête quand elle rencontre une résistance en se fermant. Fais fonctionner les portes extérieures.", "Terrain : végétation, pentes du sol, évacuation des eaux et murs de soutènement, quand ils peuvent nuire au bâtiment."], "Toiture": ["Revêtement, évacuation des eaux de toit, solins, lanterneaux, extérieur des cheminées et éléments qui traversent le toit.", "Écris comment tu as observé la toiture (à pied, à l'échelle, aux jumelles, au drone…) dans « Méthode d'observation ». Pas de marche sur le toit si c'est dangereux ou si ça peut l'abîmer."], "Plomberie": ["Tuyauterie d'entrée d'eau et de distribution : matériaux. Robinet d'arrêt principal : où il est.", "Fais couler les robinets (intérieurs et extérieurs) et actionne les chasses. Cherche fuites, écoulement lent, eau jaunâtre ou rougeâtre dans le puisard.", "Drains de plancher, clapet antiretour, regards de nettoyage, puisard et pompes : présence ou absence; fais démarrer les pompes avec leur commande normale.", "Chauffe-eau : type, capacité, source d'énergie, année de fabrication, emplacement, robinet d'arrêt, soupape de sûreté et son évacuation, évent ou cheminée. Réservoir de combustible : emplacement, année, fuites, supports et tuyauterie.", "Ne manœuvre pas les robinets d'arrêt ni les soupapes de sûreté."], "Électricité": ["Branchement d'entrée (aérien ou souterrain), mise à la terre, coffret principal (intensité inscrite, emplacement), panneaux (protections, capacité affichée, emplacement).", "Ouvre les panneaux seulement si c'est sécuritaire; sinon écris pourquoi. N'insère jamais d'outil ni de sonde dedans.", "Un échantillon d'éclairages, d'interrupteurs et de prises : fonctionnement, polarité, mise à la terre. DDFT : fonctionnement et absence là où il en faut. Disjoncteurs détecteurs d'arc : présence ou absence.", "Câblage de dérivation : vérifie qu'il convient à sa protection (fusible ou disjoncteur)."], "Chauffage": ["Systèmes installés en permanence : source d'énergie, type d'appareil, commandes normales, dispositifs de sécurité, extérieur des cheminées et conduits, distribution (conduits, tuyaux, radiateurs, registres, filtres).", "Fais-les fonctionner avec les commandes normales. Ouvre les panneaux d'accès que le propriétaire ouvre lui-même, sans outil.", "Note s'il y a une source de chaleur permanente dans chaque pièce habitable, le sous-sol non aménagé et le vide sanitaire. Réservoir de combustible : emplacement, année, fuites, supports, tuyauterie.", "Chauffage d'appoint et appareils à combustible solide : hors du mandat de base, sauf entente écrite."], "Climatisation": ["Source d'énergie, type d'appareil et emplacement, drainage de l'eau de condensation, conduits de distribution.", "Fais fonctionner avec les commandes normales. Les appareils amovibles ou portatifs ne sont pas visés."], "Intérieur": ["Murs, planchers, plafonds; marches, escaliers, balcons, garde-corps; armoires et comptoirs; fenêtres et portes intérieures (quincaillerie); séparation entre le garage et les pièces habitables.", "Fais fonctionner un échantillon de fenêtres et de portes : une par pièce.", "Note toute infiltration, tache d'eau ou de condensation et toute trace qui a l'apparence de moisiss let DICT=null;
function dictBtn(id){const ok=!!(window.SpeechRecognition||window.webkitSpeechRecognition);

function dictSt(id,t){const e=document.getElementById(id+"_st");if(e)e.textContent=t}
function dictStop(){if(!DICT)return;const d=DICT;DICT=null;try{d.rec.onend=null;d.rec.stop()}catch(e){}const b=document.getElementById(d.id+"_mic");if(b){b.textContent="🎙 Dicter";b.style.background="";b.style.color=""}}
function dictToggle(id){
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(DICT){const same=DICT.id===id;dictStop();dictSt(id,"Dictée arrêtée.");if(same)return}
if(!SR){dictSt(id,"Dictée non disponible ici : utilise le micro du clavier de ton téléphone (Gboard).");return}
const ta=document.getElementById(id);if(!ta)return;
const rec=new SR();rec.lang="fr-CA";rec.continuous=true;rec.interimResults=true;
DICT={id,rec};
const b=document.getElementById(id+"_mic");if(b){b.textContent="⏹ Arrêter";b.style.background="#c0392b";b.style.color="#fff"}
dictSt(id,"🔴 J'écoute…");
rec.onresult=ev=>{const el=document.getElementById(id);if(!el){dictStop();return}
let fin="",tmp="";
for(let k=ev.resultIndex;k<ev.results.length;k++){const r=ev.results[k],t=r[0].transcript;if(r.isFinal)fin+=t;else tmp+=t}
if(fin.trim()){const cur0=el.value,sep=cur0&&!/\s$/.test(cur0)?" ":"";el.value=cur0+sep+fin.trim();el.dispatchEvent(new Event("input",{bubbles:true}))}
dictSt(id,tmp?"🔴 "+tmp:"🔴 J'écoute…")};
rec.onerror=ev=>{const m=ev.error==="not-allowed"||ev.error==="service-not-allowed"?"Micro refusé ou bloqué ici. Utilise le micro du clavier (Gboard) ou autorise le micro.":ev.error==="no-speech"?"":ev.error==="audio-capture"?"Aucun micro détecté.":"Dictée interrompue ("+ev.error+").";
if(ev.error==="no-speech")return;dictStop();dictSt(id,m)};
rec.onend=()=>{if(DICT&&DICT.rec===rec){try{rec.start()}catch(e){dictStop();dictSt(id,"Dictée arrêtée.")}}};
try{rec.start()}catch(e){dictStop();dictSt(id,"Impossible de démarrer la dictée.")}}
